<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; media-src 'self' https: blob:; connect-src 'self' https: wss://*.supabase.co; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Serif+KR:wght@300;400;600&family=Zhi+Mang+Xing&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
.tp { --c0: #3f7fd8; --c1: #df4f68; --c2: #d6921a; --c3: #2a2d36; --jk: #8a5cf0; font-family: 'IBM Plex Sans KR', var(--sans); }
.tp .back { display: inline-block; margin-bottom: 10px; font-size: 13px; color: rgba(255,255,255,.6); text-decoration: none; }
.tp .back:hover { color: #fff; }
.tp .sub { margin: 4px 0 0; font-size: 13px; color: rgba(255,255,255,.6); }
.tp .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255,255,255,.75); padding: 5px 11px; border-radius: 999px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); }

/* 타일 */
.tl { display: inline-grid; place-items: center; width: 34px; height: 46px; border-radius: 7px; font: 800 18px/1 'JetBrains Mono', monospace; font-style: normal; cursor: pointer; user-select: none;
  background: linear-gradient(180deg, #fffdf8, #efe8da); box-shadow: 0 2px 0 #cfc5b1, 0 4px 10px -4px rgba(0,0,0,.5); transition: transform .12s, box-shadow .12s; position: relative; }
.tl.c0 { color: var(--c0); } .tl.c1 { color: var(--c1); } .tl.c2 { color: var(--c2); } .tl.c3 { color: var(--c3); } .tl.jk { color: var(--jk); font-size: 20px; }
.tl::after { content: ""; position: absolute; left: 50%; bottom: 6px; width: 10px; height: 2px; margin-left: -5px; border-radius: 2px; background: currentColor; opacity: .35; }
.tl.sel { transform: translateY(-6px); box-shadow: 0 0 0 2px #ffd56b, 0 8px 16px -6px rgba(255,200,80,.7); }
.tl.nw { box-shadow: 0 2px 0 #cfc5b1, 0 0 0 2px rgba(143,200,255,.75); }
.tl.nw.sel { box-shadow: 0 0 0 2px #ffd56b, 0 8px 16px -6px rgba(255,200,80,.7); }
.tl.back-t { background: linear-gradient(160deg, #3b3560, #221f3a); box-shadow: 0 2px 0 #15132a; cursor: default; }
.tl.back-t::after { display: none; }
.tl.sm { width: 22px; height: 30px; font-size: 12px; border-radius: 5px; }

/* 판 */
.ttg { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 14px; }
.twho { display: grid; gap: 8px; align-content: start; }
.twho > .mt-btn { justify-self: start; }
.tpc { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; }
.tpc .av { width: 38px; height: 38px; border-radius: 50%; background: #2a2742 center / cover; flex: none; border: 1px solid rgba(255,255,255,.2); }
.tpc b { display: block; font-size: 14px; color: #fff; } .tpc small { font-size: 11.5px; color: rgba(255,255,255,.55); }
.tpc .cnt { margin-left: auto; text-align: right; } .tpc .cnt b { font: 700 16px 'JetBrains Mono', monospace; } .tpc .cnt small { display: block; }
.tpc.on { box-shadow: inset 0 0 0 1px rgba(255,213,107,.8), 0 0 18px -6px rgba(255,213,107,.6); }
.tpc.out { opacity: .4; }
.tpc .clk { font: 700 12px 'JetBrains Mono', monospace; color: #ffd56b; }
.ttbl { min-height: 300px; padding: 14px; border-radius: 16px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 10px; }
.ttbl .emp { width: 100%; padding: 60px 0; text-align: center; color: rgba(255,255,255,.4); font-size: 13px; }
.meld { display: inline-flex; gap: 3px; padding: 6px; border-radius: 10px; background: rgba(255,255,255,.05); border: 1px dashed rgba(255,255,255,.12); cursor: pointer; }
.meld.bad { border: 1px solid rgba(255,95,133,.8); background: rgba(255,95,133,.08); }
.meld.drop { border-color: rgba(255,213,107,.8); }
.track { margin-top: 12px; padding: 12px; border-radius: 16px; }
.track .tiles { display: flex; flex-wrap: wrap; gap: 5px; min-height: 52px; }
.tacts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
.tacts .info { margin-left: auto; font-size: 12px; color: rgba(255,255,255,.6); }
.tacts .info.no { color: #ff8aa3; }
.tlog { max-height: 160px; overflow: auto; padding: 10px 12px; font-size: 12px; line-height: 1.7; color: rgba(255,255,255,.65); border-radius: 14px; }
.twait { max-width: 560px; margin: 0 auto; padding: 22px; border-radius: 18px; }
.twait .seats { display: grid; gap: 8px; margin: 14px 0; }
.twait .seat.empty { justify-content: center; color: rgba(255,255,255,.35); font-size: 13px; min-height: 58px; border: 1px dashed rgba(255,255,255,.15); }
.amt { display: flex; gap: 6px; } .amt button { flex: 1; }
.bet-ask { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(5,6,12,.6); backdrop-filter: blur(8px); padding: 16px; }
.bet-ask .box { width: min(360px, 100%); padding: 20px; border-radius: 18px; }
.res-t { text-align: center; } .res-t h2 { font: 700 26px 'IBM Plex Sans KR', var(--sans); color: #fff; margin: 6px 0 4px; } .res-t p { color: rgba(255,255,255,.6); font-size: 13px; }
.res-l { display: grid; gap: 8px; margin: 16px 0; }
.res-l .tpc .chg { margin-left: auto; font: 700 13px 'IBM Plex Sans KR', var(--sans); } .chg.up { color: #8ff0c0; } .chg.dn { color: #ff8aa3; }
@media (max-width: 860px) { .ttg { grid-template-columns: 1fr; } .twho { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); } }
@media (max-width: 560px) { .tl { width: 28px; height: 38px; font-size: 15px; } .meld { padding: 4px; } .ttbl { min-height: 220px; padding: 10px; } }
</style>
</head>
<body data-page="match" class="mt-noir" data-nofooter>
<main class="mt-wrap tp">
  <a class="back" href="match.html">← 대국</a>
  <section class="mt-view" id="v-lobby">
    <div class="mt-head"><div><h1>삼사라 패</h1><p class="sub">숫자 타일을 맞춰서 먼저 손패를 다 털면 이겨요 · 2 ~ 3명</p></div><span class="mt-today" id="st"><span class="mt-orb"></span><b>불러오는 중…</b></span></div>
    <div class="lobby"><div class="rooms" id="rooms"></div>
      <aside class="gl open">
        <div class="tabhd"><span class="tab"><i></i>방 열기</span><span class="ln"><i></i><i></i><i></i></span></div>
        <label class="lb">걸 스탯 · 이긴 사람이 진 사람들이 건 것을 가져가요</label>
        <div class="seg" id="o-stat"><button type="button" class="on" data-s="외모">외모</button><button type="button" data-s="재력">재력</button></div>
        <label class="lb">걸 만큼</label>
        <div class="seg amt" id="o-n">${[1,2,3,4,5]}</div>
        <div class="ft"><span class="left"></span><button type="button" class="mt-btn w" id="o-go">방 열기</button></div>
      </aside></div>
  </section>
  <section class="mt-view" id="v-wait" hidden></section>
  <section class="mt-view" id="v-game" hidden></section>
  <section class="mt-view" id="v-res" hidden></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/common.js"></script>
<script>
App.ready.then(async user => {
  if (!user) { location.replace('login.html?next=tiles.html'); return; }
  const po = await Store.playOpen('match').catch(() => ({ open: false }));
  if (!po.open) { playClosed($('.mt-wrap'), 'match'); return; }
  const DEMO = Store.mode === 'demo';
  const show = id => ['v-lobby', 'v-wait', 'v-game', 'v-res'].forEach(v => $('#' + v).hidden = v !== id);
  const ago = iso => { const m = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 6e4)); return m < 1 ? '방금' : m + '분 전'; };
  const avStyle = h => { h = h ? ((window.headMp4 && headMp4(h) || {}).poster || h) : ''; return h ? `background-image:url('${esc(h)}')` : ''; };

  // 타일: (색 * 13 + 숫자 - 1) * 2 + 벌 · 104 · 105 는 별
  const num = t => t >= 104 ? 0 : ((t >> 1) % 13) + 1, col = t => t >= 104 ? -1 : Math.floor(t / 26);
  const tileHTML = (t, cls = '') => `<i class="tl ${t >= 104 ? 'jk' : 'c' + col(t)} ${cls}" data-t="${t}">${t >= 104 ? '✦' : num(t)}</i>`;
  const meldPts = m => {   // 맞으면 점수 · 틀리면 -1 (보여 주기용 · 실제 검사는 서버)
    const L = m.length; if (L < 3 || L > 13) return -1;
    const ns = m.filter(t => t < 104).map(num), cs = m.filter(t => t < 104).map(col); if (!ns.length) return -1;
    if (L <= 4 && new Set(ns).size === 1 && new Set(cs).size === cs.length) return ns[0] * L;
    if (new Set(cs).size === 1 && new Set(ns).size === ns.length) { const mn = Math.min(...ns), mx = Math.max(...ns); if (mx - mn + 1 <= L) { const s = Math.min(mn, 14 - L); return (2 * s + L - 1) * L / 2; } }
    return -1;
  };
  const sortMeld = m => {   // 보기 좋게: 이어지는 줄은 숫자순 (별은 빈 자리에) · 같은 숫자는 색깔순
    const J = m.filter(t => t >= 104), N = m.filter(t => t < 104);
    if (N.length && new Set(N.map(num)).size === 1) return [...N].sort((a, b) => col(a) - col(b)).concat(J);
    if (N.length && new Set(N.map(col)).size === 1 && new Set(N.map(num)).size === N.length) {
      const mn = Math.min(...N.map(num)), mx = Math.max(...N.map(num)), L = m.length, s = Math.min(mn, 14 - L), out = [], j = [...J];
      if (mx - mn + 1 <= L && L <= 13) { for (let v = s; v < s + L; v++) { const t = N.find(x => num(x) === v); out.push(t != null ? t : j.shift()); } return out; }
    }
    return [...N].sort((a, b) => num(a) - num(b) || col(a) - col(b)).concat(J);
  };

  /* ───────── 로비 ───────── */
  let stat = '외모', amtN = 1, status = {};
  $('#o-n').innerHTML = [1, 2, 3, 4, 5].map(n => `<button type="button" data-n="${n}" class="${n === 1 ? 'on' : ''}">${n}</button>`).join('');
  $('#o-stat').onclick = e => { const b = e.target.closest('[data-s]'); if (!b) return; stat = b.dataset.s; $$('#o-stat button').forEach(x => x.classList.toggle('on', x === b)); };
  $('#o-n').onclick = e => { const b = e.target.closest('[data-n]'); if (!b) return; amtN = +b.dataset.n; $$('#o-n button').forEach(x => x.classList.toggle('on', x === b)); };
  $('#o-go').onclick = async e => { e.target.disabled = true; try { const id = await Store.tileOpen(stat, amtN); enterWait(id); } catch (err) { toast(err.message, 'err'); e.target.disabled = false; } };

  async function lobby() {
    leave(); show('v-lobby');
    status = await Store.tileStatus().catch(() => ({ canPlay: false }));
    if (status.active) return enterGame(status.active);
    if (status.waiting) return enterWait(status.waiting);
    $('#st').innerHTML = `<span class="mt-orb"></span><b>${!status.hasChar ? '게시된 캐릭터가 필요해요' : status.canPlay ? '오늘 한 판 할 수 있어요' : '오늘은 이미 했어요'}</b><em>하루 1판</em>`;
    const rooms = await Store.tileRooms().catch(() => []);
    $('#rooms').innerHTML = (rooms.length ? rooms.map(r => `<article class="gl room"><div class="tabhd"><span class="tab"><i></i>삼사라 패 · ${r.players.length} / 3</span><span class="ln"></span></div>
        <div><b>${esc(r.players[0].name)}의 방</b><small class="rm-sub">${ago(r.created_at)} 열림</small>
          <div class="bet">${r.players.map(p => `<span class="chip">${esc(p.name)} · ${esc(p.stat)} ${p.n}</span>`).join(' ')}</div></div>
        <button type="button" class="mt-btn w" data-join="${esc(r.id)}" ${status.canPlay && r.players.length < 3 ? '' : 'disabled'}>들어가기</button></article>`).join('')
      : '<div class="gl mt-cool"><b>열린 방이 없어요</b>오른쪽에서 방을 열고 기다려 보세요.</div>') + '<p style="margin:10px 2px 0"><button type="button" class="mt-btn" id="rf">새로 보기</button></p>';
    $('#o-go').disabled = !status.canPlay || !status.hasChar;
  }
  $('#rooms').addEventListener('click', async e => {
    if (e.target.closest('#rf')) return lobby();
    const j = e.target.closest('[data-join]'); if (!j) return;
    const pick = await askBet(); if (!pick) return;
    j.disabled = true;
    try { const id = await Store.tileJoin(j.dataset.join, pick.stat, pick.n); const s = Store.tileSub(id, () => {}); setTimeout(() => { s.ping(); s.stop(); }, 800); enterWait(id); }
    catch (err) { toast(err.message, 'err'); j.disabled = false; }
  });
  function askBet() {
    return new Promise(done => {
      let st = '외모', n = 1;
      const d = document.createElement('div'); d.className = 'bet-ask';
      d.innerHTML = `<div class="gl box"><div class="tabhd"><span class="tab"><i></i>내가 걸 것</span><span class="ln"></span></div>
        <label class="lb">스탯</label><div class="seg" data-st><button type="button" class="on" data-s="외모">외모</button><button type="button" data-s="재력">재력</button></div>
        <label class="lb">걸 만큼</label><div class="seg amt" data-n>${[1, 2, 3, 4, 5].map(x => `<button type="button" data-n="${x}" class="${x === 1 ? 'on' : ''}">${x}</button>`).join('')}</div>
        <div class="ft" style="margin-top:14px"><button type="button" class="mt-btn" data-x>취소</button><button type="button" class="mt-btn w" data-ok>들어가기</button></div></div>`;
      document.body.appendChild(d);
      d.onclick = e => {
        const s = e.target.closest('[data-s]'), k = e.target.closest('[data-n] [data-n]');
        if (s) { st = s.dataset.s; d.querySelectorAll('[data-s]').forEach(x => x.classList.toggle('on', x === s)); return; }
        if (k) { n = +k.dataset.n; d.querySelectorAll('[data-n] [data-n]').forEach(x => x.classList.toggle('on', x === k)); return; }
        if (e.target.closest('[data-ok]')) { d.remove(); done({ stat: st, n }); return; }
        if (e.target.closest('[data-x]') || e.target === d) { d.remove(); done(null); }
      };
    });
  }

  /* ───────── 공통: 신호 · 다시 받기 ───────── */
  let sub = null, V = null, refT = null, clockT = null, clockFired = false;
  function leave() { if (sub) sub.stop(); sub = null; clearInterval(clockT); clockT = null; clearTimeout(refT); V = null; }
  const subscribe = (id, fn) => { if (sub) sub.stop(); sub = Store.tileSub(id, () => { clearTimeout(refT); refT = setTimeout(fn, 250); }); };

  /* ───────── 기다리는 방 ───────── */
  async function enterWait(id) {
    leave(); show('v-wait');
    const load = async () => {
      let v; try { v = await Store.tileView(id); } catch (e) { toast(e.message, 'err'); return lobby(); }
      if (v.status === 'play') return enterGame(id, v);
      if (v.status !== 'wait') { toast('방이 닫혔어요.'); return lobby(); }
      V = v;
      const seats = [0, 1, 2].map(i => { const p = v.players[i]; return p ? `<div class="gl tpc seat"><span class="av" style="${avStyle(p.head)}"></span><div><b>${esc(p.name)}${p.me ? ' · 나' : ''}${i === 0 ? ' · 방장' : ''}</b><small>${esc(p.stat)} ${p.n} 걸었어요</small></div></div>` : '<div class="tpc seat empty">빈 자리</div>'; }).join('');
      $('#v-wait').innerHTML = `<div class="gl twait"><div class="tabhd"><span class="tab"><i></i>삼사라 패 · 기다리는 중</span><span class="ln"></span></div>
        <div class="seats">${seats}</div>
        <p class="sub">${v.host ? (v.players.length >= 2 ? '시작을 누르면 바로 판이 열려요 · 3명이 차면 저절로 시작해요' : '한 명 이상 더 들어오면 시작할 수 있어요') : '방장이 시작하면 판이 열려요'}</p>
        <div class="tacts">${DEMO && v.host && v.players.length < 3 ? '<button type="button" class="mt-btn" data-bot>연습 상대 부르기</button>' : ''}<button type="button" class="mt-btn" data-leave>${v.host ? '방 닫기' : '나가기'}</button>${v.host ? `<button type="button" class="mt-btn w" data-start ${v.players.length >= 2 ? '' : 'disabled'}>시작</button>` : ''}</div></div>`;
    };
    subscribe(id, load);
    $('#v-wait').onclick = async e => {
      if (e.target.closest('[data-bot]')) { if (DEMO && window.DemoBackend) await window.DemoBackend.tileBot(user.id, id); return load(); }   // 데모 전용
      if (e.target.closest('[data-leave]')) { try { await Store.tileLeave(id); sub && sub.ping(); } catch (err) { toast(err.message, 'err'); } return lobby(); }
      if (e.target.closest('[data-start]')) { try { const v = await Store.tileStart(id); sub && sub.ping(); enterGame(id, v); } catch (err) { toast(err.message, 'err'); } }
    };
    load();
  }

  /* ───────── 판 ───────── */
  let work = [], hand = [], sel = new Set(), placed = new Set(), sortBy = 'num';
  const myTurn = () => V && V.status === 'play' && V.turn === V.me;
  const reset = () => { work = (V.tbl || []).map(m => [...m]); hand = [...(V.hand || [])]; sel = new Set(); placed = new Set(); };

  async function enterGame(id, v0) {
    leave(); show('v-game');
    const load = async () => {
      let v; try { v = await Store.tileView(id); } catch (e) { toast(e.message, 'err'); return lobby(); }
      apply(v);
    };
    subscribe(id, load);
    if (v0) apply(v0); else await load();
    clockT = setInterval(tickClock, 1000);
  }
  function apply(v) {
    const changed = !V || V.ver !== v.ver;
    const skew = Date.parse(v.now) - Date.now();
    V = Object.assign(v, { skew });
    if (v.status === 'done' || v.status === 'closed') return result();
    if (changed) { reset(); clockFired = false; }
    draw();
    if (DEMO && v.status === 'play' && (v.players[v.turn] || {}).bot) { clearTimeout(botT); botT = setTimeout(refresh, 2000); }   // 데모 전용: 연습 상대 차례가 지나면 다시 받아요
  }
  let botT = null;
  const sortedHand = () => [...hand].sort(sortBy === 'num' ? (a, b) => (num(a) || 99) - (num(b) || 99) || col(a) - col(b) : (a, b) => (col(a) < 0 ? 9 : col(a)) - (col(b) < 0 ? 9 : col(b)) || num(a) - num(b));
  function draw() {
    const v = V, mine = myTurn(), me = v.players[v.me] || {};
    const firstPts = me.open ? null : work.filter(m => !(v.tbl || []).some(o => o.slice().sort().join() === m.slice().sort().join())).reduce((a, m) => a + Math.max(0, meldPts(m)), 0);
    const allOk = work.every(m => meldPts(m) >= 0), anyPlaced = placed.size > 0;
    const canPlay = mine && anyPlaced && allOk && (me.open || firstPts >= 30);
    const info = !mine ? `${esc((v.players[v.turn] || {}).name || '')}의 차례` : !anyPlaced ? '타일을 내거나 한 장 가져와요' : !allOk ? '맞지 않는 줄이 있어요' : !me.open && firstPts < 30 ? `처음엔 내 패로만 30 이상 · 지금 ${firstPts}` : '낼 수 있어요';
    $('#v-game').innerHTML = `<div class="ttg"><div>
        <div class="gl ttbl" id="tbl">${work.length ? work.map((m, i) => `<div class="meld ${meldPts(m) < 0 ? 'bad' : ''}" data-m="${i}">${sortMeld(m).map(t => tileHTML(t, (sel.has(t) ? 'sel ' : '') + (placed.has(t) ? 'nw' : ''))).join('')}</div>`).join('') : '<div class="emp">바닥이 비어 있어요</div>'}</div>
        <div class="gl track"><div class="tabhd"><span class="tab"><i></i>내 패 ${hand.length}장</span><span class="ln"></span></div>
          <div class="tiles" id="hand">${sortedHand().map(t => tileHTML(t, sel.has(t) ? 'sel' : '')).join('')}</div>
          <div class="tacts">
            <button type="button" class="mt-btn" data-a="meld" ${mine && sel.size ? '' : 'disabled'}>새 줄로</button>
            <button type="button" class="mt-btn" data-a="back" ${mine && [...sel].some(t => placed.has(t)) ? '' : 'disabled'}>손으로</button>
            <button type="button" class="mt-btn" data-a="reset" ${mine && (placed.size || sel.size || JSON.stringify(work) !== JSON.stringify(v.tbl)) ? '' : 'disabled'}>되돌리기</button>
            <button type="button" class="mt-btn" data-a="sort">${sortBy === 'num' ? '색깔순' : '숫자순'}</button>
            <span class="info ${mine && anyPlaced && !canPlay ? 'no' : ''}">${info}</span>
          </div>
          <div class="tacts"><button type="button" class="mt-btn" data-a="draw" ${mine && !anyPlaced ? '' : 'disabled'}>${v.pool ? `한 장 가져오기 · 남은 ${v.pool}장` : '넘기기'}</button><button type="button" class="mt-btn w" data-a="play" ${canPlay ? '' : 'disabled'}>내기</button></div>
        </div></div>
      <aside class="twho">${v.players.map((p, i) => `<div class="gl tpc ${i === v.turn ? 'on' : ''} ${p.out ? 'out' : ''}"><span class="av" style="${avStyle(p.head)}"></span><div><b>${esc(p.name)}${p.me ? ' · 나' : ''}</b><small>${esc(p.stat)} ${p.n} · ${p.out ? '빠짐' : p.open ? '등록함' : '아직 안 냄'}</small>${i === v.turn ? '<div class="clk" data-clk></div>' : ''}</div><div class="cnt"><b>${p.cnt}</b><small>장</small></div></div>`).join('')}
        <div class="gl tlog">${(v.log || []).slice(-8).reverse().map(l => `<div>${esc(l.by)} · ${{ play: `${l.x}장 냈어요`, draw: '한 장 가져왔어요', pass: '넘겼어요', timeout: '시간이 지나 한 장 가져왔어요', away: '세 번 비워서 빠졌어요', resign: '기권했어요' }[l.k] || ''}</div>`).join('') || '<div>판이 시작됐어요</div>'}</div>
        <button type="button" class="mt-btn" data-a="resign">🏳 기권</button></aside></div>`;
    tickClock();
  }
  function tickClock() {
    const el = $('[data-clk]'); if (!V || V.status !== 'play') return;
    const left = Math.max(0, 180 - Math.floor((Date.now() + (V.skew || 0) - Date.parse(V.turn_at)) / 1000));
    if (el) el.textContent = `남은 시간 ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
    // 시간이 다 되면 한 번만 다시 받아요 (서버가 그때 정리해요) · 화면을 안 보고 있으면 안 받아요
    if (left === 0 && !clockFired && !document.hidden) { clockFired = true; setTimeout(async () => { try { const was = V.ver, v = await Store.tileView(V.id); apply(v); if (was !== v.ver) sub && sub.ping(); } catch (e) {} }, 2000 + Math.random() * 4000); }
  }
  const take = ids => { ids.forEach(t => { hand = hand.filter(x => x !== t); work.forEach(m => { const i = m.indexOf(t); if (i >= 0) m.splice(i, 1); }); }); work = work.filter(m => m.length); };
  $('#v-game').addEventListener('click', async e => {
    if (!V) return;
    const a = e.target.closest('[data-a]');
    if (a) {
      const k = a.dataset.a;
      if (k === 'sort') { sortBy = sortBy === 'num' ? 'col' : 'num'; return draw(); }
      if (k === 'resign') { if (!confirm('기권할까요? 건 스탯을 잃어요.')) return; try { await Store.tileLeave(V.id); sub && sub.ping(); } catch (err) { toast(err.message, 'err'); } return lobby(); }
      if (!myTurn()) return;
      if (k === 'meld') { const ids = [...sel]; take(ids); work.push(ids); ids.forEach(t => { if ((V.hand || []).includes(t)) placed.add(t); }); sel = new Set(); return draw(); }
      if (k === 'back') { const ids = [...sel].filter(t => placed.has(t)); take(ids); hand.push(...ids); ids.forEach(t => placed.delete(t)); sel = new Set(); return draw(); }
      if (k === 'reset') { reset(); return draw(); }
      if (k === 'draw' || k === 'play') {
        a.disabled = true;
        try { const n = placed.size, v = await Store.tileMove(V.id, k, k === 'play' ? work.map(m => sortMeld(m)) : null); sub && sub.ping(); apply(v); if (k === 'play') toast(`${n}장 냈어요`); }
        catch (err) {
          // 판이 그새 바뀌었으면(신호를 놓쳤을 때) 한 번 새로 받아서 맞춰요 · 같은 오류가 되풀이되지 않게
          if (/바닥 타일|내 차례|진행 중|손에 없는|같은 타일/.test(err.message)) { toast('판이 바뀌어서 새로 불러왔어요', 'err'); await refresh(); }
          else { toast(err.message, 'err'); a.disabled = false; }
        }
        return;
      }
      return;
    }
    if (!myTurn()) return;
    const t = e.target.closest('.tl');
    if (t) {
      const id = +t.dataset.t, onTable = !!t.closest('#tbl'), me = V.players[V.me] || {};
      if (onTable && !placed.has(id) && !me.open) return toast('처음 낼 땐 바닥 타일을 옮길 수 없어요.');
      if (onTable && sel.size && !sel.has(id)) { const m = t.closest('[data-m]'); if (m) return dropInto(+m.dataset.m); }
      sel.has(id) ? sel.delete(id) : sel.add(id); return draw();
    }
    const m = e.target.closest('[data-m]'); if (m && sel.size) dropInto(+m.dataset.m);
  });
  async function refresh() { if (!V) return; try { const v = await Store.tileView(V.id); V.ver = -1; apply(v); } catch (e) {} }   // 무조건 새로 맞추기
  document.addEventListener('visibilitychange', () => { if (!document.hidden && V && V.status === 'play') refresh(); });   // 다른 탭에 있다 돌아오면 한 번
  function dropInto(i) { const target = work[i], ids = [...sel]; take(ids); const j = work.indexOf(target); (j >= 0 ? work[j] : (work.push([]), work[work.length - 1])).push(...ids); ids.forEach(t => { if ((V.hand || []).includes(t)) placed.add(t); }); sel = new Set(); draw(); }

  /* ───────── 결과 ───────── */
  function result() {
    clearInterval(clockT); clockT = null; if (sub) { sub.stop(); sub = null; }
    const v = V, win = v.players.find(p => p.win), me = v.players[v.me] || {};
    const gains = win ? v.players.filter(p => !p.win) : [];
    show('v-res');
    $('#v-res').innerHTML = `<div class="gl twait res-t"><div class="tabhd"><span class="tab"><i></i>삼사라 패 · 결과</span><span class="ln"></span></div>
      <h2>${!win ? '비겼어요' : me.win ? '이겼어요' : `${esc(win.name)}이 이겼어요`}</h2><p>${esc(v.why || '')}</p>
      <div class="res-l">${v.players.map(p => `<div class="gl tpc"><span class="av" style="${avStyle(p.head)}"></span><div><b>${esc(p.name)}${p.me ? ' · 나' : ''}</b><small>남은 점수 ${p.pts == null ? '-' : p.pts}</small></div>
        <span class="chg ${!win ? '' : p.win ? 'up' : 'dn'}">${!win ? '그대로' : p.win ? gains.map(g => `${esc(g.stat)} +${g.n}`).join(' · ') || '-' : `${esc(p.stat)} -${p.n}`}</span></div>`).join('')}</div>
      <button type="button" class="mt-btn w" data-home>대국으로</button></div>`;
    $('#v-res').onclick = e => { if (e.target.closest('[data-home]')) lobby(); };
  }

  addEventListener('pagehide', leave);
  lobby();
});
</script>
</body>
</html>
