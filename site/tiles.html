<style>
.tp { --c0: #2f6fd0; --c1: #d8344f; --c2: #d08a10; --c3: #23262e; --jk: #8a4cf0; --tw: 36px; --th: 50px; font-family: 'IBM Plex Sans KR', var(--sans); }
.tp .back { display: inline-block; margin-bottom: 10px; font-size: 13px; color: rgba(255,255,255,.6); text-decoration: none; }
.tp .back:hover { color: #fff; }
.tp .sub { margin: 4px 0 0; font-size: 13px; color: rgba(255,255,255,.6); }

/* 타일 */
.tl { display: inline-grid; place-items: center; width: var(--tw); height: var(--th); border-radius: 6px; font: 800 19px/1 'JetBrains Mono', monospace; font-style: normal; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none;
  background: linear-gradient(180deg, #fffef9, #f1eadb); box-shadow: inset 0 -3px 0 #ddd2bb, 0 1px 0 #b9ac91, 0 3px 6px -2px rgba(0,0,0,.45); transition: transform .12s, box-shadow .12s; position: relative; flex: none; }
.tl.c0 { color: var(--c0); } .tl.c1 { color: var(--c1); } .tl.c2 { color: var(--c2); } .tl.c3 { color: var(--c3); } .tl.jk { color: var(--jk); font-size: 21px; }
.tl::after { display: none; }   /* 숫자만 (아래 동그라미 없음) */
.tl.sel { transform: translateY(-6px); box-shadow: inset 0 -3px 0 #ddd2bb, 0 0 0 2px #ffb400, 0 8px 16px -6px rgba(255,180,0,.8); }
.tl.nw { box-shadow: inset 0 -3px 0 #ddd2bb, 0 0 0 2px #4fb3ff, 0 3px 6px -2px rgba(0,0,0,.45); }
.tl.nw.sel { box-shadow: inset 0 -3px 0 #ddd2bb, 0 0 0 2px #ffb400, 0 8px 16px -6px rgba(255,180,0,.8); }
.tl.fresh { box-shadow: inset 0 -3px 0 #ddd2bb, 0 0 0 2px #7be0a8, 0 3px 6px -2px rgba(0,0,0,.45); }
.tl.fresh::before { content: "NEW"; position: absolute; top: -8px; left: 50%; translate: -50% 0; font: 700 8px/1 'JetBrains Mono', monospace; color: #0d3b24; background: #7be0a8; border-radius: 4px; padding: 2px 3px; }
.tl.ghost { position: fixed; z-index: 90; pointer-events: none; transform: rotate(-4deg) scale(1.08); box-shadow: inset 0 -3px 0 #ddd2bb, 0 14px 24px -8px rgba(0,0,0,.7); }
.tl.lift { opacity: .25; }
.tl.sm { width: 22px; height: 30px; font-size: 12px; border-radius: 5px; }

/* 판: 펠트 */
.ttg { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 14px; }
.ttbl { position: relative; min-height: 300px; padding: 18px; border-radius: 20px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 12px 16px;
  background: radial-gradient(130% 100% at 50% 30%, #2f7a63, #215a4a 65%, #1a4a3c); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), inset 0 10px 40px rgba(0,0,0,.3), 0 18px 40px -22px rgba(0,0,0,.8); }
.ttbl::before { content: ""; position: absolute; inset: 8px; border-radius: 14px; border: 1px dashed rgba(255,255,255,.13); pointer-events: none; }
.ttbl.over { box-shadow: inset 0 0 0 2px rgba(255,213,107,.7), inset 0 10px 40px rgba(0,0,0,.3); }
.ttbl .emp { width: 100%; padding: 70px 0; text-align: center; color: rgba(255,255,255,.55); font-size: 13px; }
.meld { position: relative; display: inline-flex; gap: 1px; padding: 5px 5px 7px; border-radius: 9px; background: rgba(0,0,0,.2); box-shadow: inset 0 -2px 0 rgba(0,0,0,.15); cursor: pointer; }
.meld.bad { background: rgba(255,80,110,.22); box-shadow: inset 0 0 0 2px rgba(255,120,145,.9); }
.meld.over { box-shadow: inset 0 0 0 2px #ffd56b; background: rgba(255,213,107,.15); }
.meld .pts { position: absolute; right: 6px; bottom: -14px; font: 600 10px 'JetBrains Mono', monospace; color: rgba(255,255,255,.55); }

/* 내 받침대 */
.track { margin-top: 14px; }
.rack-hd { display: flex; align-items: center; gap: 8px; margin: 0 2px 8px; font-size: 13px; color: rgba(255,255,255,.75); }
.rack-hd .turn { font: 700 11px 'IBM Plex Sans KR', var(--sans); color: #1a1726; background: #ffd56b; border-radius: 99px; padding: 3px 10px; }
.rack { position: relative; padding: 10px 10px 4px; border-radius: 14px; background: linear-gradient(180deg, #c99d6c, #a97a4b 60%, #8f6438); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.2), 0 16px 30px -16px rgba(0,0,0,.9); }
.rack .grid { display: grid; grid-template-columns: repeat(var(--cols), var(--tw)); gap: 4px 3px; justify-content: center; }
.rack .row-line { grid-column: 1 / -1; height: 6px; margin: -2px -8px 4px; border-radius: 3px; background: linear-gradient(180deg, #7b5530, #a57a4c); box-shadow: inset 0 1px 2px rgba(0,0,0,.4); }
.slot { width: var(--tw); height: var(--th); border-radius: 6px; background: rgba(70,40,15,.18); box-shadow: inset 0 1px 3px rgba(0,0,0,.25); }
.slot.over { background: rgba(255,240,180,.45); box-shadow: inset 0 0 0 2px #ffd56b; }
.rack.go::before { content: ""; position: absolute; inset: -3px; border-radius: 17px; padding: 3px; pointer-events: none;
  background: linear-gradient(90deg, rgba(255,213,107,.1), rgba(255,213,107,.1) 30%, #ffd56b 45%, #fff6d0 50%, #ffd56b 55%, rgba(255,213,107,.1) 70%, rgba(255,213,107,.1)) 0 0 / 250% 100%;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: flow 2.2s linear infinite; }
.rack.go { box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.2), 0 0 26px -4px rgba(255,213,107,.65), 0 16px 30px -16px rgba(0,0,0,.9); }
@keyframes flow { from { background-position: 100% 0; } to { background-position: -150% 0; } }

.twho { display: grid; gap: 8px; align-content: start; }
.twho > .mt-btn { justify-self: start; }
.tpc { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; }
.tpc .av { width: 38px; height: 38px; border-radius: 50%; background: #2a2742 center / cover; flex: none; border: 1px solid rgba(255,255,255,.2); }
.tpc b { display: block; font-size: 14px; color: #fff; } .tpc small { font-size: 11.5px; color: rgba(255,255,255,.55); }
.tpc .cnt { margin-left: auto; text-align: right; } .tpc .cnt b { font: 700 16px 'JetBrains Mono', monospace; } .tpc .cnt small { display: block; }
.tpc.on { box-shadow: inset 0 0 0 1px rgba(255,213,107,.8), 0 0 18px -6px rgba(255,213,107,.6); }
.tpc.out { opacity: .4; }
.tpc .clk { font: 600 11px 'IBM Plex Sans KR', var(--sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: #ffd56b; white-space: nowrap; margin-top: 2px; }
.tacts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
.tacts .info { margin-left: auto; font-size: 12px; color: rgba(255,255,255,.65); }
.tacts .info.no { color: #ff8aa3; }
.emos { display: flex; gap: 6px; padding: 8px; border-radius: 14px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); }
.emo { flex: 1; height: 40px; border-radius: 12px; border: 0; background: rgba(255,255,255,.08); font-size: 22px; cursor: pointer; transition: transform .12s, background .12s; }
.emo:hover { background: rgba(255,255,255,.16); transform: translateY(-2px) scale(1.08); } .emo:active { transform: scale(.92); }
.tbub { position: fixed; z-index: 80; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 16px; background: #fff; color: #2a2333; font: 700 14px 'IBM Plex Sans KR', var(--sans); white-space: nowrap; box-shadow: 0 8px 20px -8px rgba(0,0,0,.7); pointer-events: none; animation: tbIn .3s cubic-bezier(.2,.9,.3,1.4); }
.tbub i { font-style: normal; font-size: 28px; line-height: 1; }
.tbub::after { content: ""; position: absolute; left: 18px; bottom: -7px; border: 8px solid transparent; border-top-color: #fff; border-bottom: 0; }
@keyframes tbIn { from { transform: scale(.3) translateY(12px); opacity: 0; } }
.credit { font-size: 11px; color: rgba(255,255,255,.4); } .credit a { color: rgba(255,255,255,.55); }
.tlog { max-height: 160px; overflow: auto; padding: 10px 12px; font-size: 12px; line-height: 1.7; color: rgba(255,255,255,.65); border-radius: 14px; }
.twait { max-width: 560px; margin: 0 auto; padding: 22px; border-radius: 18px; }
.twait .seats { display: grid; gap: 8px; margin: 14px 0; }
.twait .seat.empty { justify-content: center; color: rgba(255,255,255,.35); font-size: 13px; min-height: 58px; border: 1px dashed rgba(255,255,255,.15); }
.amt { display: flex; gap: 6px; } .amt button { flex: 1; }
.bet-ask { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(5,6,12,.6); backdrop-filter: blur(8px); padding: 16px; }
.bet-ask .box { width: min(360px, 100%); padding: 20px; border-radius: 18px; }
.res-t { text-align: center; } .res-t h2 { font: 700 26px 'IBM Plex Sans KR', var(--sans); color: #fff; margin: 6px 0 4px; } .res-t p { color: rgba(255,255,255,.6); font-size: 13px; }
.res-l { display: grid; gap: 8px; margin: 16px 0; }
.res-l .tpc .chg { margin-left: auto; font: 700 13px 'IBM Plex Sans KR', var(--sans); } .chg.up { color: #8ff0c0; } .chg.dn { color: #ff8aa3; }
.twho-ps { display: grid; gap: 8px; }
@media (max-width: 860px) {
  /* 모바일: 사람 카드는 판 위에 한 줄로 · 이모지 · 기록 · 기권은 아래 */
  .ttg { display: flex; flex-direction: column; gap: 12px; } .ttg > div { order: 2; } .twho { display: contents; }
  .twho-ps { order: 1; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); grid-auto-flow: column; }
  .twho-ps .tpc { padding: 8px 9px; gap: 7px; min-width: 0; } .twho-ps .tpc .av { width: 30px; height: 30px; }
  .twho-ps .tpc > div:not(.cnt) { min-width: 0; } .twho-ps .tpc b { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .twho-ps .tpc small { font-size: 10.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .twho-ps .tpc .cnt b { font-size: 15px; } .twho-ps .tpc .cnt small { display: none; }
  .emos { order: 3; } .tlog { order: 4; max-height: 120px; } .twho > .mt-btn { order: 5; align-self: flex-start; } .credit { order: 6; }
}
@media (max-width: 560px) { .tp { --tw: 29px; --th: 40px; } .tl { font-size: 15px; } .tl::after { bottom: 5px; width: 7px; height: 7px; margin-left: -3.5px; } .meld { padding: 4px 4px 6px; } .ttbl { min-height: 220px; padding: 12px; gap: 10px 12px; } .rack { padding: 8px 6px 3px; } .rack .grid { gap: 3px 2px; } }
</style>

<body data-page="match" class="mt-noir" data-nofooter>
<main class="mt-wrap tp">
  <a class="back" href="match.html">← 대국</a>
  <section class="mt-view" id="v-lobby">
    <div class="mt-head"><div><h1>사리큐브</h1><p class="sub">숫자 타일을 맞춰서 먼저 손패를 다 털면 이겨요 · 2 ~ 3명</p></div><span class="mt-today" id="st"><span class="mt-orb"></span><b>불러오는 중…</b></span></div>
    <div class="lobby"><div class="rooms" id="rooms"></div>
      <aside class="gl open">
        <div class="tabhd"><span class="tab"><i></i>방 열기</span><span class="ln"><i></i><i></i><i></i></span></div>
        <label class="lb">베팅 · 내가 걸 것 (상대는 들어올 때 따로 골라요)</label>
        <div class="seg" id="o-bet"><button type="button" data-b="외모">✨ 외모</button><button type="button" data-b="재력">💎 재력</button><button type="button" data-b="msg">✉ 메시지</button><button type="button" class="on" data-b="coin">💰 영전</button></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<script>
App.ready.then(async user => {
  if (!user) { location.replace('login.html?next=tiles.html'); return; }
  const po = await Store.playOpen('match').catch(() => ({ open: false }));
  if (!po.open) { playClosed($('.mt-wrap'), 'match'); return; }
  const DEMO = Store.mode === 'demo';
  const show = id => ['v-lobby', 'v-wait', 'v-game', 'v-res'].forEach(v => $('#' + v).hidden = v !== id);
  // 결과창: 오목 · 체스와 같은 모양 (match.css 의 rs · rs-loot)
  const RS_ICO = { draw: '<path d="M5 9.5h14M5 14.5h14"/>', win: '<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/>', lose: '<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z" opacity=".35"/><path d="M4 20L20 4"/>' };
  const resCard = ({ state, head, title, sc, detail, id, loots }) => `<div class="res-wrap res"><div class="gl rs ${state}"><div class="tabhd"><span class="tab"><i></i>대국 결과</span><span class="ln"><i></i><i></i><i></i></span><span class="code">${{ draw: '무승부', win: '승리', lose: '패배' }[state]}</span></div>
      <div class="rs-badge"><span class="rs-por" style="${avStyle(head)}"></span><svg class="rs-ic" viewBox="0 0 24 24">${RS_ICO[state]}</svg></div>
      <div class="rs-body"><h3>${title}</h3><div class="sc">${sc}</div><div class="gain"><span>베팅</span><b class="${/[0-9]/.test(detail) ? '' : 'txt'}">${esc(detail)}</b></div></div>
      <div class="rs-ft"><span class="rs-uid">MATCH · ${esc(String(id).slice(-6).toUpperCase())}</span><button type="button" class="mt-btn w" id="back">대국 로비로</button></div></div>
    ${loots.map(l => `<div class="gl rs-loot"><div class="tabhd"><span class="tab"><i></i>전리품</span><span class="ln"><i></i><i></i><i></i></span></div><div class="loot"><span class="tape"></span><small>${esc(l.name)}의 봉인된 메시지</small><p>${esc(l.msg || '')}</p><div class="from">― ${esc(l.name)}</div></div></div>`).join('')}</div>`;
  const ago = iso => { const m = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 6e4)); return m < 1 ? '방금' : m + '분 전'; };
  const avStyle = h => { h = h ? ((window.headMp4 && headMp4(h) || {}).poster || h) : ''; return h ? `background-image:url('${esc(h)}')` : ''; };

  // 타일: (색 * 13 + 숫자 - 1) * 2 + 벌 · 104 · 105 는 별
  const num = t => t >= 104 ? 0 : ((t >> 1) % 13) + 1, col = t => t >= 104 ? -1 : Math.floor(t / 26);
  const tileHTML = (t, cls = '') => `<i class="tl ${t >= 104 ? 'jk' : 'c' + col(t)} ${cls}" data-t="${t}">${t >= 104 ? '✦' : num(t)}</i>`;
  const meldPts = m => {   // 맞으면 점수 · 틀리면 -1 (보여 주기용 · 실제 검사는 서버)
    const L = m.length; if (L < 3 || L > 13) return -1;
    const ns = m.filter(t => t < 104).map(num), cs = m.filter(t => t < 104).map(col); if (!ns.length) return -1;
    if (L <= 4 && new Set(ns).size === 1 && new Set(cs).size === cs.length) return ns[0] * L;
    if (new Set(cs).size === 1 && new Set(ns).size === ns.length) { const mn = Math.min(...ns), mx = Math.max(...ns); if (mx - mn + 1 <= L) { const s = Math.min(mn, 14 - L); return (2 * s + L - 1) * L / 2; } }
    return -1;
  };
  const sortMeld = m => {   // 보기 좋게: 이어지는 줄은 숫자순 (별은 빈 자리에) · 같은 숫자는 색깔순
    const J = m.filter(t => t >= 104), N = m.filter(t => t < 104);
    if (N.length && new Set(N.map(num)).size === 1) return [...N].sort((a, b) => col(a) - col(b)).concat(J);
    if (N.length && new Set(N.map(col)).size === 1 && new Set(N.map(num)).size === N.length) {
      const mn = Math.min(...N.map(num)), mx = Math.max(...N.map(num)), L = m.length, s = Math.min(mn, 14 - L), out = [], j = [...J];
      if (mx - mn + 1 <= L && L <= 13) { for (let v = s; v < s + L; v++) { const t = N.find(x => num(x) === v); out.push(t != null ? t : j.shift()); } return out; }
    }
    return [...N].sort((a, b) => num(a) - num(b) || col(a) - col(b)).concat(J);
  };
  const byNum = (a, b) => (num(a) || 99) - (num(b) || 99) || col(a) - col(b) || a - b;
  const byCol = (a, b) => (col(a) < 0 ? 9 : col(a)) - (col(b) < 0 ? 9 : col(b)) || num(a) - num(b) || a - b;

  /* ───────── 베팅 (대국과 같은 모양) ───────── */
  const BET = { 외모: '✨ 외모', 재력: '💎 재력', coin: '💰 영전', msg: '✉ 메시지' };
  const betTxt = p => p.stat === 'msg' ? BET.msg : p.stat === 'coin' ? `${BET.coin} ${(+p.n).toLocaleString()}` : `${BET[p.stat] || esc(p.stat)} ${p.n}`;
  const RNG = { coin: [1000, 5000, 500, 1000], 외모: [1, 5, 1, 1], 재력: [1, 5, 1, 1] };   // 최소 · 최대 · 칸 · 처음
  const betBody = (kind, body, left, wal) => {
    if (kind === 'msg') { body.innerHTML = `<label class="lb">내 비밀 메시지 · 지면 상대에게 공개돼요</label><textarea maxlength="300" placeholder="판마다 새로 써요"></textarea><p class="hint">지면 내 메시지가 이긴 사람에게만 공개돼요 · 이기거나 비기면 지워져요</p>`; left.textContent = '0 / 300'; const ta = body.querySelector('textarea'); ta.oninput = () => left.textContent = ta.value.length + ' / 300'; return; }
    const [a, b, s, v] = RNG[kind];
    body.innerHTML = `<label class="lb">${kind === 'coin' ? `걸 영전 · ${a.toLocaleString()} ~ ${b.toLocaleString()} · 들어갈 때 맡겨 둬요` : `걸 ${kind} · ${a} ~ ${b}`}</label><div class="amt"><input type="range" min="${a}" max="${b}" step="${s}" value="${v}"><b>${v.toLocaleString()}</b></div>`;
    left.textContent = kind === 'coin' ? `가진 영전 ${(wal ? wal.coins : 0).toLocaleString()}` : `지면 내 ${kind}을 잃어요`;
    const r = body.querySelector('input[type=range]'); r.oninput = () => body.querySelector('.amt b').textContent = (+r.value).toLocaleString();
  };
  const betRead = (kind, body) => { const ta = body.querySelector('textarea'), r = body.querySelector('input[type=range]'); return { stat: kind, n: r ? +r.value : 0, msg: ta ? ta.value.trim() : '' }; };

  /* ───────── 로비 ───────── */
  let betKind = 'coin', wal = null, status = {};

  /* ───────── 내 받침대: 자리는 이 브라우저에만 기억해요 (서버 요청 없음) ───────── */
  let rack = {}, fresh = new Set();

  const COLS = () => innerWidth <= 560 ? 10 : 14;
  function syncRack() {   // 서버 손패에 맞추기 · 처음엔 숫자순 · 새로 가져온 패는 한 번만 맨 끝에

  function tickClock() {

    if (el) el.textContent = `남은 시간 ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
    // 시간이 다 되면 한 번만 다시 받아요 (서버가 그때 정리해요) · 화면을 안 보고 있으면 안 받아요
    if (left === 0 && !clockFired && !document.hidden) { clockFired = true; setTimeout(async () => { try { const was = V.ver, v = await Store.tileView(V.id); apply(v); if (was !== v.ver) sub && sub.ping(); } catch (e) {} }, 2000 + Math.random() * 4000); }
  }

  const canMoveTable = id => placed.has(id) || (V.players[V.me] || {}).open;

  // 판에 붙이기 · 새 줄 · 받침대로 돌리기 (선택한 것이 있으면 함께)
  function toMeld(ids, i) { const target = work[i]; take(ids); const j = work.indexOf(target); (j >= 0 ? work[j] : (work.push([]), work[work.length - 1])).push(...ids); ids.forEach(t => { if ((V.hand || []).includes(t)) placed.add(t); fresh.delete(t); }); sel = new Set(); draw(); }
  function toNew(ids) { take(ids); work.push(ids); ids.forEach(t => { if ((V.hand || []).includes(t)) placed.add(t); fresh.delete(t); }); sel = new Set(); draw(); }
  function toSlot(id, s) {
    const back = !hand.includes(id);
    if (back) { if (!placed.has(id)) return toast('바닥 타일은 손으로 가져갈 수 없어요.'); take([id]); hand.push(id); placed.delete(id); }
    const other = Object.keys(rack).find(k => rack[k] === s && +k !== id && hand.includes(+k));
    if (other != null) rack[other] = rack[id];   // 자리에 있던 패와 바꿔요
    rack[id] = s; fresh.delete(id); saveRack(); sel.delete(id); draw();
  }

  /* 끌기: 마우스 · 손가락 모두 */
  let drag = null, justDragged = false;
  $('#v-game').addEventListener('pointerdown', e => {
    const t = e.target.closest('.tl'); if (!t || !V || e.button > 0) return;
    const id = +t.dataset.t, fromTable = !!t.closest('#tbl');
    if (fromTable && (!myTurn() || !canMoveTable(id))) return;
    drag = { id, x: e.clientX, y: e.clientY, el: t, on: false, fromTable, pid: e.pointerId };
  });
  addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.pid) return;
    if (!drag.on) {
      if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
      drag.on = true; drag.ids = sel.has(drag.id) && !drag.fromTable ? [...sel].filter(x => hand.includes(x)) : [drag.id];
      drag.g = drag.el.cloneNode(true); drag.g.classList.add('ghost'); drag.g.classList.remove('sel'); document.body.appendChild(drag.g); drag.el.classList.add('lift');
    }
    drag.g.style.left = (e.clientX - 18) + 'px'; drag.g.style.top = (e.clientY - 25) + 'px';
    $$('.over').forEach(x => x.classList.remove('over'));
    const tg = overTarget(e); if (tg) tg.el.classList.add('over');
    e.preventDefault();
  }, { passive: false });
  addEventListener('pointerup', e => {
    if (!drag || e.pointerId !== drag.pid) return;
    const d = drag; drag = null;
    if (!d.on) return;
    justDragged = true; setTimeout(() => justDragged = false, 0);
    d.g.remove(); d.el.classList.remove('lift'); $$('.over').forEach(x => x.classList.remove('over'));
    const tg = overTarget(e); if (!tg) return draw();
    if (tg.k === 'slot') { if (d.ids.length > 1) { let s = tg.s; d.ids.forEach(id => { toSlotQuiet(id, s); s++; }); saveRack(); sel = new Set(); return draw(); } return toSlot(d.id, tg.s); }
    if (!myTurn()) { toast('내 차례에만 판에 낼 수 있어요.'); return draw(); }
    if (tg.k === 'meld') return toMeld(d.ids, tg.i);
    return toNew(d.ids);
  });
  addEventListener('pointercancel', () => { if (drag && drag.g) { drag.g.remove(); drag.el.classList.remove('lift'); } drag = null; $$('.over').forEach(x => x.classList.remove('over')); });
  function toSlotQuiet(id, s) { const other = Object.keys(rack).find(k => rack[k] === s && +k !== id && hand.includes(+k)); if (other != null) rack[other] = rack[id]; rack[id] = s; fresh.delete(id); }
  function overTarget(e) {
    const el = document.elementFromPoint(e.clientX, e.clientY); if (!el) return null;
    const s = el.closest('[data-slot]'); if (s) return { k: 'slot', s: +s.dataset.slot, el: s };
    const m = el.closest('[data-m]'); if (m) return { k: 'meld', i: +m.dataset.m, el: m };
    const tb = el.closest('#tbl'); if (tb) return { k: 'new', el: tb };
    return null;
  }

  $('#v-game').addEventListener('click', async e => {
    if (!V || justDragged) return;
    const em = e.target.closest('[data-emo]'); if (em) return sendEmo(em.dataset.emo);
    const a = e.target.closest('[data-a]');
    if (a) {
      const k = a.dataset.a;
      if (k === 'snum' || k === 'scol') { sortRack(k === 'snum' ? byNum : byCol); return draw(); }
      if (k === 'resign') { if (!confirm('기권할까요? 건 스탯을 잃어요.')) return; try { await Store.tileLeave(V.id); sub && sub.ping(); } catch (err) { toast(err.message, 'err'); } return lobby(); }
      if (!myTurn()) return;
      if (k === 'meld') return toNew([...sel]);
      if (k === 'back') { const ids = [...sel].filter(t => placed.has(t)); take(ids); hand.push(...ids); ids.forEach(t => placed.delete(t)); sel = new Set(); return draw(); }
      if (k === 'reset') { reset(); return draw(); }
      if (k === 'draw' || k === 'play') {
        a.disabled = true;
        try { const n = placed.size, v = await Store.tileMove(V.id, k, k === 'play' ? work.map(m => sortMeld(m)) : null); sub && sub.ping(); apply(v); if (k === 'play') toast(`${n}장 냈어요`); }
        catch (err) {
          // 판이 그새 바뀌었으면(신호를 놓쳤을 때) 한 번 새로 받아서 맞춰요 · 같은 오류가 되풀이되지 않게
          if (/바닥 타일|내 차례|진행 중|손에 없는|같은 타일/.test(err.message)) { toast('판이 바뀌어서 새로 불러왔어요', 'err'); await refresh(); }
          else { toast(err.message, 'err'); a.disabled = false; }
        }
        return;
      }
      return;
    }
    const t = e.target.closest('.tl');
    if (t) {
      const id = +t.dataset.t, onTable = !!t.closest('#tbl');
      if (!onTable) { sel.has(id) ? sel.delete(id) : sel.add(id); fresh.delete(id); return draw(); }   // 받침대 패는 언제든 고를 수 있어요
      if (!myTurn()) return;
      if (!canMoveTable(id)) return toast('처음 낼 땐 바닥 타일을 옮길 수 없어요.');
      if (sel.size && !sel.has(id)) { const m = t.closest('[data-m]'); if (m) return toMeld([...sel], +m.dataset.m); }
      sel.has(id) ? sel.delete(id) : sel.add(id); return draw();
    }
    if (!myTurn()) return;
    const m = e.target.closest('[data-m]'); if (m && sel.size) return toMeld([...sel], +m.dataset.m);
    if (e.target.closest('#tbl') && sel.size && [...sel].every(x => hand.includes(x))) return toNew([...sel]);
  });
  async function refresh() { if (!V) return; try { const v = await Store.tileView(V.id); V.ver = -1; apply(v); } catch (e) {} }   // 무조건 새로 맞추기
  document.addEventListener('visibilitychange', () => { if (!document.hidden && V && V.status === 'play') refresh(); });   // 다른 탭에 있다 돌아오면 한 번
  let rw = innerWidth; addEventListener('resize', () => { if ((innerWidth <= 560) !== (rw <= 560) && V && V.status === 'play') draw(); rw = innerWidth; });

  /* ───────── 결과 ───────── */
  function result() {
    clearInterval(clockT); clockT = null; if (sub) { sub.stop(); sub = null; }
    try { localStorage.removeItem(RK()); } catch (e) {}
    const v = V, winner = v.players.find(p => p.win), me = v.players[v.me] || {}, others = v.players.filter(p => !p.me), draw_ = !winner, win = !!me.win;
    const amt = (p, s) => p.stat === 'coin' ? `영전 ${s}${(+p.n).toLocaleString()}` : `${p.stat} ${s}${p.n}`;
    const gain = p => p.stat === 'msg' ? '상대 메시지 공개' : amt(p, '+'), lose = p => p.stat === 'msg' ? '내 메시지가 상대에게 공개돼요' : amt(p, '−');
    const detail = draw_ ? '건 것을 서로 돌려받았어요' : win ? others.map(gain).join(' · ') : lose(me);
    const names = others.map(p => esc(p.name)).join(' · ');
    show('v-res');
    $('#v-res').innerHTML = resCard({ state: draw_ ? 'draw' : win ? 'win' : 'lose', head: me.head,
      title: draw_ ? `${names}와(과) 무승부` : win ? `${names}에게 승리했어요` : `${esc(winner.name)}에게 졌어요`,
      sc: `사리큐브 · ${esc(v.why || '')} · 남은 점수 ${me.pts == null ? '-' : me.pts}`, detail, id: v.id, loots: v.secrets || [] });
    $('#back').onclick = () => location.href = 'match.html';
  }

  addEventListener('pagehide', leave);
  lobby();
});
</script>
</body>
</html>
