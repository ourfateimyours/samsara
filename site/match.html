<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; media-src 'self' https: blob:; connect-src 'self' https: wss://*.supabase.co; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대국 — 三娑罗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Serif+KR:wght@300;400;600&family=Zhi+Mang+Xing&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/match.css">
</head>
<body data-page="match" class="mt-noir" data-nofooter>

<main class="mt-wrap">
  <!-- 로비: 방 목록 · 방 열기 -->
  <section class="mt-view" id="v-lobby">
    <div class="mt-head"><div><h1>대국</h1></div><span class="mt-today" id="st"><span class="mt-orb"></span><b>불러오는 중…</b></span></div>
    <p class="mt-demo-note" id="demo-note" hidden>데모: 내 방에 '연습 상대 부르기'를 누르거나 다른 방에 들어가면 연습 상대가 아무 수나 둬요. 실제 사이트에는 연습 상대가 없고 회원끼리만 둬요.</p>
    <div class="lobby"><div class="rooms" id="rooms"></div>
      <aside class="gl open" id="open">
        <div class="tabhd"><span class="tab"><i></i>방 열기</span><span class="ln"><i></i><i></i><i></i></span></div>
        <label class="lb">게임</label>
        <div class="seg" id="o-game"><button type="button" class="on" data-g="gomoku">오목</button><button type="button" data-g="chess">체스</button><button type="button" data-g="tiles">삼사라 패</button><button type="button" data-g="bell">할래말래</button></div>
        <label class="lb">베팅 · 내가 걸 것 (상대는 들어올 때 따로 골라요)</label>
        <div class="seg" id="o-bet"><button type="button" data-b="stat">⚔ 술력</button><button type="button" data-b="msg">✉ 메시지</button><button type="button" class="on" data-b="coin">💰 영전</button></div>
        <div id="o-body"></div>
        <div class="ft"><span class="left" id="o-left"></span><button type="button" class="mt-btn w" id="o-go">방 열기</button></div>
      </aside></div>
  </section>

  <!-- 대국판 -->
  <section class="mt-view" id="v-game" hidden>
    <div class="rp-wrap" id="rps" hidden><div class="gl rp-box" id="rps-b"></div></div>
    <div class="mt"><div class="boardwrap"><div id="board"></div><div class="toast-fx" id="fx"></div></div>
      <aside class="side">
        <div class="gl pl" id="p-opp"><div class="tabhd"><span class="tab"><i></i>상대</span><span class="ln"></span></div><span class="av" id="opp-av"></span><div><b id="opp-nm"></b><small id="opp-side"></small></div><div class="clock"><small>남은 시간</small><b id="opp-clock">10:00</b></div></div>
        <div class="gl betbar"><div class="tabhd"><span class="tab"><i></i>베팅</span><span class="ln"></span></div><span class="bb"><small>나</small><span class="chip" id="bet-me"></span></span><span class="bb"><small>상대</small><span class="chip" id="bet-opp"></span></span></div>
        <div class="gl skills"><h4 class="tabhd"><span class="tab"><i></i>스킬</span><span class="ln"></span><span id="uses">남은 횟수 2</span></h4>
          <button type="button" class="sk" id="sk1"><span class="ic" id="ic1"></span><span><b id="sk1-nm"></b><small id="sk1-ds"></small></span></button>
          <button type="button" class="sk" id="sk2"><span class="ic" id="ic2"></span><span><b id="sk2-nm"></b><small id="sk2-ds"></small></span></button></div>
        <div class="gl pl" id="p-me"><div class="tabhd"><span class="tab"><i></i>나</span><span class="ln"></span></div><span class="av" id="me-av"></span><div><b id="me-nm"></b><small id="me-side"></small></div><div class="clock"><small>남은 시간</small><b id="me-clock">10:00</b></div></div>
        <div class="gl log" id="log"></div>
        <button type="button" class="mt-btn" id="resign">🏳 기권</button>
      </aside></div>
  </section>

  <!-- 결과 -->
  <section class="mt-view" id="v-res" hidden><div class="res-wrap res" id="res"></div></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.js"></script>
<script src="assets/js/match-engine.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/char-editor.js"></script>
<script>
App.ready.then(async user => {
  if (!user) { location.replace('login.html?next=match.html'); return; }
  const po = await Store.playOpen('match').catch(() => ({ open: false }));   // 관리자가 닫아 두면 고양이가 안내해요 (관리자는 들어가요)
  if (!po.open) { playClosed($('.mt-wrap'), 'match'); return; }
  if (!po.on) toast('대국이 닫혀 있지만 관리자라서 들어왔어요.');
  const M = Store.MATCH, DEMO = Store.mode === 'demo';
  const GO = '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18" opacity=".5"/><circle cx="9" cy="9" r="2.7" fill="currentColor"/><circle cx="15" cy="15" r="2.7" fill="#14122a"/></svg>';
  const KN = '<svg viewBox="0 0 24 24"><path d="M7 21h11M8.5 18h8l-.6-4.5c2.4-1.8 3.1-4.8 1.6-7.6C16.2 3.4 13 2.5 10.6 3.4L9.4 2l-.7 2.3C6.3 5.8 5 8.5 5.6 11.2L8 12.4l2.6-1.6L9.3 14z"/><circle cx="10.8" cy="7" r=".8" fill="currentColor"/></svg>';
  const IC = { erase: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/></svg>', again: '<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.7M20 4v4.7h-4.7M20 12a8 8 0 0 1-13.7 5.6L4 15.3M4 20v-4.7h4.7"/></svg>', frost: '<svg viewBox="0 0 24 24"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7M9 3.5l3 2 3-2M9 20.5l3-2 3 2"/></svg>' };
  const BET = { coin: '💰 영전', stat: '⚔ 술력', msg: '✉ 개인 메시지' };
  const betAmt = b => b.kind === 'coin' ? b.amount.toLocaleString() : b.kind === 'stat' ? String(b.amount) : '?';
  const ago = iso => { const m = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 6e4)); return m < 1 ? '방금' : m + '분 전'; };
  const show = id => ['v-lobby', 'v-game', 'v-res'].forEach(v => $('#' + v).hidden = v !== id);
  if (DEMO) $('#demo-note').hidden = false;

  let status, game = 'gomoku', betKind = 'coin', waitSub = null;
  async function lobby() {
    show('v-lobby');
    status = await Store.matchStatus().catch(() => ({ canPlay: false }));
    const wal = await Store.wallet().catch(() => ({ coins: 0 }));
    $('#st').innerHTML = `<span class="mt-orb"></span><b>${status.soon ? '곧 열려요' : !status.hasChar ? '게시된 캐릭터가 필요해요' : status.canPlay ? '지금 둘 수 있어요' : '다음 대국까지 기다려요'}</b><em>${status.canPlay || !status.nextAt ? '이틀에 1판' : new Date(status.nextAt).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' 부터'}</em>`;
    if (DEMO && !status.canPlay && status.hasChar) {   // 데모 전용: 이틀 제한 풀기 (실제 사이트엔 안 나와요)
      $('#st').insertAdjacentHTML('beforeend', '<button type="button" class="mt-btn w" id="demo-reset" style="margin-left:8px;padding:5px 10px;font-size:11px">데모 · 다시 하기</button>');
      $('#demo-reset').onclick = async () => {
        for (const r of (await Store.matchRooms().catch(() => [])).filter(r => r.mine)) await Store.matchCancel(r.id).catch(() => {});   // 열어 둔 내 방 베팅은 돌려받고
        try { localStorage.setItem('naru:t:matches', '[]'); } catch (e) {} toast('데모 대국 기록을 지웠어요. 다시 둘 수 있어요.'); lobby();
      };
    }
    if (status.active) return enter(status.active);   // 진행 중인 대국이 있으면 바로 들어가요
    const rooms = ROOMS = await Store.matchRooms().catch(() => []);
    // 내 방에 누가 들어오면 바로 시작해요 (방을 열어 둔 동안만 신호를 받아요)
    if (waitSub) { waitSub.stop(); waitSub = null; }
    const myRoom = rooms.find(r => r.mine);
    if (myRoom) waitSub = Store.matchSub(myRoom.id, async () => { const s = await Store.matchStatus().catch(() => null); if (s && s.active && waitSub) { waitSub.stop(); waitSub = null; enter(s.active); } });
    $('#rooms').innerHTML = rooms.map(r => `<article class="gl room ${r.mine ? 'wait' : ''}"><div class="tabhd"><span class="tab"><i></i>${r.mine ? '내 방' : r.game === 'chess' ? '체스' : '오목'}</span><span class="ln"></span></div><span class="g ${r.game === 'chess' ? 'ch' : ''}">${r.game === 'chess' ? KN : GO}</span>
        <div><b>${r.mine ? `내 ${r.game === 'chess' ? '체스' : '오목'} 방 · 상대를 기다리는 중…` : `${esc(r.name)}의 ${r.game === 'chess' ? '체스' : '오목'} 방`}</b>
          <small class="rm-sub">${r.mine ? `${M.wait}분 뒤에 저절로 닫혀요 · ${ago(r.created_at)} 열림` : `${esc(r.name)}의 방 · ${ago(r.created_at)} 열림`}</small>
          <div class="bet"><span class="chip">${r.mine ? '내가 건 것' : '건 것'} · ${chipOf(r.bet)}</span></div></div>
        ${r.mine ? `<span style="display:flex;gap:6px;flex-wrap:wrap">${DEMO ? `<button type="button" class="mt-btn w" data-join="${esc(r.id)}" data-mine="1">연습 상대 부르기</button>` : ''}<button type="button" class="mt-btn" data-cancel="${esc(r.id)}">닫기</button></span>`
          : `<button type="button" class="mt-btn w" data-join="${esc(r.id)}" data-kind="${r.bet.kind}" ${status.canPlay ? '' : 'disabled title="이틀에 1판이에요"'}>들어가기</button>`}</article>`).join('')
      || '<div class="gl mt-cool"><b>열린 방이 없어요</b>오른쪽에서 방을 열고 상대를 기다려 보세요.</div>';
    $('#o-go').disabled = !status.canPlay || rooms.some(r => r.mine);
    betUI(wal);
  }
  function betUI(wal) {
    const body = $('#o-body'), left = $('#o-left');
    if (betKind === 'stat') { body.innerHTML = `<label class="lb">걸 술력 · ${M.stat[0]} ~ ${M.stat[1]}</label><div class="amt"><input type="range" min="${M.stat[0]}" max="${M.stat[1]}" value="2" id="o-r"><b id="o-v">2</b></div>`; left.textContent = '이기면 상대 술력을 가져와요'; }
    if (betKind === 'coin') { body.innerHTML = `<label class="lb">걸 영전 · ${M.coin[0].toLocaleString()} ~ ${M.coin[1].toLocaleString()}</label><div class="amt"><input type="range" min="${M.coin[0]}" max="${M.coin[1]}" step="500" value="3000" id="o-r"><b id="o-v">3,000</b></div>`; left.textContent = `가진 영전 ${(wal ? wal.coins : 0).toLocaleString()}`; }
    if (betKind === 'msg') { body.innerHTML = `<label class="lb">내 개인 메시지 · 지면 상대에게 공개돼요</label><textarea id="o-msg" maxlength="300" placeholder="대국마다 새로 써요"></textarea><p class="hint">지면 내 메시지가 상대에게 공개돼요 · 비기면 공개 안 해요</p>`; left.textContent = ''; }
    const r = $('#o-r'); if (r) r.oninput = () => $('#o-v').textContent = (+r.value).toLocaleString();
  }
  $('#o-game').onclick = e => { const b = e.target.closest('[data-g]'); if (!b) return; if (b.dataset.g === 'tiles') { location.href = 'tiles.html'; return; } if (b.dataset.g === 'bell') { location.href = 'bell.html'; return; } game = b.dataset.g; $$('#o-game button').forEach(x => x.classList.toggle('on', x === b)); };   // 삼사라 패는 따로 (2 ~ 3명)
  $('#o-bet').onclick = async e => { const b = e.target.closest('[data-b]'); if (!b) return; betKind = b.dataset.b; $$('#o-bet button').forEach(x => x.classList.toggle('on', x === b)); betUI(await Store.wallet().catch(() => null)); };
  $('#o-go').onclick = async () => {
    const amount = $('#o-r') ? +$('#o-r').value : 0, msg = $('#o-msg') ? $('#o-msg').value : '';
    try { await Store.matchOpen(game, { kind: betKind, amount }, msg); toast('방을 열었어요. 상대를 기다려요.'); lobby(); } catch (e) { toast(e.message, 'err'); }
  };
  const chipOf = b => `${BET[b.kind]}${b.kind === 'msg' ? '' : ' ' + betAmt(b)}`;
  function askBet(room, wal) {
    return new Promise(done => {
      let kind = 'coin';
      const d = document.createElement('div'); d.className = 'mt-ask';
      d.innerHTML = `<div class="gl mt-ask-box"><div class="tabhd"><span class="tab"><i></i>내 베팅</span><span class="ln"><i></i><i></i><i></i></span></div>
        <div class="vs-bet"><small>${esc(room.name)}이(가) 건 것</small><span class="chip">${chipOf(room.bet)}</span></div>
        <label class="lb">내가 걸 것 · 상대와 달라도 돼요</label>
        <div class="seg" data-k><button type="button" data-b="stat">⚔ 술력</button><button type="button" data-b="msg">✉ 메시지</button><button type="button" class="on" data-b="coin">💰 영전</button></div>
        <div data-body></div>
        <div class="ft"><span class="cnt" data-left></span><span style="display:flex;gap:8px"><button type="button" class="mt-btn" data-x>취소</button><button type="button" class="mt-btn w" data-ok>들어가기</button></span></div></div>`;
      document.body.appendChild(d);
      const body = d.querySelector('[data-body]'), left = d.querySelector('[data-left]');
      const draw = () => {
        if (kind === 'stat') { body.innerHTML = `<label class="lb">걸 술력 · ${M.stat[0]} ~ ${M.stat[1]}</label><div class="amt"><input type="range" min="${M.stat[0]}" max="${M.stat[1]}" value="2"><b>2</b></div>`; left.textContent = '지면 내 술력을 잃어요'; }
        if (kind === 'coin') { body.innerHTML = `<label class="lb">걸 영전 · ${M.coin[0].toLocaleString()} ~ ${M.coin[1].toLocaleString()}</label><div class="amt"><input type="range" min="${M.coin[0]}" max="${M.coin[1]}" step="500" value="${M.coin[0]}"><b>${M.coin[0].toLocaleString()}</b></div>`; left.textContent = `가진 영전 ${(wal ? wal.coins : 0).toLocaleString()}`; }
        if (kind === 'msg') { body.innerHTML = `<label class="lb">내 개인 메시지 · 지면 상대에게 공개돼요</label><textarea maxlength="300" placeholder="대국마다 새로 써요"></textarea>`; left.textContent = '0 / 300'; const ta = body.querySelector('textarea'); ta.oninput = () => left.textContent = ta.value.length + ' / 300'; setTimeout(() => ta.focus(), 10); }
        const r = body.querySelector('input[type=range]'); if (r) r.oninput = () => body.querySelector('.amt b').textContent = (+r.value).toLocaleString();
      };
      draw();
      d.querySelector('[data-k]').onclick = e => { const b = e.target.closest('[data-b]'); if (!b) return; kind = b.dataset.b; d.querySelectorAll('[data-k] button').forEach(x => x.classList.toggle('on', x === b)); draw(); };
      const close = v => { d.remove(); document.removeEventListener('keydown', esc_); done(v); };
      const esc_ = e => { if (e.key === 'Escape') close(null); };
      document.addEventListener('keydown', esc_);
      d.onclick = e => { if (e.target === d || e.target.closest('[data-x]')) close(null); };
      d.querySelector('[data-ok]').onclick = () => {
        const ta = body.querySelector('textarea'), r = body.querySelector('input[type=range]');
        if (kind === 'msg' && !ta.value.trim()) { toast('개인 메시지를 적어야 들어갈 수 있어요.', 'err'); ta.focus(); return; }
        close({ bet: { kind, amount: r ? +r.value : 0 }, msg: ta ? ta.value : '' });
      };
      setTimeout(() => d.classList.add('on'), 10);
    });
  }
  let ROOMS = [];
  $('#rooms').onclick = async e => {
    const c = e.target.closest('[data-cancel]'); if (c) { try { await Store.matchCancel(c.dataset.cancel); toast('방을 닫고 베팅을 돌려받았어요.'); lobby(); } catch (err) { toast(err.message, 'err'); } return; }
    const j = e.target.closest('[data-join]'); if (!j) return;
    let pick = { msg: '', bet: null };
    if (!j.dataset.mine) { const room = ROOMS.find(r => r.id === j.dataset.join); pick = await askBet(room, await Store.wallet().catch(() => null)); if (!pick) return; }
    try { if (waitSub) { waitSub.stop(); waitSub = null; } const id = await Store.matchJoin(j.dataset.join, pick.msg, pick.bet || { kind: 'msg', amount: 0 }); enter(id); } catch (err) { toast(err.message, 'err'); }
  };
  const fx = text => { const e = $('#fx'); e.textContent = text; e.classList.remove('go'); void e.offsetWidth; e.classList.add('go'); };
  const avStyle = f => { const h = f && f.head ? ((window.headMp4 && headMp4(f.head) || {}).poster || f.head) : ''; return h ? `background-image:url('${esc(h)}');background-size:cover;background-position:center` : ''; };

  /* ---------- 대국 진행: 화면은 서버가 준 판(view)을 그리기만 해요 ---------- */
  let V = null, sub = null, busy = false, clockT = null, seenLog = 0, sel = null, aim = null, rpsShown = 0, rpsBusy = false, outSent = false, lastRound = 0;
  const leave = () => { if (sub) sub.stop(); sub = null; clearInterval(clockT); clockT = null; V = null; $('#rps').hidden = true; };
  async function enter(id) {
    leave(); show('v-game'); $('#log').innerHTML = ''; seenLog = 0; sel = null; aim = null; rpsShown = 0; rpsBusy = false; outSent = false; lastRound = 0;
    sub = Store.matchSub(id, () => pull(id));
    await pull(id);
    clockT = setInterval(tickClock, 1000);
  }
  async function pull(id) {
    if (busy) return;
    let v; try { v = await Store.matchView(id); } catch (e) { toast(e.message, 'err'); return; }
    if (!sub) return;   // 그사이 나갔어요
    const first = !V; V = Object.assign(v, { skew: Date.parse(v.now) - Date.now() });
    if (first) {
      $('#me-nm').textContent = v.me.name; $('#opp-nm').textContent = v.opp.name; $('#me-av').style.cssText = avStyle(v.me); $('#opp-av').style.cssText = avStyle(v.opp);
      $('#bet-me').textContent = chipOf(v.myBet); $('#bet-opp').textContent = chipOf(v.oppBet);
      $('#sk1-nm').textContent = '「' + v.me.skills[0] + '」'; $('#sk2-nm').textContent = '「' + v.me.skills[1] + '」';
      const go = v.game === 'gomoku';
      $('#ic1').innerHTML = go ? IC.erase : IC.frost; $('#ic2').innerHTML = IC.again;
      $('#sk1-ds').textContent = go ? '지우기 · 상대 돌 하나를 없애요' : '얼리기 · 상대 기물 하나를 한 차례 묶어요';
      $('#sk2-ds').textContent = go ? '한 번 더 · 이번 차례에 두 번 둬요' : '한 번 더 · 이번 차례에 두 번 움직여요';
    }
    draw();
  }
  async function act(action) {
    if (busy || !V) return; busy = true; const id = V.id;
    try { await Store.matchMove(id, action); if (sub) sub.ping(); }
    catch (e) { if (!/다시 해 주세요/.test(e.message)) toast(e.message, 'err'); }
    busy = false; await pull(id);
  }
  function draw() {
    const v = V, s = v.state;
    const reveal = s.phase === 'play' && rpsShown && s.rps && s.rps.prev && lastRound !== s.rps.prev.round + 'e';
    if (s.phase === 'rps' || rpsBusy || reveal) return rpsDraw();
    $('#rps').hidden = true;
    if (v.done || s.phase === 'done') { render(); return finish(); }
    render();
  }

  /* ---------- 가위바위보: 3 · 2 · 1 → 고르기 → 3초 → 공개 → 이긴 사람이 선공 ---------- */
  const HAND = { r: '✊', p: '✋', s: '✌️' }, HN = { r: '바위', p: '보', s: '가위' };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  async function rpsReveal(prev) {
    rpsBusy = true; const box = $('#rps-b'), v = V, meP = prev[v.side], opP = prev[v.side === 'a' ? 'b' : 'a'];
    box.innerHTML = `<p class="rp-t">상대도 냈어요…</p>`;
    await wait(3000); if (!V) return;
    box.innerHTML = `<p class="rp-big">가위 바위 보!</p>`;
    await wait(900); if (!V) return;
    const win = !prev.tie && V.state.first === v.side;
    box.innerHTML = `<div class="rp-show"><div><span>${HAND[meP]}</span><small>나 · ${HN[meP]}</small></div><b>VS</b><div><span>${HAND[opP]}</span><small>${esc(v.opp.name)} · ${HN[opP]}</small></div></div>
      <p class="rp-big">${prev.tie ? '비겼어요! 다시 한 번' : win ? '내가 선공!' : `${esc(v.opp.name)} 선공`}</p>`;
    await wait(2000); rpsBusy = false; if (V) draw();
  }
  async function rpsDraw() {
    const s = V.state, wrap = $('#rps'), box = $('#rps-b'); wrap.hidden = false;
    if (rpsBusy) return;
    // 처음 들어왔을 때 한 번만 카운트다운
    if (!rpsShown) {
      rpsShown = 1; rpsBusy = true;
      for (const n of [3, 2, 1]) { box.innerHTML = `<p class="rp-count">${n}</p>`; await wait(1000); if (!V) return; }
      rpsBusy = false; return draw();
    }
    const R = s.rps || {};
    if (s.phase !== 'rps') { if (R.prev && lastRound !== R.prev.round + 'e') { lastRound = R.prev.round + 'e'; return rpsReveal(R.prev); } wrap.hidden = true; return render(); }
    if (R.prev && R.prev.tie && lastRound !== R.prev.round) { lastRound = R.prev.round; return rpsReveal(R.prev); }
    const mine = R[V.side];
    box.innerHTML = mine ? `<p class="rp-t">나는 ${HAND[mine]} · 상대를 기다리는 중…</p><p class="rp-sub" id="rp-sec"></p>`
      : `<p class="rp-t">가위바위보 중 낼 것을 정하세요</p><div class="rp-hands">${['s', 'r', 'p'].map(k => `<button type="button" data-h="${k}"><span>${HAND[k]}</span><small>${HN[k]}</small></button>`).join('')}</div><p class="rp-sub" id="rp-sec"></p>`;
  }
  $('#rps').onclick = e => { const b = e.target.closest('[data-h]'); if (!b || !V || V.state.rps[V.side]) return; V.state.rps[V.side] = b.dataset.h; rpsDraw(); act({ t: 'rps', pick: b.dataset.h }); };

  /* ---------- 시계: 표시만 내 화면에서 · 시간 초과 판정은 서버가 해요 ---------- */
  function tickClock() {
    if (!V || V.done) return;
    const s = V.state, nowS = Date.now() + (V.skew || 0);
    if (s.phase === 'rps') {
      const left = Math.max(0, Math.ceil((Date.parse(V.rps_at) - nowS) / 1000)), e = $('#rp-sec'); if (e) e.textContent = left + '초';
      if (!left && !rpsBusy && !busy && !outSent) { outSent = true; act({ t: 'rpsTimeout' }).then(() => { outSent = false; }); }
      return;
    }
    if (s.phase !== 'play') return;
    const left = Math.max(0, 600 - Math.floor((nowS - Date.parse(V.turn_at)) / 1000)), fmt = n => `${Math.floor(n / 60)}:${String(n % 60).padStart(2, '0')}`, mine = s.turn === V.side;
    $('#me-clock').textContent = mine ? fmt(left) : '10:00'; $('#opp-clock').textContent = mine ? '10:00' : fmt(left);
    $('#p-me').classList.toggle('low', mine && left <= 60); $('#p-opp').classList.toggle('low', !mine && left <= 60);
    if (!left && !busy && !outSent) { outSent = true; act({ t: 'clockOut' }); }
  }

  /* ---------- 판 그리기 ---------- */
  function sharedUI() {
    const s = V.state, mine = s.turn === V.side && s.phase === 'play';
    $('#p-me').classList.toggle('turn', mine); $('#p-opp').classList.toggle('turn', !mine && s.phase === 'play');
    $('#uses').textContent = '남은 횟수 ' + ((s.uses || {})[V.side] ?? 2);
    ['sk1', 'sk2'].forEach((id, k) => { const b = $('#' + id); b.disabled = !mine || busy || ((s.uses || {})[V.side] || 0) < 1 || ((s.used || {})[V.side] || []).includes(k); b.classList.toggle('armed', (k === 0 && aim === 'sk') || (k === 1 && !!s.extra && mine)); });
    const lg = s.log || [], skills = (by) => by === V.side ? V.me.skills : V.opp.skills, nm = by => by === V.side ? '나' : esc(V.opp.name);
    for (; seenLog < lg.length; seenLog++) {
      const l = lg[seenLog];
      if (l.k === 'move') addLog(`${nm(l.by)} · ${esc(l.x)}`);
      if (l.k === 'erase') { addLog(`<b>${nm(l.by)}</b> · 「${esc(skills(l.by)[0])}」으로 돌 하나를 지웠어요`, 'fx'); fx(`「${skills(l.by)[0]}」`); }
      if (l.k === 'freeze') { addLog(`<b>${nm(l.by)}</b> · 「${esc(skills(l.by)[0])}」으로 ${esc(l.x)} 기물을 얼렸어요`, 'fx'); fx(`「${skills(l.by)[0]}」`); }
      if (l.k === 'again') { addLog(`<b>${nm(l.by)}</b> · 「${esc(skills(l.by)[1])}」 한 번 더!`, 'fx'); fx(`「${skills(l.by)[1]}」`); }
    }
  }
  const addLog = (html, cls) => { const l = $('#log'); l.insertAdjacentHTML('beforeend', `<p class="${cls || ''}">${html}</p>`); l.scrollTop = l.scrollHeight; };
  function render() { const s = V.state; if (!s.board && !s.fen) return; (V.game === 'gomoku' ? renderGo : renderChess)(); sharedUI(); }
  function renderGo() {
    const s = V.state, N = MatchEngine.N, el = $('#board'), ME = MatchEngine.stoneOf(s, V.side), OP = 3 - ME;
    el.className = 'go-board'; el.classList.toggle('erase', aim === 'sk');
    $('#me-side').innerHTML = `<span class="stone-ic ${ME === 1 ? 'b' : 'w'}"></span>${ME === 1 ? '흑 · 선수' : '백 · 후수'}`; $('#opp-side').innerHTML = `<span class="stone-ic ${OP === 1 ? 'b' : 'w'}"></span>${OP === 1 ? '흑 · 선수' : '백 · 후수'}`;
    const win = s.line || [];
    el.innerHTML = s.board.map((v, i) => { const x = i % N, y = (i / N) | 0, star = [3, 7, 11].includes(x) && [3, 7, 11].includes(y);
      const cls = ['c', x === 0 && 'l', x === N - 1 && 'r', y === 0 && 't', y === N - 1 && 'bt', star && 'star'].filter(Boolean).join(' ');
      return `<button type="button" class="${cls}" data-i="${i}">${star ? '<i class="dot"></i>' : ''}${v ? `<span class="st ${v === 1 ? 'b' : 'w'}${i === s.last ? ' last' : ''}${win.includes(i) ? ' win' : ''}"></span>` : '<span class="ghost"></span>'}</button>`; }).join('');
  }
  const GL = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' }, F = 'abcdefgh';
  function renderChess() {
    const s = V.state, el = $('#board');
    if (typeof Chess === 'undefined') { el.innerHTML = '<p class="gl" style="padding:20px">체스 규칙 코드를 불러오지 못했어요 (인터넷 연결 확인)</p>'; return; }
    const ch = new Chess(s.fen), MY = MatchEngine.colorOf(s, V.side), OPC = MY === 'w' ? 'b' : 'w', flip = MY === 'b';
    $('#me-side').textContent = MY === 'w' ? '♔ 백 · 선수' : '♚ 흑 · 후수'; $('#opp-side').textContent = OPC === 'w' ? '♔ 백 · 선수' : '♚ 흑 · 후수';
    const bd = ch.board(), tg = sel ? ch.moves({ square: sel, verbose: true }) : [], chk = ch.in_check() ? (() => { for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) { const p = bd[r][f]; if (p && p.type === 'k' && p.color === ch.turn()) return F[f] + (8 - r); } })() : null;
    el.className = 'ch-board'; el.classList.toggle('aim', aim === 'sk');
    const rows = flip ? [...bd].reverse().map(r => [...r].reverse()) : bd, last = s.last || {}, frz = s.frozen && s.frozen.sq;
    el.innerHTML = rows.map((row, ri) => row.map((p, fi) => { const r = flip ? 7 - ri : ri, f = flip ? 7 - fi : fi, sq = F[f] + (8 - r), t = tg.find(m => m.to === sq);
      const cls = ['q', (r + f) % 2 ? 'dk' : 'lt', sel === sq && 'sel', t && 'tg', t && t.captured && 'cap', (last.from === sq || last.to === sq) && 'last', chk === sq && 'chk', frz === sq && 'frost'].filter(Boolean).join(' ');
      return `<button type="button" class="${cls}" data-s="${sq}">${p ? `<span class="pc ${p.color}">${GL[p.type]}︎</span>` : ''}${fi === 7 ? `<span class="co f">${8 - r}</span>` : ''}${ri === 7 ? `<span class="co r">${F[f]}</span>` : ''}</button>`; }).join('')).join('');
  }
  $('#board').onclick = e => {
    if (!V || busy) return; const s = V.state; if (s.phase !== 'play' || s.turn !== V.side) return;
    if (V.game === 'gomoku') {
      const c = e.target.closest('[data-i]'); if (!c) return; const i = +c.dataset.i;
      if (aim === 'sk') { if (s.board[i] !== 3 - MatchEngine.stoneOf(s, V.side)) return; aim = null; return act({ t: 'skill', k: 0, i }); }
      if (s.board[i]) return;
      return act({ t: 'place', i });
    }
    const q = e.target.closest('[data-s]'); if (!q) return; const sq = q.dataset.s, ch = new Chess(s.fen), MY = MatchEngine.colorOf(s, V.side), p = ch.get(sq);
    if (aim === 'sk') { if (!p || p.color === MY || p.type === 'k') return; aim = null; return act({ t: 'skill', k: 0, sq }); }
    if (sel && ch.moves({ square: sel, verbose: true }).some(m => m.to === sq)) { const from = sel; sel = null; return act({ t: 'move', from, to: sq }); }
    sel = p && p.color === MY && !(s.frozen && s.frozen.side === V.side && s.frozen.sq === sq) ? sq : null; render();
  };
  $('#sk1').onclick = () => {
    const s = V && V.state; if (!s || s.turn !== V.side) return;
    if (V.game === 'gomoku' && !s.board.includes(3 - MatchEngine.stoneOf(s, V.side))) return toast('지울 상대 돌이 아직 없어요.');
    aim = aim === 'sk' ? null : 'sk'; sel = null; render();
  };
  $('#sk2').onclick = () => { if (V && !V.state.extra) act({ t: 'skill', k: 1 }); };
  $('#resign').onclick = async () => { if (V && await askConfirm('기권할까요? 지는 걸로 정산돼요.')) act({ t: 'resign' }); };

  /* ---------- 결과 ---------- */
  function finish() {
    if ($('#v-res').dataset.id === V.id) return; $('#v-res').dataset.id = V.id;
    const v = V; clearInterval(clockT); clockT = null; if (sub) { sub.stop(); sub = null; }
    const result = v.result || v.state.winner, win = result === v.side, draw_ = result === 'draw', why = v.why || v.state.why || '';
    const lose = (b) => b.kind === 'coin' ? `영전 −${b.amount.toLocaleString()}` : b.kind === 'stat' ? `술력 −${b.amount}` : '내 메시지가 상대에게 공개돼요';
    const gain = (b) => b.kind === 'coin' ? `영전 +${b.amount.toLocaleString()}` : b.kind === 'stat' ? `술력 +${b.amount}` : '상대 메시지 공개';
    const detail = draw_ ? '건 것을 서로 돌려받았어요' : win ? gain(v.oppBet) : lose(v.myBet);
    setTimeout(() => {
      show('v-res');
      const ico = draw_ ? '<path d="M5 9.5h14M5 14.5h14"/>' : win ? '<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/>' : '<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z" opacity=".35"/><path d="M4 20L20 4"/>';
      $('#res').innerHTML = `<div class="gl rs ${draw_ ? 'draw' : win ? 'win' : 'lose'}"><div class="tabhd"><span class="tab"><i></i>대국 결과</span><span class="ln"><i></i><i></i><i></i></span><span class="code">${draw_ ? '무승부' : win ? '승리' : '패배'}</span></div>
          <div class="rs-badge"><span class="rs-por" style="${avStyle(v.me)}"></span><svg class="rs-ic" viewBox="0 0 24 24">${ico}</svg></div>
          <div class="rs-body"><h3>${esc(v.opp.name)}${draw_ ? '와(과) 무승부' : win ? '에게 승리했어요' : '에게 졌어요'}</h3>
            <div class="sc">${v.game === 'chess' ? '체스' : '오목'} · ${esc(why)}</div><div class="gain"><span>베팅</span><b class="${/[0-9]/.test(detail) ? '' : 'txt'}">${esc(detail)}</b></div></div>
          <div class="rs-ft"><span class="rs-uid">MATCH · ${esc(String(v.id).slice(-6).toUpperCase())}</span><button type="button" class="mt-btn w" id="back">대국 로비로</button></div></div>
        ${v.loot != null ? `<div class="gl rs-loot"><div class="tabhd"><span class="tab"><i></i>전리품</span><span class="ln"><i></i><i></i><i></i></span></div><div class="loot"><span class="tape"></span><small>${esc(v.opp.name)}의 봉인된 메시지</small><p>${esc(v.loot)}</p><div class="from">― ${esc(v.opp.name)}</div></div></div>` : ''}`;
      $('#back').onclick = () => { leave(); $('#v-res').dataset.id = ''; lobby(); };
    }, 1300);
  }

  lobby();
});
</script>
</body>
</html>
