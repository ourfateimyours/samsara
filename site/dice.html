<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다이스 룰렛</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700;800&display=swap">
<style>
@font-face { font-family: 'Chosunilbo_myungjo'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/Chosunilbo_myungjo.woff') format('woff'); font-weight: 100 900; font-style: normal; font-display: swap; }
:root { --gold: #e6c37a; --gold2: #f6e3b0; --navy: #4a62e0; --deep: #0a0c1c; --ink: #f6f4f9; --sub: rgba(246,244,249,.62); --line: rgba(255,255,255,.26);
  --serif: 'Chosunilbo_myungjo', serif; --sans: 'IBM Plex Sans KR', sans-serif; --mono: 'JetBrains Mono', 'IBM Plex Sans KR', sans-serif;
  --ts: 0 1px 10px rgba(0,0,0,.75), 0 0 2px rgba(0,0,0,.5); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #05050b; color: var(--ink); font-family: var(--sans); }
button { font-family: inherit; }
.scr { position: fixed; inset: 0; overflow: hidden; isolation: isolate; }

/* ═══ 겹: 배경 · 보스 · 컨페티 ═══ */
.gx img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.gx .cr { mix-blend-mode: screen; opacity: .4; transform: translate(var(--ax, 1px), var(--bx, 0)); transition: transform .12s ease-out; }
.gx .cc { mix-blend-mode: screen; opacity: .5; transform: translate(calc(var(--ax, 1px) * -1), calc(var(--bx, 0) * -1)); transition: transform .12s ease-out; }
.gx .sl { opacity: 0; filter: brightness(1.1); clip-path: inset(var(--t, 40%) var(--r, 0%) var(--b, 50%) var(--l, 0%)); transform: translate(var(--x, 0), var(--y, 0)) scale(var(--sx, 1), var(--sy, 1)); transform-origin: 50% var(--oy, 50%); }
.gx.on .sl { opacity: 1; }
.gx .px { opacity: 0; width: 4% !important; height: 4% !important; transform-origin: 0 0; transform: scale(25); image-rendering: pixelated; clip-path: inset(var(--t, 40%) 0 var(--b, 40%) 0); }
.gx.pix .px { opacity: 1; }
.gx .nz { position: absolute; inset: 0; background: var(--noise) var(--nx, 0) var(--ny, 0) / 160px 160px; mix-blend-mode: screen; opacity: 0; clip-path: inset(var(--nt, 40%) 0 var(--nb, 40%) 0); }
.gx.nzon .nz { opacity: .3; }
.gx .vd { position: absolute; inset: 0; opacity: 0; } .gx .vd i { position: absolute; display: block; } .gx.vdon .vd { opacity: 1; }
.gx.echo .cr, .gx.echo .cc { opacity: .78; transition: none; }
.gx.inv .b0 { filter: grayscale(1) invert(1) contrast(1.3) brightness(1.2); }
.gx.dim .b0 { filter: brightness(1.5) contrast(.92); }
.gx.roll { animation: roll .16s steps(3) 2; } @keyframes roll { 50% { transform: translateY(-3%); } }
.gx .pk { position: absolute; inset: 0; opacity: 0; background: var(--pi) var(--px, 50%) var(--py, 50%) / cover no-repeat; clip-path: inset(var(--t, 40%) var(--r, 40%) var(--b, 40%) var(--l, 40%));
  filter: grayscale(.25) contrast(1.15) brightness(1.1) drop-shadow(-3px 0 rgba(230,195,122,.7)) drop-shadow(3px 0 rgba(74,98,224,.7)); transform: translate(var(--x, 0), 0); }
.gx.pkon .pk { opacity: .9; }
.bg { position: absolute; inset: -3%; filter: blur(4px) brightness(.72) saturate(1.05); z-index: 0; }
.rays { position: absolute; left: 50%; top: 44%; width: 170vmax; aspect-ratio: 1; translate: -50% -50%; z-index: 0; pointer-events: none; opacity: .16; mix-blend-mode: screen;
  background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.9) 0 1.2deg, transparent 1.2deg 9deg, rgba(230,195,122,.7) 9deg 9.6deg, transparent 9.6deg 17deg);
  -webkit-mask: radial-gradient(circle, transparent 8%, #000 22%, transparent 62%); mask: radial-gradient(circle, transparent 8%, #000 22%, transparent 62%); animation: spin 120s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.boss { position: absolute; left: 50%; top: 50%; height: 112%; aspect-ratio: 16 / 9; translate: -50% -48%; z-index: 1; pointer-events: none;
  -webkit-mask: radial-gradient(ellipse 34% 46% at 50% 44%, #000 50%, rgba(0,0,0,.6) 72%, transparent 100%); mask: radial-gradient(ellipse 34% 46% at 50% 44%, #000 50%, rgba(0,0,0,.6) 72%, transparent 100%); animation: bfloat 7s ease-in-out infinite; }
@keyframes bfloat { 50% { transform: translateY(-1.2%) scale(1.01); } }
.boss.turn .b0 { filter: drop-shadow(0 0 40px rgba(255,255,255,.5)); }
.cfw { position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: .2; filter: brightness(0) invert(1);
  -webkit-mask: radial-gradient(ellipse 70% 65% at 50% 46%, transparent 30%, #000 85%); mask: radial-gradient(ellipse 70% 65% at 50% 46%, transparent 30%, #000 85%); animation: creep 9s ease-in-out infinite; }
@keyframes creep { 0%, 100% { transform: scale(1) rotate(0deg); } 30% { transform: scale(1.03, 1.06) rotate(-.6deg) skewX(-1.5deg); } 62% { transform: scale(1.05, 1.02) rotate(.5deg) skewY(1deg); } }
.cfw.boo { animation: surge var(--bd, 3s) cubic-bezier(.1,.9,.2,1) 1, creep 9s ease-in-out infinite; }
@keyframes surge { 0% { opacity: .2; } 6% { opacity: .62; transform: scale(1.14) skewX(-6deg); } 20% { opacity: .5; transform: scale(1.1) skewX(3deg); } 100% { opacity: .2; transform: none; } }
.shade { position: absolute; inset: 0; z-index: 3; pointer-events: none; background: linear-gradient(180deg, rgba(4,5,14,.72), transparent 22%, transparent 60%, rgba(4,5,14,.88)), radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0,0,0,.62)); }
#dust { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; mix-blend-mode: screen; }
.scr.shake { animation: sh .4s; } @keyframes sh { 20% { transform: translate(-7px, 3px); } 40% { transform: translate(6px, -4px); } 60% { transform: translate(-3px, 2px); } }
.flash { position: absolute; inset: 0; z-index: 30; pointer-events: none; opacity: 0; background: radial-gradient(circle, rgba(255,255,255,.9), rgba(255,255,255,.25) 60%, transparent); }
.flash.on { animation: fl 1.1s ease-out; } @keyframes fl { 8%, 26% { opacity: 1; } 100% { opacity: 0; } }

/* ═══ 공통 장식: 실선 · 마름모 · 라벨 ═══ */
.lbl { font: 700 9.5px var(--mono); letter-spacing: .26em; color: var(--gold); text-transform: uppercase; text-shadow: var(--ts); white-space: nowrap; }
.dia { display: inline-block; width: 6px; height: 6px; transform: rotate(45deg); background: #fff; box-shadow: 0 0 8px #fff; flex: none; }
.dia.o { background: none; border: 1px solid #fff; }
.rule { display: flex; align-items: center; gap: 8px; } .rule::before, .rule::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.7)); } .rule::after { transform: scaleX(-1); }
.hz { height: 5px; background: repeating-linear-gradient(-45deg, var(--gold) 0 4px, transparent 4px 9px); opacity: .7; }
.deco { position: absolute; z-index: 5; pointer-events: none; display: flex; align-items: center; gap: 8px; }
.deco.tl { left: 22px; top: 18px; } .deco.bl { left: 22px; bottom: 14px; } .deco.br2 { right: 22px; bottom: 14px; }
.deco i { display: block; width: 46px; height: 1px; background: linear-gradient(90deg, #fff, transparent); } .deco.br2 i { transform: scaleX(-1); }
.deco .hz { width: 54px; }

/* ═══ 위 가운데: 보스 이름 + 떠넘겨진 피해 ═══ */
.plate { position: absolute; left: 50%; top: 16px; translate: -50% 0; z-index: 6; width: min(520px, 58vw); text-align: center; }
.plate .top { display: flex; align-items: center; justify-content: center; gap: 10px; }
.warn { display: inline-grid; place-items: center; width: 18px; height: 16px; color: #111; background: var(--gold); clip-path: polygon(50% 0, 100% 100%, 0 100%); font: 800 9px var(--mono); padding-top: 4px; filter: drop-shadow(0 0 6px rgba(230,195,122,.8)); }
.plate h1 { margin: 2px 0 0; font: 700 clamp(18px, 2.2vw, 26px) var(--serif); letter-spacing: .34em; text-indent: .34em; color: #fff; text-shadow: 0 0 18px rgba(255,255,255,.55), var(--ts); }
.gauge { position: relative; height: 5px; margin: 8px 0 0; background: rgba(255,255,255,.16); transform: skewX(-24deg); box-shadow: 0 0 0 1px rgba(255,255,255,.12); }
.gauge i { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, var(--gold), #fff); box-shadow: 0 0 12px #fff, 0 0 26px rgba(230,195,122,.8); transition: width .8s cubic-bezier(.2,.8,.2,1); }
.gauge i::after { content: ""; position: absolute; right: -3px; top: -4px; width: 2px; height: 13px; background: #fff; box-shadow: 0 0 10px #fff; }
.gauge::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), rgba(5,5,11,.8) calc(10% - 1px) 10%); z-index: 1; }
.plate .cap { display: flex; justify-content: space-between; margin-top: 5px; font: 600 9px var(--mono); letter-spacing: .14em; color: var(--sub); text-shadow: var(--ts); }
.plate .cap b { color: var(--gold2); }
.pot { display: block; margin-top: 2px; font: italic 700 clamp(30px, 4.4vw, 54px)/1.05 var(--serif); color: #fff; font-variant-numeric: tabular-nums; letter-spacing: .01em;
  text-shadow: -2px 0 rgba(230,195,122,.75), 2px 0 rgba(74,98,224,.75), 0 0 22px rgba(255,255,255,.5), 0 3px 14px rgba(0,0,0,.6); }
.pot.bump { animation: bump .45s cubic-bezier(.2,1.6,.4,1); } @keyframes bump { 0% { transform: scale(1.22); filter: brightness(1.8); } }

/* ═══ 오른쪽: 파티 (칸 없이 투명) ═══ */
.party { position: absolute; right: 22px; top: 128px; z-index: 6; width: min(300px, 34vw); padding: 0 0 4px 14px; }
.party .hd { position: relative; height: 44px; margin-bottom: 6px; text-align: right; }
.party .hd b { font: 400 15px var(--serif); letter-spacing: .5em; color: #fff; text-shadow: var(--ts); position: relative; z-index: 1; margin-right: 58px; line-height: 44px; }
.party .hd b::first-letter { font-size: 24px; }
.party .hd em { position: absolute; right: 0; top: -8px; font: italic 600 46px/1 var(--serif); color: rgba(255,255,255,.9); text-shadow: 0 0 20px rgba(255,255,255,.45), var(--ts); letter-spacing: -.02em; }
.party .hd::after { content: ""; position: absolute; left: 20%; right: 0; bottom: 2px; height: 1px; background: linear-gradient(90deg, transparent, #fff); }
.mem { position: relative; display: grid; grid-template-columns: 22px 1fr 30px; align-items: center; gap: 10px; height: 38px; margin-bottom: 9px; transition: height .4s cubic-bezier(.2,.8,.2,1); }
.mem .no { width: 20px; height: 20px; display: grid; place-items: center; font: 700 11px var(--mono); color: #111; background: #fff; box-shadow: 0 0 10px rgba(255,255,255,.5); }
.mem .pic { position: relative; height: 100%; overflow: hidden; border-bottom: 1.5px solid #fff; background: var(--c); opacity: .55; -webkit-mask: linear-gradient(270deg, #000 30%, transparent 98%); mask: linear-gradient(270deg, #000 30%, transparent 98%); transition: opacity .3s; }
.mem .pic em { position: absolute; right: 10px; top: 50%; translate: 0 -50%; font: 700 34px var(--serif); font-style: normal; color: rgba(255,255,255,.3); }
.mem .nm { position: absolute; left: 40px; top: 50%; translate: 0 -50%; font: 600 13px var(--serif); letter-spacing: .1em; text-shadow: var(--ts); white-space: nowrap; }
.mem .nm small { display: block; margin-top: 1px; font: 600 9.5px var(--mono); letter-spacing: .08em; color: var(--gold2); }
.mem .ic { width: 28px; height: 28px; border-radius: 50%; border: 1px solid rgba(255,255,255,.75); display: grid; place-items: center; font-size: 10px; color: #fff; background: rgba(5,6,14,.35); }
.mem.cur { height: 70px; }
.mem.cur .pic { opacity: .95; border-bottom-width: 2px; box-shadow: 0 6px 18px -8px rgba(255,255,255,.7); }
.mem.cur .no { background: var(--gold); box-shadow: 0 0 14px var(--gold); }
.mem.cur .nm { font-size: 17px; } .mem.cur .ic { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 12px rgba(230,195,122,.6); animation: icp 1.6s ease-in-out infinite; }
@keyframes icp { 50% { box-shadow: 0 0 22px rgba(230,195,122,.95); } }
.mem.cur::after { content: "TURN"; position: absolute; left: 40px; top: 5px; font: 700 8px var(--mono); letter-spacing: .4em; color: var(--gold); text-shadow: var(--ts); }
.mem.done { opacity: .4; }
.mem.bs .no { background: none !important; border: 0; box-shadow: none !important; }
/* 원념 차례 표시: 작고 날렵한 다이아 */
.mem .bdm { display: block; width: 10px; height: 10px; background: #fff; transform: rotate(45deg); filter: drop-shadow(0 0 4px rgba(255,255,255,.7)); }
.mem.cur .bdm { background: var(--gold); filter: drop-shadow(0 0 5px rgba(230,195,122,.9)); }
.mem.bs .pic { --c: linear-gradient(270deg, rgba(255,255,255,.4), transparent); }
.mem.stolen .pic { --c: linear-gradient(270deg, rgba(230,195,122,.6), transparent); } .mem.stolen .no { background: var(--gold); }
.mem .tag { position: absolute; left: -6px; top: -8px; z-index: 2; font: 700 8px var(--mono); letter-spacing: .3em; padding: 2px 6px; color: #111; background: #fff; clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%); }
.mem.steal-anim { animation: stealA 1.4s steps(1); } @keyframes stealA { 0%, 30%, 60% { opacity: 1; filter: none; transform: none; } 15%, 45% { opacity: .25; filter: invert(1); transform: translateX(8px) skewX(-14deg); } }
.party.gone .mem { animation: gone .35s ease-in forwards; } @keyframes gone { to { transform: translateX(110%); opacity: 0; } }
.party .mem.come { animation: come .5s cubic-bezier(.2,.8,.2,1) backwards; } @keyframes come { from { transform: translateX(60%); opacity: 0; filter: blur(6px); } }
/* 결계 */
.ward { position: absolute; inset: -14px -12px -12px -4px; pointer-events: none; opacity: 0; transition: opacity .8s; }
.ward::before { content: ""; position: absolute; inset: 0; border-radius: 18px; border: 1.5px solid rgba(255,255,255,.95);
  box-shadow: 0 0 14px rgba(255,255,255,.7), 0 0 34px rgba(255,255,255,.3), inset 0 0 18px rgba(255,255,255,.45), inset 0 0 50px rgba(255,255,255,.12);
  -webkit-mask: radial-gradient(circle at 0 0, #000 0 50px, transparent 150px), radial-gradient(circle at 100% 0, #000 0 50px, transparent 150px), radial-gradient(circle at 0 100%, #000 0 50px, transparent 150px), radial-gradient(circle at 100% 100%, #000 0 50px, transparent 150px);
  mask: radial-gradient(circle at 0 0, #000 0 50px, transparent 150px), radial-gradient(circle at 100% 0, #000 0 50px, transparent 150px), radial-gradient(circle at 0 100%, #000 0 50px, transparent 150px), radial-gradient(circle at 100% 100%, #000 0 50px, transparent 150px);
  animation: wardP 3.2s ease-in-out infinite; }
.ward::after { content: ""; position: absolute; inset: 0; border-radius: 18px; border: 1px solid rgba(255,255,255,.18); }
.ward i { position: absolute; width: 90px; height: 90px; translate: -50% -50%; background: radial-gradient(circle, #fff 0 2px, rgba(255,255,255,.75) 4px, rgba(255,255,255,.22) 14px, transparent 44px); animation: flare 2.8s ease-in-out infinite; }
.ward i::before, .ward i::after { content: ""; position: absolute; left: 50%; top: 50%; translate: -50% -50%; background: linear-gradient(90deg, transparent, #fff, transparent); width: 100%; height: 1px; }
.ward i::after { width: 1px; height: 60%; background: linear-gradient(transparent, #fff, transparent); }
.ward i:nth-child(1) { left: 6px; top: 6px; } .ward i:nth-child(2) { left: 64%; top: 0; animation-delay: -1s; }
.ward i:nth-child(3) { left: 10%; top: 100%; animation-delay: -1.8s; } .ward i:nth-child(4) { left: calc(100% - 6px); top: calc(100% - 6px); animation-delay: -.5s; }
@keyframes flare { 0%, 100% { opacity: .55; transform: scale(.75); } 50% { opacity: 1; transform: scale(1.1) rotate(8deg); } }
.ward.hit::before { animation: wardHit .8s ease-out; } .ward.hit i { animation: flareHit .8s ease-out; }
.ward .wl { position: absolute; left: 22px; bottom: -7px; font: 600 9px var(--mono); letter-spacing: .3em; color: #fff; text-shadow: 0 0 8px rgba(255,255,255,.8), var(--ts); }
.party.warded .ward { opacity: 1; }
@keyframes wardP { 50% { opacity: .7; } }
@keyframes wardHit { 0% { box-shadow: 0 0 40px #fff, 0 0 90px rgba(255,255,255,.6), inset 0 0 60px #fff; -webkit-mask: none; mask: none; } }
@keyframes flareHit { 0% { transform: scale(2.4); opacity: 1; } }
.ward.break { animation: wardBreak .9s steps(1) forwards; } @keyframes wardBreak { 0%, 40%, 70% { opacity: 1; } 20%, 55% { opacity: .1; } 100% { opacity: 0; } }
.shield { position: absolute; z-index: 25; display: grid; justify-items: end; gap: 2px; pointer-events: none; animation: shIn 2.8s ease-out forwards; }
.shield b { font: 600 30px var(--serif); color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.4); font-variant-numeric: tabular-nums; }
.shield small { font: 500 11px var(--sans); color: rgba(255,255,255,.85); letter-spacing: .12em; text-shadow: 0 1px 6px rgba(0,0,0,.45); }
@keyframes shIn { 0% { opacity: 0; transform: translateY(8px); } 14% { opacity: 1; transform: none; } 82% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }

/* ═══ 왼쪽 아래: 리볼버 ═══ */
.cylp { position: absolute; left: 26px; bottom: 44px; z-index: 6; text-align: center; }
.cyl { position: relative; width: clamp(84px, 9vw, 116px); aspect-ratio: 1; margin: 12px auto 0; }
.cyl::before { content: ""; position: absolute; inset: -12px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); border-top-color: #fff; border-bottom-color: var(--gold); animation: spin 14s linear infinite; }
.cyl .body { position: absolute; inset: 0; border-radius: 50%; transition: transform .55s cubic-bezier(.3,1.5,.5,1);
  background: radial-gradient(circle at 50% 50%, #1a1c26 0 16%, transparent 17%), radial-gradient(circle at 38% 32%, #f4f5fa, #9aa0b3 55%, #2a2d3a 90%); box-shadow: 0 0 0 1px rgba(255,255,255,.6), 0 0 22px rgba(255,255,255,.25), 0 12px 30px rgba(0,0,0,.7); }
.cyl.spin .body { transition: transform 2s cubic-bezier(.15,.8,.25,1); }
.cyl .ch { position: absolute; width: 24%; aspect-ratio: 1; border-radius: 50%; left: 38%; top: 38%; background: radial-gradient(circle at 40% 35%, #0d0e14, #000); box-shadow: inset 0 0 0 2px rgba(20,22,32,.9); }
.cyl .ch em { position: absolute; inset: 0; display: grid; place-items: center; font: 700 10px var(--mono); font-style: normal; color: rgba(255,255,255,.8); }
.cyl .ch.hit { background: radial-gradient(circle at 40% 35%, #fff, #e9d7a6); box-shadow: 0 0 14px #fff, 0 0 30px rgba(230,195,122,.9); } .cyl .ch.hit em { color: #111; }
.cyl::after { content: ""; position: absolute; left: 50%; top: -18px; translate: -50% 0; border: 5px solid transparent; border-top: 8px solid #fff; filter: drop-shadow(0 0 6px #fff); }

/* ═══ 아래 가운데: 다이스 ═══ */
.stage { position: absolute; left: 50%; bottom: 34px; translate: -50% 0; z-index: 6; width: min(380px, 56vw); text-align: center; }
.dicebox { position: relative; width: 60%; margin: 0 auto -6px; aspect-ratio: 1.05; }
.dicebox canvas { width: 100% !important; height: 100% !important; }
.circ { position: absolute; left: 50%; top: 44%; translate: -50% -50%; width: 150%; aspect-ratio: 1; z-index: -1; pointer-events: none; opacity: .9; filter: brightness(3) drop-shadow(0 0 6px rgba(255,255,255,.9)) drop-shadow(0 0 18px rgba(230,195,122,.55)); }
.circ .rot { position: absolute; inset: 0; animation: spin 40s linear infinite; -webkit-mask: radial-gradient(circle at 50% 50%, #000 31.5%, transparent 33%); mask: radial-gradient(circle at 50% 50%, #000 31.5%, transparent 33%); }
.circ img { position: absolute; top: 0; height: 100% !important; width: 32.1% !important; max-width: none; object-fit: fill; } .circ img.l { left: 17.9%; } .circ img.r { left: 50%; transform: scaleX(-1); }
.circ.fast .rot { animation-duration: 2.4s; }
.who { display: flex; align-items: center; justify-content: center; gap: 10px; font: 600 11px var(--mono); letter-spacing: .24em; color: var(--sub); text-shadow: var(--ts); }
.who b { font: 700 16px var(--serif); letter-spacing: .14em; color: #fff; }
.clock { display: flex; align-items: center; gap: 10px; margin: 8px auto 0; width: 86%; }
.clock .bar { position: relative; flex: 1; height: 2px; background: rgba(255,255,255,.16); }
.clock .bar i { position: absolute; inset: 0; background: linear-gradient(90deg, var(--gold), #fff, var(--gold)); box-shadow: 0 0 8px rgba(255,255,255,.8); transform-origin: center; transition: transform 1s linear; }
.clock b { font: 700 13px var(--mono); letter-spacing: .1em; min-width: 46px; color: #fff; text-shadow: var(--ts); } .clock.low b { color: var(--gold); animation: blink .5s steps(2) infinite; } @keyframes blink { 50% { opacity: .4; } }
.tags { position: absolute; left: 50%; top: -6px; translate: -50% 0; display: flex; gap: 6px; justify-content: center; white-space: nowrap; }
.tg { font: 700 10px var(--mono); letter-spacing: .16em; padding: 4px 12px; color: #111; background: #fff; clip-path: polygon(7px 0, 100% 0, calc(100% - 7px) 100%, 0 100%); box-shadow: 0 0 14px #fff; }
.tg.g { background: linear-gradient(90deg, var(--gold), var(--gold2)); } .tg.in { animation: tgIn .5s cubic-bezier(.2,1.6,.4,1); } @keyframes tgIn { from { transform: scale(1.7); opacity: 0; filter: blur(4px); } }

/* ═══ 오른쪽 아래: 관리자 조작 (원형 버튼) ═══ */
.ctl { position: absolute; right: 26px; bottom: 40px; z-index: 9; display: flex; align-items: flex-end; gap: 14px; }
body.player .ctl, body.player .drawer, body.player .settleBtn { display: none !important; }
.cb { position: relative; width: 50px; height: 50px; border-radius: 50%; border: 1px solid rgba(255,255,255,.7); background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.22), rgba(10,12,28,.55) 70%); color: #fff; font-size: 17px; cursor: pointer; backdrop-filter: blur(4px); transition: transform .15s, box-shadow .2s; }
.cb:hover:not(:disabled) { transform: scale(1.08); box-shadow: 0 0 18px rgba(255,255,255,.6); }
.cb small { position: absolute; left: 50%; top: calc(100% + 5px); translate: -50% 0; font: 700 8.5px var(--mono); letter-spacing: .2em; color: var(--sub); white-space: nowrap; text-shadow: var(--ts); }
.cb.on { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 16px rgba(230,195,122,.7); }
.cb.rl { width: 92px; height: 92px; font: 700 12px var(--sans); letter-spacing: .1em; border: 0; background: radial-gradient(circle at 35% 28%, #fff, #e9e6f2 45%, #b9b4cc 100%); color: #14131f; box-shadow: 0 0 0 1px #fff, 0 0 30px rgba(255,255,255,.55), 0 10px 26px rgba(0,0,0,.6); }
.cb.rl::before { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 1px solid rgba(255,255,255,.4); border-top-color: #fff; border-right-color: var(--gold); animation: spin 5s linear infinite; }
.cb.rl::after { content: ""; position: absolute; inset: -16px; border-radius: 50%; border: 1px dashed rgba(255,255,255,.3); animation: spin 22s linear infinite reverse; }
.cb.rl b { display: block; font: 700 19px var(--serif); letter-spacing: .12em; } .cb.rl span { display: block; font: 600 9px var(--mono); letter-spacing: .1em; opacity: .7; max-width: 80px; margin: 0 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cb:disabled { opacity: .4; cursor: default; filter: grayscale(.6); } .cb.rl:disabled::before { animation-play-state: paused; }
.settleBtn { position: absolute; left: 50%; bottom: 236px; translate: -50% 0; z-index: 9; padding: 12px 40px; border: 0; cursor: pointer; font: 700 14px var(--sans); letter-spacing: .14em; color: #14131f;
  background: linear-gradient(90deg, var(--gold), #fff 50%, var(--gold)); background-size: 200% 100%; clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%); filter: drop-shadow(0 0 16px rgba(230,195,122,.8)); animation: shine 2.4s linear infinite; }
@keyframes shine { to { background-position: -200% 0; } }
/* 서랍 (버프 · 효과 설정) */
.drawer { position: absolute; right: 26px; bottom: 170px; z-index: 12; width: min(340px, calc(100vw - 52px)); padding: 0 16px 14px; display: none;
  background: linear-gradient(180deg, rgba(14,16,36,.82), rgba(10,12,28,.7)); border: 1px solid rgba(255,255,255,.3); backdrop-filter: blur(12px); box-shadow: 0 20px 50px -20px #000, inset 0 0 40px rgba(74,98,224,.12); }
.drawer.on { display: block; animation: drw .3s cubic-bezier(.2,.9,.2,1); } @keyframes drw { from { opacity: 0; transform: translateY(12px); } }
.drawer::before, .drawer::after { content: "✦"; position: absolute; font-size: 9px; color: #fff; } .drawer::before { left: 6px; bottom: 4px; } .drawer::after { right: 6px; bottom: 4px; }
.drawer h3 { margin: 0 -16px 12px; padding: 7px 16px; font: 600 12px var(--sans); letter-spacing: .3em; color: #fff; background: linear-gradient(90deg, rgba(255,255,255,.2), rgba(255,255,255,.04)); border-bottom: 1px solid rgba(255,255,255,.25); display: flex; justify-content: space-between; align-items: center; }
.drawer h3 button { background: none; border: 0; color: var(--sub); cursor: pointer; font-size: 13px; }
.drawer .row { display: flex; gap: 6px; margin-bottom: 8px; }
.drawer input[type=text], .drawer input[type=number] { min-width: 0; flex: 1; padding: 8px 10px; font: 500 12px var(--sans); color: #fff; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.22); outline: none; }
.drawer input:focus { border-color: var(--gold); }
.bf { flex: 1; padding: 10px 4px 8px; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.05); color: #fff; cursor: pointer; text-align: center; transition: background .2s, border-color .2s; }
.bf:hover { background: rgba(230,195,122,.16); border-color: var(--gold); } .bf i { display: block; font-style: normal; font-size: 18px; color: var(--gold2); } .bf b { display: block; margin-top: 3px; font: 600 11.5px var(--sans); } .bf small { display: block; font: 600 8px var(--mono); letter-spacing: .14em; color: var(--sub); }
.fxd { max-height: min(70vh, 560px); overflow: auto; }
.fxd .tabs { display: flex; gap: 4px; margin-bottom: 10px; } .fxd .tabs button { flex: 1; padding: 6px; font: 600 11px var(--sans); color: var(--sub); background: none; border: 1px solid rgba(255,255,255,.2); cursor: pointer; } .fxd .tabs button.on { color: #111; background: #fff; }
.fxd .kinds { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin-bottom: 10px; } .fxd label { display: flex; align-items: center; gap: 6px; font: 500 12px var(--sans); cursor: pointer; }
.fxd input[type=checkbox] { accent-color: #e6c37a; } .fxd input[type=range] { flex: 1; accent-color: #e6c37a; }
.fxd .sl2 { display: grid; grid-template-columns: 74px 1fr 40px; align-items: center; gap: 8px; margin-bottom: 4px; font: 500 11.5px var(--sans); } .fxd .sl2 output { font: 600 10px var(--mono); color: var(--gold2); text-align: right; }
.fxd .tools { display: flex; gap: 6px; margin-top: 10px; } .fxd .tools button { flex: 1; padding: 7px; font: 600 11px var(--sans); color: #fff; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.3); cursor: pointer; }

/* ═══ 효과 ═══ */
.fx { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
.num { position: absolute; left: 50%; top: 42%; font: italic 700 clamp(34px, 5vw, 64px) var(--serif); color: #fff; white-space: nowrap; font-variant-numeric: tabular-nums;
  text-shadow: -3px 0 rgba(230,195,122,.8), 3px 0 rgba(74,98,224,.8), 0 0 20px rgba(255,255,255,.7), 0 4px 16px rgba(0,0,0,.5); animation: up 1.7s cubic-bezier(.2,.8,.2,1) forwards; }
.num small { display: block; font: 700 .2em var(--mono); letter-spacing: .4em; color: var(--gold2); font-style: normal; text-align: center; margin-bottom: 2px; }
.num::after { content: ""; position: absolute; left: -12%; right: -12%; bottom: 2px; height: 2px; background: linear-gradient(90deg, transparent, #fff, transparent); }
@keyframes up { 0% { transform: translate(-50%, 10px) scale(.4) skewX(-12deg); opacity: 0; filter: blur(8px); } 12% { transform: translate(-50%, -6px) scale(1.18) skewX(-6deg); opacity: 1; filter: none; } 26% { transform: translate(-50%, 0) scale(1) skewX(-6deg); } 100% { transform: translate(-50%, -80px) skewX(-6deg); opacity: 0; } }
.spk { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; box-shadow: 0 0 8px #fff, 0 0 14px var(--gold); animation: spk var(--d, .8s) cubic-bezier(.1,.8,.3,1) forwards; }
@keyframes spk { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
.streak { position: absolute; height: 1px; background: linear-gradient(90deg, transparent, #fff, transparent); animation: streak .5s ease-out forwards; transform-origin: 50% 50%; }
@keyframes streak { 0% { transform: rotate(var(--a)) scaleX(0); opacity: 1; } 100% { transform: rotate(var(--a)) scaleX(1); opacity: 0; } }
/* 물결: 원 크기 자체를 키워서 선은 끝까지 1px · 가는 고리 세 겹이 차례로 번져요 */
.ring2 { position: absolute; left: 50%; top: 46%; width: 0; height: 0; translate: -50% -50%; border-radius: 50%; border: 1px solid rgba(255,255,255,.85); z-index: 24; pointer-events: none; box-shadow: 0 0 6px rgba(255,255,255,.45); animation: ring2 1.1s cubic-bezier(.15,.7,.3,1) backwards; }
@keyframes ring2 { 0% { width: 0; height: 0; opacity: 1; } 100% { width: 170vmax; height: 170vmax; opacity: 0; } }
.big { position: absolute; inset: 0; z-index: 26; display: grid; place-items: center; pointer-events: none; opacity: 0; }
.big::before { content: ""; position: absolute; left: 50%; top: 50%; width: 160vmax; aspect-ratio: 1; translate: -50% -50%; background: repeating-conic-gradient(rgba(255,255,255,.5) 0 .8deg, transparent .8deg 6deg); -webkit-mask: radial-gradient(circle, transparent 12%, #000 20%, transparent 55%); mask: radial-gradient(circle, transparent 12%, #000 20%, transparent 55%); animation: spin 30s linear infinite; }
.big::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 190px; translate: 0 -50%; background: linear-gradient(90deg, transparent, rgba(8,10,24,.8) 20%, rgba(8,10,24,.8) 80%, transparent); border-top: 1px solid rgba(255,255,255,.6); border-bottom: 1px solid rgba(255,255,255,.6); z-index: -1; }
.big div { position: relative; text-align: center; } .big small { display: block; font: 700 11px var(--mono); letter-spacing: .7em; text-indent: .7em; color: var(--gold); }
.big b { display: block; font: italic 700 clamp(44px, 10vw, 128px)/1.1 var(--serif); color: #fff; font-variant-numeric: tabular-nums; text-shadow: -4px 0 rgba(230,195,122,.8), 4px 0 rgba(74,98,224,.8), 0 0 34px rgba(255,255,255,.8); }
.big span { display: block; margin-top: 4px; font: 600 14px var(--sans); letter-spacing: .08em; } .big span em { font-style: normal; color: var(--gold2); font-weight: 700; }
.big.on { animation: bigA 4s ease-out forwards; } @keyframes bigA { 0% { opacity: 0; transform: scale(1.5); filter: blur(10px); } 7% { opacity: 1; transform: scale(1); filter: none; } 84% { opacity: 1; } 100% { opacity: 0; } }
.big b.pop { animation: pop .5s cubic-bezier(.2,1.6,.4,1); } @keyframes pop { 0% { transform: scale(1.5); filter: brightness(2); } }
.toast2 { position: absolute; left: 50%; top: 31%; translate: -50% 0; z-index: 24; display: flex; align-items: center; gap: 12px; font: 600 14px var(--sans); letter-spacing: .08em; white-space: nowrap; opacity: 0; pointer-events: none; text-shadow: var(--ts); }
.toast2::before, .toast2::after { content: ""; width: 70px; height: 1px; background: linear-gradient(90deg, transparent, #fff); } .toast2::after { transform: scaleX(-1); }
.toast2 em { font-style: normal; color: var(--gold2); font-weight: 700; }
.toast2.on { animation: t2 2.4s ease-out forwards; } @keyframes t2 { 0% { opacity: 0; letter-spacing: .5em; filter: blur(6px); } 12%, 78% { opacity: 1; letter-spacing: .08em; filter: none; } 100% { opacity: 0; } }
.sealfx { position: absolute; left: 50%; top: 46%; translate: -50% -50%; z-index: 27; width: min(30vmin, 120px); aspect-ratio: 292 / 272; pointer-events: none; }
.sealfx img { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .09s; filter: invert(1) drop-shadow(0 0 6px rgba(255,255,255,.7)) drop-shadow(0 0 18px rgba(230,195,122,.5)); } .sealfx img.on { opacity: 1; }
.ink { position: absolute; left: 50%; top: 50%; width: 70vmin; aspect-ratio: 746 / 686; translate: -50% -50%; z-index: 21; pointer-events: none; opacity: 0; filter: brightness(0) invert(1) drop-shadow(0 0 6px rgba(255,255,255,.9)); }
.ink.on { animation: ink .9s cubic-bezier(.2,.8,.2,1) forwards; } .ink.huge { width: 140vmax; }
@keyframes ink { 0% { opacity: 1; transform: scale(.3) rotate(var(--r, 0deg)); } 60% { opacity: .9; } 100% { opacity: 0; transform: scale(1.5) rotate(var(--r, 0deg)); } }

/* 버프 컷인: 사선 띠가 화면을 가르고 지나가요 */
.cut { position: absolute; inset: 0; z-index: 28; pointer-events: none; opacity: 0; overflow: hidden; }
.cut.on { animation: cutA 2.8s linear forwards; } @keyframes cutA { 0%, 100% { opacity: 0; } 4%, 90% { opacity: 1; } }
.cut .s { position: absolute; left: -20%; right: -20%; transform: skewY(-9deg) translateX(-110%); }
.cut.on .s { animation: cutS 2.8s cubic-bezier(.16,.9,.2,1) forwards; } @keyframes cutS { 0% { transform: skewY(-9deg) translateX(-110%); } 16%, 82% { transform: skewY(-9deg) translateX(0); } 100% { transform: skewY(-9deg) translateX(110%); } }
.cut .s1 { top: 30%; height: 230px; background: linear-gradient(90deg, rgba(8,10,24,.2), rgba(8,10,24,.95) 25%, rgba(20,26,70,.95) 75%, rgba(8,10,24,.2)); border-top: 2px solid #fff; border-bottom: 2px solid var(--gold); box-shadow: 0 0 60px rgba(74,98,224,.6); }
.cut .s2 { top: calc(30% - 22px); height: 8px; background: repeating-linear-gradient(-45deg, var(--gold) 0 8px, transparent 8px 18px); animation-delay: .06s !important; }
.cut .s3 { top: calc(30% + 246px); height: 3px; background: #fff; animation-delay: .1s !important; box-shadow: 0 0 20px #fff; }
.cut .in { position: absolute; left: 0; right: 0; top: calc(30% + 40px); padding: 0 9vw; transform: skewY(-9deg); display: flex; align-items: center; gap: 22px; opacity: 0; }
.cut.on .in { animation: cutT 2.8s cubic-bezier(.16,.9,.2,1) forwards; } @keyframes cutT { 0%, 10% { opacity: 0; translate: -60px 0; filter: blur(8px); } 22%, 80% { opacity: 1; translate: 0 0; filter: none; } 100% { opacity: 0; translate: 80px 0; } }
.cut .sym { flex: none; width: 96px; height: 96px; display: grid; place-items: center; font-size: 44px; color: #fff; border: 1px solid #fff; transform: rotate(45deg); box-shadow: 0 0 30px rgba(255,255,255,.6), inset 0 0 30px rgba(230,195,122,.4); } .cut .sym span { transform: rotate(-45deg); text-shadow: 0 0 16px #fff; }
.cut .ttl { display: inline-block; font: 700 10px var(--mono); letter-spacing: .4em; color: #111; background: linear-gradient(90deg, var(--gold), var(--gold2)); padding: 3px 12px; clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
.cut .nm { font: italic 700 clamp(30px, 5.4vw, 64px)/1.15 var(--serif); letter-spacing: .08em; color: #fff; text-shadow: -3px 0 rgba(230,195,122,.7), 3px 0 rgba(74,98,224,.7), 0 0 26px rgba(255,255,255,.6); }
.cut .tx { font: 500 clamp(13px, 1.5vw, 17px) var(--sans); color: rgba(255,255,255,.9); letter-spacing: .06em; }

/* 원념의 메시지 */
.msgs { position: absolute; left: 22px; top: 132px; z-index: 23; width: min(320px, 44vw); display: grid; gap: 8px; pointer-events: none; }
.msg { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 14px; background: rgba(18,18,32,.72); border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(12px);
  box-shadow: 0 10px 28px -12px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.08); animation: msgIn .45s cubic-bezier(.2,1.2,.3,1), msgFlick 4s steps(1) infinite; }
.msg.out { animation: msgOut .45s ease-in forwards; }
@keyframes msgIn { from { opacity: 0; transform: translateY(-14px) scale(.96); filter: blur(4px); } }
@keyframes msgOut { to { opacity: 0; transform: translateX(-20px); filter: blur(4px); } }
@keyframes msgFlick { 0%, 100% { opacity: 1; } 31% { opacity: .35; transform: translateX(3px); } 32% { opacity: 1; transform: none; } 67% { opacity: .6; } 68% { opacity: 1; } }
.msg .mi { flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 14px; color: #fff; background: linear-gradient(160deg, rgba(255,255,255,.22), rgba(255,255,255,.05)); border: 1px solid rgba(255,255,255,.18); }
.msg .mb { flex: 1; min-width: 0; } .msg .mh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.msg .mh b, .msg p { position: relative; } .msg .mh b { font: 700 12px var(--sans); color: #fff; letter-spacing: .04em; } .msg .mh time { font: 500 10px var(--sans); color: var(--sub); }
.msg p { margin: 3px 0 0; font: 500 13px/1.5 var(--sans); color: rgba(255,255,255,.9); word-break: keep-all; }
.msg p::before, .msg p::after, .msg .mh b::before, .msg .mh b::after { content: attr(data-t); position: absolute; left: 0; top: 0; pointer-events: none; }
.msg p::before, .msg .mh b::before { color: #e6c37a; transform: translateX(-2px); clip-path: inset(0 0 60% 0); animation: wsA .34s steps(2) infinite; opacity: .8; }
.msg p::after, .msg .mh b::after { color: #6b80ff; transform: translateX(2px); clip-path: inset(55% 0 0 0); animation: wsB .46s steps(2) infinite; opacity: .8; }
@keyframes wsA { 50% { transform: translateX(4px); clip-path: inset(30% 0 40% 0); } } @keyframes wsB { 50% { transform: translateX(-5px); clip-path: inset(10% 0 70% 0); } }
.msg.hard { border-color: rgba(255,255,255,.4); animation: msgIn .45s cubic-bezier(.2,1.2,.3,1), wsShake .1s steps(2) infinite; }
.msg.hard p { font-size: 15px; letter-spacing: .1em; } .msg.hard p::before { transform: translateX(-5px); } .msg.hard p::after { transform: translateX(5px); }
@keyframes wsShake { 50% { transform: translate(2px, -1px) skewX(-8deg); } }

/* 대기 · 정산 */
.wait { position: absolute; left: 50%; bottom: 292px; translate: -50% 0; z-index: 9; text-align: center; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
.wait.on { opacity: 1; } .wait b { display: block; font: 700 11px var(--mono); letter-spacing: .4em; color: #fff; text-shadow: var(--ts); } .wait b::after { content: ""; animation: dots 1.4s steps(4) infinite; } @keyframes dots { 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
.settle { position: absolute; inset: 0; z-index: 26; display: grid; place-items: center; pointer-events: none; opacity: 0; background: radial-gradient(circle, rgba(6,6,16,.3), rgba(6,6,16,.8)); transition: opacity .25s; }
.settle.on { opacity: 1; } .settle small { display: block; font: 700 11px var(--mono); letter-spacing: .6em; text-indent: .6em; color: var(--gold); text-align: center; }
.settle b { display: block; margin-top: 6px; font: 700 clamp(22px, 3.4vw, 40px) var(--serif); letter-spacing: .24em; text-indent: .24em; color: #fff; text-shadow: 0 0 22px rgba(255,255,255,.7); }
.settle.on b { animation: stl .6s cubic-bezier(.2,.8,.2,1); } @keyframes stl { from { letter-spacing: .8em; opacity: 0; filter: blur(8px); } }

/* 안내 (사리) */
.tut { position: absolute; inset: 0; z-index: 40; display: none; } .tut.on { display: block; }
.tut .hole { position: absolute; box-shadow: 0 0 0 200vmax rgba(4,4,12,.8); transition: all .55s cubic-bezier(.2,.8,.2,1); pointer-events: none; }
.tut .hole::before { content: ""; position: absolute; inset: -6px; border: 1px solid #fff; box-shadow: 0 0 20px rgba(255,255,255,.5); animation: holeP 1.6s ease-in-out infinite; } @keyframes holeP { 50% { inset: -10px; opacity: .7; } }
.tut .hole.none { left: 50% !important; top: 50% !important; width: 0 !important; height: 0 !important; } .tut .hole.none::before { display: none; }
.dlg { position: absolute; left: 50%; bottom: 40px; translate: -50% 0; width: min(760px, 92vw); display: flex; align-items: flex-end; }
.dlg .npc { width: 120px; height: 120px; flex: none; margin-right: -18px; position: relative; z-index: 1; image-rendering: pixelated; filter: drop-shadow(0 6px 16px rgba(0,0,0,.7)); }
.dlg .box { flex: 1; position: relative; min-height: 110px; padding: 20px 22px 14px 32px; background: linear-gradient(180deg, rgba(14,16,36,.88), rgba(10,12,28,.8)); border: 1px solid rgba(255,255,255,.35); backdrop-filter: blur(10px); box-shadow: inset 0 0 40px rgba(74,98,224,.14); }
.dlg .box::before, .dlg .box::after { content: "✦"; position: absolute; font-size: 9px; color: #fff; top: 5px; } .dlg .box::before { right: 8px; } .dlg .box::after { right: 22px; opacity: .5; }
.dlg .box .nmt { position: absolute; left: 28px; top: -11px; padding: 2px 16px; font: 700 11px var(--mono); letter-spacing: .3em; color: #111; background: linear-gradient(90deg, var(--gold), var(--gold2)); clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
.dlg .box p { margin: 4px 0 0; font: 500 15px/1.75 var(--sans); min-height: 52px; } .dlg .box p em { font-style: normal; color: var(--gold2); font-weight: 700; }
.dlg .ctl2 { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; } .dlg .ctl2 small { font: 600 10px var(--mono); letter-spacing: .3em; color: var(--sub); }
.dlg .skip { background: none; border: 0; color: var(--sub); font: 600 12px var(--sans); cursor: pointer; }
.dlg .nx { padding: 8px 26px; border: 0; cursor: pointer; font: 700 12px var(--sans); letter-spacing: .1em; color: #14131f; background: #fff; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
.topbtn { position: absolute; top: 14px; z-index: 9; padding: 3px 10px; font: 700 9px var(--mono); letter-spacing: .2em; color: var(--sub); background: none; border: 1px solid rgba(255,255,255,.25); cursor: pointer; }
.topbtn:hover { color: #fff; border-color: #fff; }

/* ═══ 덜어내기: 후광 · 번쩍임 · 과한 장식 없애기 ═══ */
.rays, .big::before, .cyl::before, .cb.rl, .deco.tl i { display: none; }
.boss.turn .b0 { filter: none; }
.plate h1 { text-shadow: var(--ts); letter-spacing: .3em; }
.pot { font-style: normal; font-weight: 600; text-shadow: -1px 0 rgba(230,195,122,.6), 1px 0 rgba(74,98,224,.6), 0 2px 12px rgba(0,0,0,.6); }
.gauge i { box-shadow: none; background: #fff; } .gauge i::after { box-shadow: none; }
.warn { filter: none; }
.party .hd b { font-size: 12px; letter-spacing: .5em; } .party .hd b::first-letter { font-size: 12px; }
.party .hd em { font-size: 34px; top: 2px; text-shadow: var(--ts); font-weight: 400; }
.mem .no { box-shadow: none; } .mem.cur .no { box-shadow: none; }
.mem .pic { opacity: .32; filter: saturate(.45); } .mem.cur .pic { opacity: .7; filter: saturate(.6); box-shadow: none; }

function glitchLoop(id) {
  const el = $('#' + id), cfg = () => FX[id];
  // 한 번의 글리치 = 2~4번 짧게 끊어 치는 박자 (탁 · 타닥 · 쉬고)
  const hit = (kinds, k, dur) => new Promise(done => { const jit = kinds.map(n => KINDS[n](el, k)).filter(Boolean);

(() => { const cv = $('#dust'), g = cv.getContext('2d'); let W, H; const fit = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; }; fit(); addEventListener('resize', fit);

  const glow = (() => { const c = document.createElement('canvas'); c.width = c.height = 32; const x = c.getContext('2d'), r = x.createRadialGradient(16, 16, 0, 16, 16, 16); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.25, 'rgba(255,255,255,.55)'); r.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = r; x.fillRect(0, 0, 32, 32); return c; })();

const sparks = (x, y, n, far) => { const f = $('#fx'); for (let i = 0; i < n; i++) { const s = document.createElement('i'), a = R(0, 6.28), d = R(far * .35, far); s.className = 'spk'; s.style.cssText = `left:${x}px;top:${y}px;--dx:${(Math.cos(a) * d).toFixed(0)}px;--dy:${(Math.sin(a) * d).toFixed(0)}px;--d:${R(.5, 1.1).toFixed(2)}s`; f.appendChild(s); setTimeout(() => s.remove(), 1200); }

    else if (ev.kind === 'ward') { S = Object.assign({}, S, { ward: s.ward }); drawParty(); const r = $('#party').getBoundingClientRect(); sparks(r.left + r.width / 2, r.top + r.height / 2, 30, 220); toast2(`<em>${who}</em> 이 파티에 결계를 쳤어요 · 다음 피해를 한 번 막아요`); }
  } else if (ev.k === 'pause') { toast2(s.paused ? '잠시 멈췄어요' : '다시 시작해요'); }
}
function cutin(ttl, sym, nm, tx) { drawer('', false); const c = $('#cut');
  const kind = /STEAL/.test(ttl) ? 'steal' : /LOCK/.test(ttl) ? 'fix' : 'ward', far = Math.min(innerWidth, innerHeight) * .5;
  const pcs = Array.from({ length: 22 }, (_, i) => { const a = R(0, 6.28), d = R(far * .35, far); return `<u class="pc ${i % 3 === 0 ? 'g' : i % 3 === 1 ? 'o' : ''}" style="--x:${(Math.cos(a) * d * 1.5).toFixed(0)}px;--y:${(Math.sin(a) * d * .8).toFixed(0)}px;--s:${R(3, 9).toFixed(0)}px;--d:${R(1.1, 1.9).toFixed(2)}s;--w:${R(.35, .8).toFixed(2)}s"></u>`; }).join('');
  c.className = 'cut k-' + kind;
  c.innerHTML = `<div class="ct"><div class="em"><i class="d4"></i><i class="d5"></i><i class="d2"></i><i class="d1"></i><i class="d3"></i><b>${sym}</b></div><div class="ln l"></div><div class="ln r"></div>${pcs}<small>${ttl.replace('BUFF // ', '')}</small><strong>${nm}</strong><span>${tx}</span></div>`; replay(c, 'on'); }

/* 관리자 버튼: 서버 함수 1번 → 받은 결과를 같은 방 사람들에게 그대로 보내고 내 화면에도 보여 줘요 */
async function act(fn, args) {
  if (pending || !(ADMIN || (fn === 'roll' && myTurn()))) return;
  if (DEMO) return demoAct(fn, args);
  pending = true; render();
  try { const s = await Store.diceAct(fn, args); if (sub) sub.send(s); apply(s); }
  catch (e) { toast2(esc(e.message || '잘 안 됐어요')); }
  finally { pending = false; render(); }
}
$('#dicebox').onclick = () => { if (canRoll()) act('roll'); };
$('#aSettle').onclick = () => act('settle');
$('#aPause').onclick = () => act('pause', { p_pause: !S.paused });
$('#aOpen').onclick = () => act('open', { p_open: !S.open });
$('#aReset').onclick = () => { if (confirm('처음부터 다시 시작할까요?\n게시된 캐릭터를 다시 섞고 · 받은 피해 기록이 전부 0이 돼요.')) act('reset'); };
$('#aStart').onclick = () => S.order && S.order.length ? act('open', { p_open: true }) : act('reset');
const bArgs = kind => ({ p_kind: kind, p_name: ($('#bName').value || '').trim(), p_text: ($('#bText').value || '').trim(), p_num: Math.round(+$('#bNum').value || 0) || null });
$('#bSteal').onclick = () => act('buff', bArgs('steal'));
$('#bFix').onclick = () => act('buff', bArgs('fix'));
$('#bWard').onclick = () => act('buff', bArgs('ward'));

/* ───────── 데모 전투 (관리자 화면에서만 · 서버 기록 없음 · 다른 사람 화면에는 안 보여요) ─────────
   게시된 캐릭터 중 아무나 불러와서 2판 해 보고 끝나면 진짜 화면으로 돌아와요 · 숫자는 연습용으로 아무렇게나 만들어요 */
let DEMO = null, realS = null;
async function demoStart() {
  if (!ADMIN || DEMO || busy || pending) return;
  let rows = []; try { rows = await Store.charCards(); } catch (e) {}
  const pool = (rows || []).filter(c => c && c.data && c.data.name && c.published_at !== null).map(c => ({ id: 'demo:' + c.id, n: String(c.data.name), h: c.data.head || '', c: c.data.color || '', st: String(c.data.stats || '') })).sort(() => Math.random() - .5);
  if (!pool.length) return toast2('게시된 캐릭터가 없어서 데모를 못 해요');
  realS = S; drawer('', false);
  DEMO = { open: true, seq: 0, paused: false, deck: 0, pool, pot: 0, scores: {}, ward: null, ev: { k: 'reset' } }; demoDeck();
  document.body.classList.add('demo'); queue = []; S = { seq: -1, open: false, order: [], step: 0, phase: 'roll', pot: 0, scores: {} };
  apply(demoOut()); toast2('<em>데모 전투</em> · 2판 해 보고 원래 화면으로 돌아가요');
}
function demoEnd() {
  if (!DEMO) return; DEMO = null; document.body.classList.remove('demo'); queue = [];
  const back = realS; realS = null; S = { seq: -1, open: false, order: [], step: 0, phase: 'roll', pot: 0, scores: {} }; tutDone = true;
  apply(back || { seq: 0, open: false }); toast2('데모가 끝났어요');
}
const demoOut = () => { const o = JSON.parse(JSON.stringify(DEMO)); delete o.pool; o.now = new Date().toISOString(); return o; };
function demoDeck() { const d = DEMO, o = []; for (let i = 0; i < Math.min(4, d.pool.length); i++) o.push(d.pool[(d.deck * 4 + i) % d.pool.length]); o.push({ n: '원념', boss: true }); Object.assign(d, { order: o, step: 0, phase: 'roll', turn_at: new Date().toISOString(), fixed: null }); }
function demoAct(fn, a) {
  a = a || {}; const d = DEMO, r = n => 1 + Math.floor(Math.random() * n), bump = ev => { d.seq++; d.ev = ev; };
  const adv = () => { if (d.step >= d.order.length - 1) d.phase = 'settle'; else { d.step++; d.turn_at = new Date().toISOString(); } };
  if (fn === 'open' || fn === 'reset') return demoEnd();
  if (fn === 'pause') { d.paused = !!a.p_pause; d.turn_at = new Date().toISOString(); bump({ k: 'pause' }); }
  else if (fn === 'roll') { if (d.paused || d.phase !== 'roll') return;
    const cur = d.order[d.step], boss = !!cur.boss, fx = d.fixed; let x = fx ? fx.n : r(20), y = 0, val, stat = null;
    if (boss) { y = r(20); val = x + y; } else { val = x;
      if (Math.random() < .4) { const k = ['술력', '이성', '지력', '외모', '행운', '근력'][r(6) - 1], m = (cur.st || '').match(new RegExp(k + '\\s*[:：=]?\\s*(-?[0-9.]+)')), v = Math.max(0, Math.min(30, Math.round(m ? +m[1] : r(8)))); if (v > 0) { stat = { k, v }; val += v; } } }
    const dmg = Math.min(99999999 - d.pot, Math.round(val * R(300000, 900000)));
    d.pot += dmg; d.fixed = null; bump({ k: 'roll', step: d.step, n: cur.n, boss, a: x, b: y, stat, fixed: !!fx, dmg }); adv(); }
  else if (fn === 'skip') { if (d.phase === 'roll' && !d.paused) { bump({ k: 'skip', n: d.order[d.step].n }); adv(); } }
  else if (fn === 'settle') { if (d.phase !== 'settle') return;
    const pick = Math.floor(Math.random() * 6), pot = d.pot, by = d.ward && d.ward.who, tg = pick < 4 ? d.order[pick] : pick === 4 ? { n: '원념', boss: true } : null; let blocked = false;
    if (tg) { const key = tg.boss ? 'boss' : tg.id; if (d.ward && !tg.boss) { blocked = true; d.ward = null; } else d.scores[key] = (d.scores[key] || 0) + pot; d.pot = 0; }
    d.deck++; bump({ k: 'settle', pick, n: tg ? tg.n : null, amount: pot, blocked, ward_by: by || null }); demoDeck();
    if (d.deck >= 2) { apply(demoOut()); const t = setInterval(() => { if (!busy && !queue.length) { clearInterval(t); setTimeout(demoEnd, 1200); } }, 300); return; } }
  else if (fn === 'buff') { const nm = (String(a.p_name || '').trim() || '이름 없는 능력자').slice(0, 14); let bi = -1;
    if (a.p_kind === 'steal') { for (let i = d.step; i < d.order.length; i++) if (d.order[i].boss) { bi = i; break; } if (bi < 0) return toast2('빼앗을 원념 차례가 없어요'); d.order[bi] = { n: nm, stolen: true }; }
    else if (a.p_kind === 'fix') { if (!(a.p_num >= 1 && a.p_num <= 20)) return toast2('1 ~ 20 사이 숫자를 넣어 주세요'); d.fixed = { n: a.p_num, who: nm }; }
    else d.ward = { who: nm };
    bump({ k: 'buff', kind: a.p_kind, who: nm, text: String(a.p_text || '').slice(0, 40), num: a.p_num, bi }); }
  apply(demoOut());
}
$('#aDemo').onclick = () => DEMO ? demoEnd() : demoStart();
$('#aDemo2').onclick = demoStart;

/* ───────── 사리 안내 (처음 한 번만 · 오른쪽 위 GUIDE 로 다시 볼 수 있어요) ───────── */
const STEPS = [
  { at: null, say: '어서 와요 여기는 마지막 에피소드 전투, <em>다이스 룰렛</em>이에요<br>제가 하나씩 짚어 드릴게요냥!' },
  { at: '#plate', say: '저 거대한 존재는 민간인이 망량이 되어 만들어진 <em>원념</em>이에요<br>이 원념과는 다이스를 굴려 공격할 수 있어요' },
  { at: '#party', say: '오른쪽은 각 라운드마다 랜덤으로 정해지는 <em>파티</em>예요<br><em>1 → 2 → 3 → 4 → 원념</em> 순서로 한 번씩 굴리고 · 턴이 끝나면 다음 네 명으로 바뀌어요' },
  { at: '#stage', say: '굴린 숫자는 스탯을 조합하여 <em>대미지</em>로 환산됩니다냥!<br>가끔은 굴리는 사람의 <em>스탯</em>이 다이스에 더해져요' },
  { at: null, say: '다이스는 진행하는 사람이 굴려요<br>그러면 무운을 빌게요! 힘내라냥!' },
];
let si = 0, typing = null;
function place() {
  const s = STEPS[si], hole = $('#hole'), sr = $('#scr').getBoundingClientRect(), el = s.at && $(s.at);
  if (!el || getComputedStyle(el).display === 'none') hole.classList.add('none');
  else { hole.classList.remove('none'); const r = el.getBoundingClientRect(), p = 12; Object.assign(hole.style, { left: Math.max(6, r.left - sr.left - p) + 'px', top: Math.max(6, r.top - sr.top - p) + 'px', width: Math.min(sr.width - 12, r.width + p * 2) + 'px', height: Math.min(sr.height - 12, r.height + p * 2) + 'px' }); }
  $('#stepn').textContent = `${si + 1} / ${STEPS.length}`; $('#nx').textContent = si === STEPS.length - 1 ? '닫기' : '다음';
  clearInterval(typing); const html = s.say, out = $('#say'); let i = 0; out.innerHTML = '';
  typing = setInterval(() => { i++; if (html[i - 1] === '<') i = html.indexOf('>', i) + 1; out.innerHTML = html.slice(0, i); if (i >= html.length) clearInterval(typing); }, 22);
}
function tutOpen() { si = 0; $('#tut').classList.add('on'); place(); }
function tutClose() { $('#tut').classList.remove('on'); clearInterval(typing); try { localStorage.setItem('dice:tut', '1'); } catch (e) {} }
$('#nx').onclick = () => { if (si < STEPS.length - 1) { si++; place(); } else tutClose(); };
$('#skip').onclick = tutClose;
$('#help').onclick = tutOpen;
addEventListener('resize', () => { if ($('#tut').classList.contains('on')) place(); });

/* ───────── 시작: 로그인 확인 → 지금 상태 1번 읽기 → 신호 받기 ───────── */
drawCyl();
App.ready.then(async user => {
  if (!user) return;
  ADMIN = user.grade === 'admin'; document.body.classList.toggle('admin', ADMIN);
  // 내 캐릭터 목록 (이름 목록 · 5분 기억해 둔 걸 써요) → 내 차례인지 알아봐요
  try { MINE = new Set((await Store.charNames()).filter(c => c.owner_id === user.id).map(c => c.id)); } catch (e) {}
  try { apply(await Store.diceView()); } catch (e) { $('#boot').textContent = e.message || '불러오지 못했어요'; return; }
  sub = Store.diceSub(s => { if (DEMO) { if (!realS || s.seq > realS.seq) realS = s; } else apply(s); });   // 데모 중에 온 진짜 결과는 따로 모아 뒀다가 데모가 끝나면 맞춰요
  $('#boot').classList.add('off');
  // 다른 탭에 오래 있다 돌아오면 그 사이 놓친 걸 1번만 다시 읽어요
  document.addEventListener('visibilitychange', async () => {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (hiddenAt && Date.now() - hiddenAt > 20000) { hiddenAt = 0; try { apply(await Store.diceView()); } catch (e) {} }
  });
});
