<!doctype html>
<html lang="ko" class="gate">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; media-src 'self' https: blob:; connect-src 'self' https: wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>말장난 — 三娑罗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#05070c;color:#fff;font:13px/1.45 'IBM Plex Sans KR',sans-serif}
.mp *{box-sizing:border-box}
.mp button{font:inherit;cursor:pointer}
.mp input,.mp select,.mp textarea{font:inherit}

/* 무대 */
.mp-stage{position:fixed;inset:0;background:#05070c center/cover no-repeat;transition:filter .35s}
.mp-stage.mp-fade{filter:brightness(0)}
.mp-floor{position:absolute;left:0;right:0;top:68%;bottom:4%;cursor:pointer}
.mp-ch{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.mp-ch img{display:block;height:var(--h,140px);width:calc(var(--h,140px)*.8);object-fit:contain;object-position:50% 100%;image-rendering:pixelated;filter:drop-shadow(0 3px 2px rgba(0,0,0,.6));pointer-events:auto;cursor:pointer}
.mp-ch.mp-left img{transform:scaleX(-1)}
.mp-ch.mp-walk img{animation:mp-step .32s steps(2) infinite}
@keyframes mp-step{50%{translate:0 -3px}}
.mp-tag{margin-top:2px;padding:0 5px;font-size:11px;line-height:16px;background:rgba(0,0,0,.72);border-radius:3px;white-space:nowrap;color:#fff}
.mp-ch.mp-me .mp-tag{background:rgba(30,60,120,.85)}
.mp-ch.mp-pt .mp-tag{color:#ffcf7a}
.mp-bub{position:absolute;bottom:calc(100% + 2px);left:50%;translate:-50% 0;max-width:190px;width:max-content;padding:5px 9px;background:#fff;color:#111;border:1.5px solid #333;border-radius:7px;font-size:12px;line-height:1.4;word-break:break-all;animation:mp-pop .15s ease-out}
.mp-bub::after{content:"";position:absolute;left:50%;top:100%;translate:-50% 0;border:6px solid transparent;border-top-color:#333}
.mp-bub::before{content:"";position:absolute;left:50%;top:100%;translate:-50% -2px;border:5px solid transparent;border-top-color:#fff;z-index:1}
@keyframes mp-pop{from{scale:.6;opacity:0}}
.mp-px{position:absolute;z-index:999;image-rendering:pixelated;filter:drop-shadow(0 0 3px var(--glow)) drop-shadow(0 0 9px var(--glow)) drop-shadow(0 0 16px var(--glow));pointer-events:none;translate:-50% -50%;animation:mp-burst 1.1s cubic-bezier(.2,.7,.3,1) both}
.mp-sx{position:absolute;z-index:999;image-rendering:pixelated;pointer-events:none;translate:-50% -50%;filter:drop-shadow(0 0 3px var(--glow)) drop-shadow(0 0 8px var(--glow)) drop-shadow(0 0 14px var(--glow));animation:mp-star 1s ease-out both}
@keyframes mp-star{0%{transform:translate(0,6px) scale(.4) rotate(0);opacity:0}25%{opacity:1}100%{transform:translate(var(--sd),-34px) scale(1) rotate(90deg);opacity:0}}
@keyframes mp-burst{0%{transform:translate(0,0) scale(.3);opacity:1}70%{opacity:1}100%{transform:translate(var(--bx),var(--by)) scale(1);opacity:0}}

/* 위 */
.mp-hud{position:fixed;top:10px;left:50%;translate:-50% 0;display:flex;gap:6px;z-index:5}
.mp-hud span{font:600 12px 'JetBrains Mono',monospace;padding:4px 10px;border-radius:4px;background:linear-gradient(180deg,rgba(40,52,78,.92),rgba(20,26,40,.92));border:1px solid rgba(255,255,255,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.15);white-space:nowrap}
.mp-hud b{color:#ffd85e}
.mp-hud .mp-warn{background:linear-gradient(180deg,#7a2323,#4a1212)}
.mp-where{position:fixed;top:10px;left:10px;z-index:5;padding:6px 12px 6px 10px;border-radius:4px;background:rgba(10,14,22,.78);border:1px solid rgba(255,255,255,.2)}
.mp-where a{display:block;font-size:10px;color:#9fb0cc;text-decoration:none}
.mp-where a:hover{color:#fff}
.mp-where b{font-size:15px}
.mp-map{position:fixed;top:10px;right:10px;z-index:5;width:150px;border-radius:5px;overflow:hidden;background:rgba(10,14,22,.82);border:1px solid rgba(255,255,255,.22)}
.mp-map h4{margin:0;padding:4px 8px;font-size:11px;background:linear-gradient(180deg,#3b4a6b,#26304a);letter-spacing:.06em;color:#fff}
.mp-map button{display:flex;justify-content:space-between;width:100%;background:none;border:0;border-top:1px solid rgba(255,255,255,.06);color:#d6deec;padding:5px 9px;text-align:left}
.mp-map button:hover{background:rgba(255,255,255,.07)}
.mp-map button.mp-here{color:#ffd85e;font-weight:700}
.mp-map button span{font:500 11px 'JetBrains Mono',monospace;color:#8b98b0}

/* 대화창 */
.mp-chat{position:fixed;left:10px;bottom:10px;z-index:6;width:min(400px,calc(100vw - 20px));border-radius:5px;background:rgba(8,11,18,.72);border:1px solid rgba(255,255,255,.22);box-shadow:0 6px 20px rgba(0,0,0,.4)}
.mp-tabs{display:flex;gap:2px;padding:4px 4px 0}
.mp-tabs button{border:1px solid rgba(255,255,255,.18);border-bottom:0;border-radius:4px 4px 0 0;background:rgba(40,48,66,.8);color:#aab5c9;font-size:11.5px;padding:2px 10px}
.mp-tabs button.mp-on{background:linear-gradient(180deg,#5d77ad,#3b4f7a);color:#fff}
.mp-log{height:150px;overflow-y:auto;padding:5px 8px;border-top:1px solid rgba(255,255,255,.18);font-size:12.5px;text-shadow:0 1px 1px #000;color:#fff}
.mp-ln{padding:1px 0;word-break:break-all}
.mp-ln.mp-sys{color:#ffe68a}
.mp-ln.mp-w{color:#7dff9a}
.mp-ln.mp-p{color:#ffb54d}
.mp-ln.mp-t{color:#8fd8ff}
.mp-inrow{display:flex;gap:3px;padding:4px;border-top:1px solid rgba(255,255,255,.12)}
.mp-inrow select{background:linear-gradient(180deg,#4a5d88,#33426a);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:3px;font-size:12px;padding:0 4px}
.mp-inrow input{flex:1;min-width:0;background:#fff;color:#111;border:1px solid #8892a6;border-radius:3px;padding:4px 7px;font-size:12.5px}
.mp-inrow button{background:linear-gradient(180deg,#ffd45e,#e7a21c);color:#3b2600;border:1px solid #a86e00;border-radius:3px;font-weight:700;font-size:12px;padding:0 10px}

/* 오른쪽 아래 */
.mp-quick{position:fixed;right:10px;bottom:10px;z-index:6;display:flex;gap:5px}
.mp-quick button{width:58px;padding:6px 0 5px;border-radius:5px;background:linear-gradient(180deg,rgba(60,74,106,.95),rgba(30,38,58,.95));border:1px solid rgba(255,255,255,.28);color:#fff;font-size:11.5px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.mp-quick button:disabled{opacity:.45;cursor:not-allowed}
.mp-quick button[hidden]{display:none}
.mp-quick b{display:block;font-size:17px;line-height:1.1}
.mp-quick .mp-startb{background:linear-gradient(180deg,#ffd45e,#e7a21c);color:#3b2600;border-color:#a86e00;font-weight:700}

/* 창 */
.mp-dim{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.4)}
.mp-dim[hidden]{display:none}
.mp-win{width:min(360px,100%);max-height:calc(100vh - 32px);overflow:auto;border-radius:6px;background:#eef1f6;color:#1d2433;border:1px solid #2b3550;box-shadow:0 14px 40px rgba(0,0,0,.6)}
.mp-win header{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;background:linear-gradient(180deg,#5d77ad,#34466e);color:#fff;font-weight:700;font-size:12.5px;position:sticky;top:0}
.mp-win header button{background:none;border:0;color:#fff;font-size:14px}
.mp-wb{padding:12px}
.mp-wb p{margin:0 0 8px}
.mp-wb label{display:block;font-size:11px;color:#5a6680;margin:8px 0 3px}
.mp-wb input,.mp-wb select,.mp-wb textarea{width:100%;border:1px solid #9aa6bd;border-radius:3px;padding:5px 7px;background:#fff;color:#111;font-size:12.5px}
.mp-wb textarea{height:56px;resize:none}
.mp-btns{display:flex;justify-content:flex-end;gap:5px;padding:0 12px 12px}
.mp-btns button{padding:5px 14px;border-radius:3px;border:1px solid #6b7894;background:linear-gradient(180deg,#fff,#dde3ee);font-weight:700;font-size:12px;color:#1d2433}
.mp-btns .mp-go{background:linear-gradient(180deg,#ffd45e,#e7a21c);border-color:#a86e00;color:#3b2600}
.mp-btns button:disabled{opacity:.5}
.mp-note{font-size:11px;color:#a33;margin-top:6px;min-height:1em}
.mp-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mp-seal{border:1px dashed #9aa6bd;border-radius:3px;padding:8px;font-size:12.5px;background:#f6f8fb;color:#333}
.mp-clue{padding:6px 8px;margin-top:5px;border-radius:3px;background:#fff;border-left:3px solid #5d77ad;font-size:12.5px}
.mp-clue.mp-bought{border-left-color:#e7a21c}
.mp-clue small{display:block;font-size:10.5px;color:#7a869c}
.mp-empty{font-size:12px;color:#7a869c}

/* 경주판 (귀엽게) */
.mp-race{width:min(780px,100%);border-radius:14px;border:3px solid #fff;box-shadow:0 0 0 2px #7cc4ef,0 18px 40px rgba(0,0,0,.5);background:#f3fbff}
.mp-race header{background:linear-gradient(180deg,#9fdcff,#6fbdf0);font-size:14px;padding:7px 12px;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.mp-track{position:relative;border-radius:12px;overflow:hidden;background:#8fd77f;border:3px solid #6cbf5e;padding:6px 0;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.mp-lane{position:relative;height:50px}
.mp-lane:nth-child(odd){background:#9ee08e}
.mp-lane:nth-child(even){background:#8fd77f}
.mp-lane::after{content:"";position:absolute;left:34px;right:0;bottom:0;border-bottom:2px dashed rgba(255,255,255,.7)}
.mp-lane:last-child::after{display:none}
.mp-lane .mp-no{position:absolute;left:6px;top:50%;translate:0 -50%;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:800 12px 'JetBrains Mono',monospace;color:#fff;background:var(--lc);border:2px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.15);z-index:2}
.mp-start{position:absolute;top:0;bottom:0;left:34px;width:6px;background:#fff;opacity:.8;z-index:1}
.mp-goal{position:absolute;top:0;bottom:0;right:26px;width:12px;background:repeating-conic-gradient(#fff 0 25%,#3a3a3a 0 50%) 0 0/12px 12px;z-index:1;box-shadow:0 0 0 2px #fff}
.mp-goaltag{position:absolute;top:2px;right:8px;z-index:3;font:800 10px 'JetBrains Mono',monospace;color:#fff;background:#ff8a3d;border:2px solid #fff;border-radius:99px;padding:1px 7px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.mp-hz{position:absolute;top:50%;left:calc(122px + (100% - 122px - 78px) * var(--d) / 100);translate:0 -58%;transition:left 4s cubic-bezier(.35,.1,.25,1);z-index:2}
.mp-lab{position:absolute;right:calc(100% + 2px);top:50%;translate:0 -40%;display:flex;align-items:center;gap:3px;flex-direction:row-reverse}
.mp-hz img{height:44px;width:36px;object-fit:contain;object-position:50% 100%;image-rendering:pixelated;filter:drop-shadow(0 2px 0 rgba(0,0,0,.18))}
.mp-hz.mp-run img{animation:mp-hop .3s ease-in-out infinite}
@keyframes mp-hop{0%,100%{translate:0 0;rotate:-3deg}50%{translate:0 -6px;rotate:3deg}}
.mp-hz span{font:700 11px 'IBM Plex Sans KR',sans-serif;padding:1px 8px;border-radius:99px;background:#fff;color:#333;border:2px solid var(--lc);white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.mp-hz em{font-style:normal;display:none;min-width:22px;height:22px;padding:0 4px;border-radius:99px;place-items:center;font:800 11px 'JetBrains Mono',monospace;color:#fff;background:#9aa6bd;border:2px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.mp-hz em:not(:empty){display:grid}
.mp-hz em.mp-r1{background:#ffc531;color:#6a4500}
.mp-hz em.mp-r2{background:#b9c6d6;color:#3a4656}
.mp-hz em.mp-r3{background:#e7a06a;color:#5a2e0c}
.mp-puff{position:absolute;right:calc(100% - 8px);bottom:2px;width:10px;height:10px;border-radius:50%;background:#fff;opacity:0}
.mp-hz.mp-run .mp-puff{animation:mp-puff .5s ease-out infinite}
.mp-hz.mp-run .mp-puff:nth-of-type(2){animation-delay:.25s;bottom:8px}
@keyframes mp-puff{0%{opacity:.9;transform:translateX(0) scale(.6)}100%{opacity:0;transform:translateX(-18px) scale(1.3)}}
.mp-rnote{font-size:12.5px;color:#3b4560;margin:10px 2px 0;text-align:center}
.mp-rnote b{color:#e0701f}
/* 이름 메뉴 */
.mp-menu{position:fixed;z-index:15;background:#eef1f6;border:1px solid #2b3550;border-radius:4px;padding:3px;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.mp-menu b{display:block;padding:3px 10px;font-size:11px;color:#5a6680}
.mp-menu button{display:block;width:100%;text-align:left;background:none;border:0;color:#1d2433;padding:5px 12px;border-radius:3px;font-size:12.5px}
.mp-menu button:hover{background:#d6deec}

/* 묻는 창 (손잡기 · 초대 · 거래) */
.mp-asks{position:fixed;top:56px;left:50%;translate:-50% 0;z-index:18;display:flex;flex-direction:column;gap:6px;width:min(340px,calc(100vw - 20px))}
.mp-ask{background:#eef1f6;color:#1d2433;border:1px solid #2b3550;border-radius:5px;box-shadow:0 8px 24px rgba(0,0,0,.5);padding:9px 10px;font-size:12.5px;animation:mp-pop .15s ease-out}
.mp-ask div{display:flex;justify-content:flex-end;gap:5px;margin-top:7px}
.mp-ask button{padding:4px 12px;border-radius:3px;border:1px solid #6b7894;background:linear-gradient(180deg,#fff,#dde3ee);font-weight:700;font-size:12px;color:#1d2433}
.mp-ask .mp-go{background:linear-gradient(180deg,#ffd45e,#e7a21c);border-color:#a86e00;color:#3b2600}

/* 입장 */
.mp-pv{height:130px;display:grid;place-items:center;margin-top:8px;border-radius:4px;background:repeating-conic-gradient(#dfe4ee 0 25%,#f4f6fa 0 50%) 0 0/16px 16px;border:1px solid #9aa6bd}
.mp-pv img{max-height:110px;image-rendering:pixelated}
.mp-pv span{font-size:12px;color:#7a869c}
.mp-enter{backdrop-filter:blur(6px);background:rgba(4,6,12,.55)}

@media (max-width:700px){
  .mp-map{width:118px}
  .mp-log{height:110px}
  .mp-chat{bottom:64px}
  .mp-hud{top:58px;left:10px;translate:none;flex-wrap:wrap;max-width:calc(100vw - 150px)}
  .mp-hud span{font-size:11px;padding:3px 7px}
}
</style>
</head>
<body data-page="mal" data-noheader data-nofooter class="mp">
<div class="mp-stage" id="mp-stage"><div class="mp-floor" id="mp-floor"></div></div>

<div class="mp-where"><a href="index.html">← 메인 · 말장난</a><b id="mp-place">거실</b></div>
<div class="mp-hud">
  <span id="mp-rdbox">라운드 <b id="mp-rd">-</b>/5</span>
  <span id="mp-clock">시작 전</span>
  <span>자금 <b id="mp-money">-</b></span>
  <span>귓속말 <b id="mp-wl">-</b>/6</span>
</div>
<div class="mp-map"><h4>장소</h4><div id="mp-places"></div></div>

<div class="mp-chat">
  <div class="mp-tabs" id="mp-tabs"><button class="mp-on" data-t="all">전체</button><button data-t="party">파티</button><button data-t="w">귓속말</button></div>
  <div class="mp-log" id="mp-log"></div>
  <div class="mp-inrow">
    <select id="mp-ch"><option value="all">전체</option><option value="party">파티</option><option value="w">귓속말</option></select>
    <input id="mp-msg" maxlength="120" autocomplete="off">
    <button id="mp-send">입력</button>
  </div>
</div>

<div class="mp-quick">
  <button id="mp-q-start" class="mp-startb" hidden><b>▶</b>시작</button>
  <button id="mp-q-race"><b>🏁</b>경주판</button>
  <button id="mp-q-clue"><b>📜</b>단서</button>
  <button id="mp-q-party"><b>👥</b>파티</button>
  <button id="mp-q-bet"><b>🏇</b>마권</button>
</div>

<div class="mp-asks" id="mp-asks"></div>

<!-- 입장 -->
<div class="mp-dim mp-enter" id="mp-enter" hidden>
  <div class="mp-win">
    <header><span>말장난 · 입장</span></header>
    <div class="mp-wb" id="mp-enterb">
      <label>내 캐릭터</label>
      <select id="mp-char"></select>
      <label>캐릭터 그림 링크 (배경이 투명한 PNG · imgur 등)</label>
      <input id="mp-url" placeholder="https://i.imgur.com/....png">
      <div class="mp-pv" id="mp-pv"><span>그림이 여기 보여요</span></div>
      <div class="mp-note" id="mp-err"></div>
    </div>
    <div class="mp-btns"><a class="mp-back" href="index.html" style="margin-right:auto;align-self:center;font-size:12px;color:#5a6680">메인으로</a><button class="mp-go" id="mp-go">입장</button></div>
  </div>
</div>

<!-- 쉬는 중 · 끝 -->
<div class="mp-dim" id="mp-closed" hidden>
  <div class="mp-win"><header><span>말장난</span></header><div class="mp-wb"><p id="mp-closedtx">지금은 말장난을 할 수 없어요</p></div><div class="mp-btns"><a href="index.html" class="mp-go" style="padding:5px 14px;border-radius:3px;font-weight:700;font-size:12px;text-decoration:none;background:linear-gradient(180deg,#ffd45e,#e7a21c);color:#3b2600;border:1px solid #a86e00">메인으로</a></div></div>
</div>

<!-- 장소 이동 -->
<div class="mp-dim" id="mp-mv" hidden>
  <div class="mp-win">
    <header><span>장소 이동</span></header>
    <div class="mp-wb"><p id="mp-mvtx"></p><p style="font-size:11.5px;color:#5a6680;margin:0">이동하면 지금 장소 대화는 사라지고 새 장소 대화는 들어간 뒤부터 보여요</p></div>
    <div class="mp-btns"><button data-x>취소</button><button class="mp-go" id="mp-mvok">이동</button></div>
  </div>
</div>

<!-- 단서 -->
<div class="mp-dim" id="mp-cluew" hidden>
  <div class="mp-win"><header><span>내 단서</span><button data-x>✕</button></header><div class="mp-wb" id="mp-clues"></div></div>
</div>

<!-- 파티 -->
<div class="mp-dim" id="mp-partyw" hidden>
  <div class="mp-win"><header><span>파티 (최대 4명)</span><button data-x>✕</button></header><div class="mp-wb" id="mp-partyb"></div>
    <div class="mp-btns"><button id="mp-pleave">파티 나가기</button><button data-x class="mp-go">닫기</button></div></div>
</div>

<!-- 거래 -->
<div class="mp-dim" id="mp-tw" hidden>
  <div class="mp-win" style="width:min(420px,100%)">
    <header><span id="mp-ttitle">정보 거래</span><button data-x>✕</button></header>
    <div class="mp-wb">
      <label>팔 정보</label>
      <select id="mp-tpick"></select>
      <label>제목 (상대가 미리 보는 것 · 20자)</label><input id="mp-ttl" maxlength="20">
      <label>내용 (상대가 사야 보여요 · 120자)</label><textarea id="mp-tbd" maxlength="120"></textarea>
      <div class="mp-row2">
        <div><label>받을 영전 (0~999)</label><input id="mp-task" type="number" min="0" max="999" value="0"></div>
        <div><label>덤으로 줄 영전 (0~999)</label><input id="mp-tgive" type="number" min="0" max="999" value="0"></div>
      </div>
      <div class="mp-note" id="mp-terr"></div>
    </div>

<script>
(async () => {
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const BG = { 복도: 'wmLXPbh', 거실: 'pQRPsZH', 벤치: 'avCtbLZ', 주차장: 'r7gf69F', 대나무숲: 'VSa17As' };
const PLACES = Object.keys(BG);
const REACT = ['누가 뽀뽀했어?', '누가 키스했냐?'];
const toast = m => sys(m);

const user = await App.ready;
if (!user) return;

/* ── 서버 상태 ── */
let S = null, off = 0;
async function load() {
  S = await Store.mj('state');
  off = Date.parse(S.now) - Date.now();
  return S;
}
try { await load(); } catch (e) { $('#mp-closedtx').textContent = e.message; $('#mp-closed').hidden = false; return; }
const nowS = () => Date.now() + off;
function rounds() {
  if (!S.started_at) return { d: 0, c: 0, left: 0 };
  const el = (nowS() - Date.parse(S.started_at)) / 1000, sec = S.round_sec;
  const d = Math.min(S.rounds, Math.floor(el / sec)), c = Math.min(S.rounds, Math.floor(el / sec) + 1);
  return { d, c, left: Math.max(0, c * sec - el), end: S.rounds * sec - el };
}

/* ── 그림: 둘레 투명 여백 잘라 내기 (각자 브라우저에서 · 트래픽 없음) ── */
const trimmed = {};
function trim(im) {
  try {
    const W = im.naturalWidth, H = im.naturalHeight, c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d'); x.drawImage(im, 0, 0); const d = x.getImageData(0, 0, W, H).data;
    let l = W, t = H, r = -1, b = -1;
    for (let y = 0; y < H; y++) for (let X = 0; X < W; X++) if (d[(y * W + X) * 4 + 3] > 10) { if (X < l) l = X; if (X > r) r = X; if (y < t) t = y; if (y > b) b = y; }
    if (r < 0) return '';
    const o = document.createElement('canvas'); o.width = r - l + 1; o.height = b - t + 1;
    o.getContext('2d').drawImage(c, l, t, o.width, o.height, 0, 0, o.width, o.height);
    return o.toDataURL();
  } catch (e) { return ''; }
}
function pic(url) {
  if (!url) return Promise.resolve('');
  if (trimmed[url] !== undefined) return Promise.resolve(trimmed[url] || url);
  return new Promise(res => {
    const im = new Image(); im.crossOrigin = 'anonymous';
    im.onload = () => { trimmed[url] = trim(im); res(trimmed[url] || url); };
    im.onerror = () => { trimmed[url] = ''; res(url); };
    im.src = url;
  });
}
function sprite(seed) {
  const c = document.createElement('canvas'); c.width = 12; c.height = 16; const x = c.getContext('2d');
  let s = seed * 7919 + 13; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const hair = `hsl(${Math.floor(r() * 360)},45%,${30 + Math.floor(r() * 30)}%)`, cl = `hsl(${Math.floor(r() * 360)},55%,55%)`;
  x.fillStyle = hair; x.fillRect(3, 0, 6, 3); x.fillRect(2, 1, 1, 4); x.fillRect(9, 1, 1, 4);
  x.fillStyle = '#f3d7b5'; x.fillRect(3, 3, 6, 4); x.fillStyle = '#111'; x.fillRect(4, 4, 1, 1); x.fillRect(7, 4, 1, 1);
  x.fillStyle = cl; x.fillRect(3, 7, 6, 5); x.fillRect(2, 8, 1, 3); x.fillRect(9, 8, 1, 3);
  x.fillStyle = '#2b2f3a'; x.fillRect(4, 12, 2, 3); x.fillRect(6, 12, 2, 3);
  return c.toDataURL();
}
function pix(rows, col) {
  const c = document.createElement('canvas'); c.width = rows[0].length; c.height = rows.length; const x = c.getContext('2d');
  rows.forEach((r, y) => [...r].forEach((v, X) => { if (v !== '.') { x.fillStyle = v === 'w' ? '#fff' : col; x.fillRect(X, y, 1, 1); } }));
  return c.toDataURL();
}
const HR = ['.dd.dd.', 'dwxdxxd', 'dxxxxxd', 'dxxxxxd', '.dxxxd.', '..dxd..', '...d...'];
const HEART = pix(HR, '#ff7eb6'), HEART2 = pix(HR, '#ffffff');
const STAR = pix(['...d...', '..dxd..', 'ddxwxdd', 'dxxxxxd', '.dxxxd.', 'dxxdxxd', 'dd...dd'], '#ffffff');

/* ── 화면 상태 ── */
let here = '거실', tab = 'all', sub = null;
const logs = { all: [], party: [], w: [] }; let order = 0;
const ppl = {};   // 지금 장소에 있는 사람 { u: {u,n,img,x,y,tx,ty,el,last} }
let me = null;    // 나 (ppl 안에도 있어요)
const holds = {}; // 손잡은 짝 { u: 상대 u }
let kissTo = null, starT = 0, lastDone = 0, raceShown = 0;

/* ── 대화 ── */
function add(box, txt, cls = '') { logs[box].push({ txt, cls, o: order++ }); if (logs[box].length > 80) logs[box].shift(); drawLog(); }
function sys(t) { add('all', t, 'mp-sys'); }
function drawLog() {
  const rows = tab === 'all' ? [...logs.all, ...logs.party, ...logs.w].sort((a, b) => a.o - b.o) : logs[tab];
  const el = $('#mp-log'); el.innerHTML = rows.map(l => `<div class="mp-ln ${l.cls}">${esc(l.txt)}</div>`).join(''); el.scrollTop = el.scrollHeight;
  document.querySelectorAll('#mp-tabs button').forEach(b => b.classList.toggle('mp-on', b.dataset.t === tab));
}
document.querySelectorAll('#mp-tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; $('#mp-ch').value = tab; drawLog(); });

/* ── 위 HUD ── */
function drawHud() {
  const r = rounds(), m = S.me;
  $('#mp-money').textContent = m ? m.money : '-';
  $('#mp-wl').textContent = m ? m.wl : '-';
  $('#mp-rd').textContent = r.c || '-';
  const ck = $('#mp-clock'), mmss = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const ban = S.started_at && r.c === S.rounds && r.end <= 60 && r.d < S.rounds;
  ck.classList.toggle('mp-warn', !!ban);
  if (!S.started_at) ck.innerHTML = `시작 전 <b>${S.players.length}</b>/${S.cap}명`;
  else if (r.d >= S.rounds) ck.innerHTML = '경주 끝';
  else ck.innerHTML = (ban ? '베팅 금지 ' : '남은 ') + `<b>${mmss(r.left)}</b>`;
  $('#mp-q-bet').disabled = !S.started_at || r.d >= S.rounds || !!ban;
  $('#mp-q-start').hidden = !(S.admin && !S.started_at);
}

/* ── 장소 ── */
function drawPlaces() {
  const n = Object.keys(ppl).length;
  $('#mp-places').innerHTML = PLACES.map(p => `<button data-p="${p}" class="${p === here ? 'mp-here' : ''}">${p}<span>${p === here ? n : ''}</span></button>`).join('');
  $('#mp-places').querySelectorAll('button').forEach(b => b.onclick = () => askMove(b.dataset.p));
  $('#mp-place').textContent = here;
}
let mvTo = '';
function askMove(p) { if (p === here) return; mvTo = p; $('#mp-mvtx').innerHTML = `<b>${p}</b>(으)로 이동할까요?`; $('#mp-mv').hidden = false; }
$('#mp-mvok').onclick = () => { $('#mp-mv').hidden = true; const hp = holds[user.id]; if (hp) sub.send({ k: 'go', to: hp, place: mvTo }); goPlace(mvTo, hp); };
function goPlace(p, partner) {
  const st = $('#mp-stage'); st.classList.add('mp-fade');
  setTimeout(() => {
    logs.all = [];
    Object.keys(ppl).forEach(k => { if (ppl[k].el) ppl[k].el.remove(); delete ppl[k]; });
    Object.keys(holds).forEach(k => delete holds[k]);
    kissTo = null; here = p;
    me = { u: user.id, n: S.me.n, img: S.me.img, x: 30 + Math.random() * 40, y: 80 + Math.random() * 8 };
    ppl[user.id] = me;
    st.style.backgroundImage = `url(https://i.imgur.com/${BG[here]}.png)`;
    sys(`${here}에 들어왔어요`);
    sub.enter(here, info());
    mkChar(me);
    if (partner) setTimeout(() => { holds[user.id] = partner; holds[partner] = user.id; sub.send({ k: 'hpair', a: user.id, b: partner }); }, 1500);
    drawPlaces(); st.classList.remove('mp-fade');
  }, 350);
}
const info = () => ({ n: S.me.n, img: S.me.img, x: Math.round(me.x * 10) / 10, y: Math.round(me.y * 10) / 10 });

/* ── 캐릭터 ── */
async function mkChar(p) {
  if (p.el) return;
  const d = document.createElement('div');
  d.className = 'mp-ch' + (p.u === user.id ? ' mp-me' : '') + (inParty(p.u) && p.u !== user.id ? ' mp-pt' : '');
  d.innerHTML = `<img alt=""><div class="mp-tag">${esc(p.n)}</div>`;
  d.querySelector('img').src = sprite(p.u.charCodeAt(0) + p.u.charCodeAt(5));
  d.querySelector('img').onclick = e => { if (p.u !== user.id) menu(e, p); };
  $('#mp-stage').appendChild(d); p.el = d; place(p);
  const src = await pic(p.img); if (src && p.el === d) d.querySelector('img').src = src;
}
function place(p) {
  if (!p.el) return;
  p.el.style.left = p.x + '%'; p.el.style.top = p.y + '%';
  p.el.style.setProperty('--h', Math.round(Math.min(140, innerHeight * .18)) + 'px');
  p.el.style.zIndex = Math.round(p.y * 10);
}
const inParty = u => (S.party || []).some(x => x.u === u);

/* ── 움직이기 · 내 쪽은 도착점만 보내요 ── */
$('#mp-floor').onclick = e => {
  if (!me) return;
  const r = $('#mp-stage').getBoundingClientRect();
  me.tx = e.clientX / r.width * 100; me.ty = Math.max(70, Math.min(94, e.clientY / r.height * 100));
  sendMove(me.tx, me.ty);
};
function sendMove(x, y) { const v = { k: 'mv', x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10 }; sub.send(v); sub.spot(Object.assign(info(), { x: v.x, y: v.y })); }
const keys = {};
addEventListener('keydown', e => {
  const a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT')) { if (e.key === 'Enter' && a.id === 'mp-msg') send(); return; }
  if (e.key === 'Enter') { $('#mp-msg').focus(); e.preventDefault(); return; }
  if (e.key.startsWith('Arrow') && me) { keys[e.key] = 1; me.tx = null; e.preventDefault(); }
});
addEventListener('keyup', e => {
  if (!keys[e.key]) return; delete keys[e.key];
  if (me && !Object.keys(keys).length) sendMove(me.x, me.y);
});
function tick() {
  Object.values(ppl).forEach(p => {
    if (!p.el) return;
    let dx = 0, dy = 0;
    if (p === me && (keys.ArrowLeft || keys.ArrowRight || keys.ArrowUp || keys.ArrowDown)) {
      dx = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0); dy = ((keys.ArrowDown ? 1 : 0) - (keys.ArrowUp ? 1 : 0)) * .6;
    } else if (p.tx != null) {
      const ax = p.tx - p.x, ay = p.ty - p.y, d = Math.hypot(ax, ay);
      if (d < .6) p.tx = null; else { dx = ax / d; dy = ay / d; }
    }
    p.moved = false;
    if (dx || dy) {
      p.x = Math.max(3, Math.min(97, p.x + dx * .45)); p.y = Math.max(70, Math.min(94, p.y + dy * .45));
      if (dx) p.el.classList.toggle('mp-left', dx < 0);
      p.el.classList.add('mp-walk'); place(p); p.moved = true; p.last = Date.now();
    } else p.el.classList.remove('mp-walk');
  });
  /* 손잡기: 움직이는 사람이 이끌고 상대는 옆에 붙어 따라가요 */
  const done = {};
  Object.keys(holds).forEach(a => {
    const b = holds[a]; if (done[a] || done[b]) return; done[a] = done[b] = 1;
    const A = ppl[a], B = ppl[b]; if (!A || !B || !A.el || !B.el) return;
    const lead = A.moved && !B.moved ? A : B.moved && !A.moved ? B : (A.last || 0) >= (B.last || 0) ? A : B, f = lead === A ? B : A;
    if (!lead.moved) return;
    const side = f.x >= lead.x ? 1 : -1;
    f.tx = null; f.x = Math.max(3, Math.min(97, lead.x + side * 6)); f.y = lead.y + .2;
    f.el.classList.add('mp-walk'); f.el.classList.toggle('mp-left', lead.el.classList.contains('mp-left')); place(f);
    if (performance.now() - starT > 260) { starT = performance.now(); star(A); star(B); }
  });
  /* 뽀뽀: 다가가서 닿으면 펑 */
  if (kissTo && ppl[kissTo] && me) {
    const k = ppl[kissTo];
    if (Math.hypot(k.x - me.x, (k.y - me.y) * 1.6) < 6) { sub.send({ k: 'kiss', a: user.id, b: kissTo }); kissFx(user.id, kissTo); kissTo = null; me.tx = null; sendMove(me.x, me.y); }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function star(p) {
  const h = Math.min(140, innerHeight * .18), im = document.createElement('img'); im.className = 'mp-sx'; im.src = STAR;
  im.style.cssText = `left:${p.x + (Math.random() - .5) * 3}%;top:calc(${p.y}% - ${h + 14}px);width:${10 + Math.random() * 8 | 0}px;--sd:${(Math.random() - .5) * 30}px;--glow:${Math.random() < .5 ? '#ff4fa3' : '#ff8cc6'}`;
  $('#mp-stage').appendChild(im); setTimeout(() => im.remove(), 1000);
}
function burst(x, y) {
  const h = Math.min(140, innerHeight * .18);
  for (let i = 0; i < 14; i++) {
    const im = document.createElement('img'); im.className = 'mp-px'; im.src = i % 2 ? HEART2 : HEART;
    const a = -Math.PI / 2 + (Math.random() - .5) * 2.4, r = 50 + Math.random() * 80, s = 14 + Math.random() * 14 | 0;
    im.style.cssText = `left:${x}%;top:calc(${y}% - ${h * .75}px);width:${s}px;--bx:${Math.cos(a) * r}px;--by:${Math.sin(a) * r}px;animation-delay:${Math.random() * .12}s;--glow:${i % 2 ? '#ffd6ec' : '#ff4fa3'}`;
    $('#mp-stage').appendChild(im); setTimeout(() => im.remove(), 1300);
  }
}
function bubble(p, t) {
  if (!p || !p.el) return;
  p.el.querySelector('.mp-bub')?.remove();
  const b = document.createElement('div'); b.className = 'mp-bub'; b.textContent = t; p.el.appendChild(b);
  setTimeout(() => b.remove(), 4000);
}
function kissFx(a, b) {
  const A = ppl[a], B = ppl[b]; if (!A || !B) return;
  burst((A.x + B.x) / 2, (A.y + B.y) / 2);
  Object.values(ppl).filter(p => p.u !== a && p.u !== b).forEach((p, i) => setTimeout(() => bubble(p, REACT[i % 2]), 200 + i * 180));
}

/* ── 보내기 ── */
function findPlayer(name) { return (S.players || []).find(p => p.n === name && p.u !== user.id); }
async function send() {
  const inp = $('#mp-msg'); let v = inp.value.trim(); if (!v) { inp.blur(); return; }
  let ch = $('#mp-ch').value, to = '';
  if (v.startsWith('/귓 ')) { const a = v.slice(3).split(' '); to = a.shift(); v = a.join(' '); ch = 'w'; }
  else if (v.startsWith('/파 ')) { v = v.slice(3); ch = 'party'; }
  else if (ch === 'w') { const a = v.split(' '); to = a.shift(); v = a.join(' '); }
  inp.value = '';
  try {
    if (ch === 'w') {
      const p = findPlayer(to); if (!p) { sys('귓속말: 받는 사람 이름을 확인해 주세요 (/귓 이름 할 말)'); return; }
      if (!v) return;
      const left = await Store.mj('whisper', { p_to: p.u, p_text: v });
      S.me.wl = left; drawHud(); add('w', `${p.n} << ${v}`, 'mp-w'); if (tab !== 'all') tab = 'w'; drawLog();
    } else if (ch === 'party') {
      if (!(S.party || []).length) { sys('파티가 없어요 · 사람을 눌러 파티 초대를 해 보세요'); return; }
      await Store.mj('party_say', { p_text: v }); add('party', `[파티] ${S.me.n} : ${v}`, 'mp-p');
    } else {
      sub.send({ k: 'say', t: v.slice(0, 80) }); add('all', `${S.me.n} : ${v.slice(0, 80)}`); bubble(me, v.slice(0, 80));
    }
  } catch (e) { sys(e.message); }
}
$('#mp-send').onclick = send;

/* ── 사람 누르면 메뉴 ── */
let mEl;
function menu(e, p) {
  e.stopPropagation(); mEl && mEl.remove();
  const isHold = holds[user.id] === p.u;
  mEl = document.createElement('div'); mEl.className = 'mp-menu';
  mEl.innerHTML = `<b>${esc(p.n)}</b><button data-a="w">귓속말</button><button data-a="t">정보 거래</button><button data-a="p">파티 초대</button><button data-a="h">${isHold ? '손 놓기' : '손잡기'}</button><button data-a="k">뽀뽀</button>`;
  mEl.style.left = Math.min(e.clientX, innerWidth - 130) + 'px'; mEl.style.top = Math.min(e.clientY, innerHeight - 170) + 'px';
  document.body.appendChild(mEl);
  mEl.onclick = async ev => {
    const a = ev.target.dataset.a; if (!a) return; mEl.remove();
    if (a === 'w') { $('#mp-ch').value = 'w'; $('#mp-msg').value = `/귓 ${p.n} `; $('#mp-msg').focus(); }
    if (a === 't') openTrade(p);
    if (a === 'p') { try { await Store.mj('party_invite', { p_to: p.u }); sys(`${p.n} 님에게 파티 초대를 보냈어요`); } catch (er) { sys(er.message); } }
    if (a === 'h') {
      if (isHold) { delete holds[user.id]; delete holds[p.u]; sub.send({ k: 'hoff', a: user.id, b: p.u }); sys(`${p.n} 님과 손을 놓았어요`); }
      else { sub.send({ k: 'hreq', to: p.u }); sys(`${p.n} 님에게 손잡기를 신청했어요`); }
    }
    if (a === 'k') { sub.send({ k: 'kreq', to: p.u }); sys(`${p.n} 님에게 뽀뽀를 신청했어요`); }
  };
}
addEventListener('click', () => mEl && mEl.remove());
document.querySelectorAll('[data-x]').forEach(b => b.onclick = () => b.closest('.mp-dim').hidden = true);

/* 묻는 창 */
function ask(html, yes, no, yesTx = '수락', noTx = '거절') {
  const d = document.createElement('div'); d.className = 'mp-ask';
  d.innerHTML = `${html}<div><button data-n>${noTx}</button><button class="mp-go" data-y>${yesTx}</button></div>`;
  $('#mp-asks').appendChild(d);

  d.querySelector('[data-n]').onclick = () => { clearTimeout(t); close(); no && no(); };
}

/* ── 실시간 신호 받기 ── */
const nameOf = u => (ppl[u] && ppl[u].n) || ((S.players || []).find(p => p.u === u) || {}).n || '누군가';
function onEv(place, v) {
  if (place !== here || !v || !v.from) return;
  const p = ppl[v.from];
  if (v.k === 'mv' && p) { p.tx = Math.max(3, Math.min(97, +v.x)); p.ty = Math.max(70, Math.min(94, +v.y)); }
  if (v.k === 'say' && p) { const t = String(v.t || '').slice(0, 80); add('all', `${p.n} : ${t}`); bubble(p, t); }
  if (v.k === 'hreq' && v.to === user.id) ask(`<b>${esc(nameOf(v.from))}</b> 님이 손을 잡자고 해요`, () => { holds[user.id] = v.from; holds[v.from] = user.id; sub.send({ k: 'hok', to: v.from }); sys(`${nameOf(v.from)} 님과 손을 잡았어요 · 움직이는 사람이 이끌어요`); });
  if (v.k === 'hok') { holds[v.from] = v.to; holds[v.to] = v.from; if (v.to === user.id) sys(`${nameOf(v.from)} 님이 손을 잡았어요 · 움직이는 사람이 이끌어요`); }
  if (v.k === 'hpair') { holds[v.a] = v.b; holds[v.b] = v.a; }
  if (v.k === 'hoff') { delete holds[v.a]; delete holds[v.b]; if (v.b === user.id) sys(`${nameOf(v.a)} 님이 손을 놓았어요`); }
  if (v.k === 'kreq' && v.to === user.id) ask(`<b>${esc(nameOf(v.from))}</b> 님이 뽀뽀하자고 해요`, () => sub.send({ k: 'kok', to: v.from }));
  if (v.k === 'kok' && v.to === user.id && p) { kissTo = v.from; me.tx = p.x + (me.x < p.x ? -3.5 : 3.5); me.ty = p.y; sendMove(me.tx, me.ty); sys(`${p.n} 님이 받아 줬어요 · 다가가요`); }
  if (v.k === 'kiss') { kissFx(v.a, v.b); }
  if (v.k === 'go' && v.to === user.id && PLACES.includes(v.place)) { sys(`${nameOf(v.from)} 님 손을 잡고 ${v.place}(으)로 가요`); const partner = v.from; setTimeout(() => goPlace(v.place, null), 100); setTimeout(() => { holds[user.id] = partner; holds[partner] = user.id; }, 2200); }
}
function onPeople(place, list) {
  if (place !== here) return;
  const seen = {};
  list.forEach(x => {
    seen[x.u] = 1;
    if (x.u === user.id) return;
    let p = ppl[x.u];
    if (!p) { p = ppl[x.u] = { u: x.u, n: String(x.n || '').slice(0, 20), img: x.img || '', x: +x.x || 50, y: +x.y || 84 }; mkChar(p); }
    else if (p.tx == null && Math.hypot((+x.x || p.x) - p.x, (+x.y || p.y) - p.y) > 1) { p.tx = +x.x; p.ty = +x.y; }
  });
  Object.keys(ppl).forEach(k => { if (k !== user.id && !seen[k]) { if (ppl[k].el) ppl[k].el.remove(); delete ppl[k]; delete holds[holds[k]]; delete holds[k]; } });
  if (list.some(x => x.u !== user.id && !(S.players || []).some(p => p.u === x.u))) refreshSoon();
  drawPlaces();
}
let rf = 0;
function refreshSoon() { clearTimeout(rf); rf = setTimeout(async () => { try { await load(); drawHud(); } catch (e) {} }, 800); }
async function onMine(ev, v) {
  if (ev === 'w') { add('w', `${String(v.n || '').slice(0, 20)} >> ${String(v.t || '').slice(0, 120)}`, 'mp-w'); }
  if (ev === 'p') { add('party', `[파티] ${String(v.n || '').slice(0, 20)} : ${String(v.t || '').slice(0, 120)}`, 'mp-p'); }
  if (ev === 'pinv') ask(`<b>${esc(v.n)}</b> 님이 파티에 초대했어요`, async () => { try { await Store.mj('party_join', { p_from: v.from }); await load(); repaintParty(); sys('파티에 들어갔어요'); } catch (e) { sys(e.message); } });
  if (ev === 'pup') { try { await load(); repaintParty(); } catch (e) {} }
  if (ev === 'off') {
    ask(`<b>${esc(v.fn)}</b> 님이 정보를 팔아요<br>“${esc(v.title)}”<br><small>내가 낼 영전 ${+v.ask || 0} · 덤으로 받을 영전 ${+v.give || 0}</small>`, async () => {
      try { const r = await Store.mj('offer_answer', { p_id: v.id, p_yes: true }); S.me.money = r.money; drawHud(); add('w', `[거래] ${v.fn} 님에게 “${r.title}” 을(를) 샀어요 · 단서 창에 들어갔어요`, 'mp-t'); showGot(r.title, r.body, v.fn); await load(); }
      catch (e) { sys(e.message); }
    }, async () => { try { await Store.mj('offer_answer', { p_id: v.id, p_yes: false }); add('w', `[거래] ${v.fn} 님 거래를 거절했어요`, 'mp-t'); } catch (e) {} }, '사기', '거절');
  }
  if (ev === 'offd') { add('w', `[거래] ${v.n} 님이 ${v.yes ? '샀어요' : '거절했어요'}`, 'mp-t'); if (v.yes) { try { await load(); drawHud(); } catch (e) {} } }
}
function repaintParty() { Object.values(ppl).forEach(p => p.el && p.el.classList.toggle('mp-pt', inParty(p.u) && p.u !== user.id)); }

/* ── 단서 · 산 정보 ── */
$('#mp-q-clue').onclick = () => {
  const mine = (S.clues || []).map(c => `<div class="mp-clue">${esc(c.t)}<small>라운드 ${c.r} 단서</small></div>`).join('');
  const got = (S.offers || []).filter(o => o.to === user.id && o.status === 'done').map(o => `<div class="mp-clue mp-bought">${esc(o.body || '(내용 없음)')}<small>${esc(o.fn)}에게 산 “${esc(o.title)}” · 진짜인지 몰라요</small></div>`).join('');
  $('#mp-clues').innerHTML = (mine || '<p class="mp-empty">게임이 시작되면 라운드마다 단서가 하나씩 들어와요</p>') + (got ? '<label>산 정보</label>' + got : '');
  $('#mp-cluew').hidden = false;
};
function showGot(title, body, from) { $('#mp-gotb').innerHTML = `<p><b>${esc(from)}</b> 님에게 산 “${esc(title)}”</p><div class="mp-seal">${esc(body || '(내용 없음)')}</div>`; $('#mp-gotw').hidden = false; }

/* ── 파티 ── */
$('#mp-q-party').onclick = () => {
  const ps = S.party || [];
  $('#mp-partyb').innerHTML = ps.length ? ps.map(p => `<div class="mp-clue">${esc(p.n)}${p.u === user.id ? ' (나)' : ''}</div>`).join('') + '<p class="mp-empty" style="margin-top:8px">파티 대화는 /파 할 말</p>' : '<p class="mp-empty">아직 파티가 없어요 · 사람을 눌러 파티 초대를 해 보세요</p>';
  $('#mp-pleave').hidden = !ps.length; $('#mp-partyw').hidden = false;
};
$('#mp-pleave').onclick = async () => { try { S = Object.assign(S, await Store.mj('party_leave')); repaintParty(); $('#mp-partyw').hidden = true; sys('파티에서 나왔어요'); } catch (e) { sys(e.message); } };

/* ── 거래 ── */
let tWho = null;
function openTrade(p) {
  tWho = p; $('#mp-ttitle').textContent = `${p.n} 님에게 정보 팔기`;
  $('#mp-tpick').innerHTML = '<option value="">직접 쓰기 (거짓말도 돼요)</option>' + (S.clues || []).map((c, i) => `<option value="${i}">내 단서: ${esc(c.t)}</option>`).join('');
  $('#mp-ttl').value = ''; $('#mp-tbd').value = ''; $('#mp-task').value = 0; $('#mp-tgive').value = 0; $('#mp-terr').textContent = '';
  $('#mp-tw').hidden = false;
}
$('#mp-tpick').onchange = e => { const c = (S.clues || [])[e.target.value]; if (c) { $('#mp-tbd').value = c.t; $('#mp-ttl').value = c.t.split(' ')[0].replace(/[은는]$/, '') + ' 정보'; } };
$('#mp-tok').onclick = async () => {
  const ask_ = Math.max(0, Math.min(999, Math.floor(+$('#mp-task').value || 0))), give = Math.max(0, Math.min(999, Math.floor(+$('#mp-tgive').value || 0)));
  const btn = $('#mp-tok'); btn.disabled = true;
  try { await Store.mj('offer', { p_to: tWho.u, p_title: $('#mp-ttl').value, p_body: $('#mp-tbd').value, p_ask: ask_, p_give: give }); $('#mp-tw').hidden = true; add('w', `[거래] ${tWho.n} 님에게 거래를 신청했어요`, 'mp-t'); }
  catch (e) { $('#mp-terr').textContent = e.message; }
  btn.disabled = false;
};

/* ── 마권 ── */
const laneName = n => ((S.lanes || []).find(l => l.lane === n) || {}).n || '-';
$('#mp-q-bet').onclick = () => {
  const o = (S.lanes || []).map(l => `<option value="${l.lane}">${l.lane}번 ${esc(l.n)}</option>`).join('');
  $('#mp-b1').innerHTML = o; $('#mp-b2').innerHTML = o; $('#mp-b2').selectedIndex = 1; $('#mp-berr').textContent = '';
  const m = S.me; $('#mp-bnow').textContent = m && m.bet_n ? `지금 마권: 1등 ${laneName(m.bet_a)} · 2등 ${laneName(m.bet_b)} · ${m.bet_n} 영전` : '아직 산 마권이 없어요';
  if (m && m.bet_n) { $('#mp-b1').value = m.bet_a; $('#mp-b2').value = m.bet_b; $('#mp-bamt').value = m.bet_n; }
  $('#mp-bw').hidden = false;
};
$('#mp-bok').onclick = async () => {
  const a = +$('#mp-b1').value, b = +$('#mp-b2').value, n = Math.floor(+$('#mp-bamt').value || 0);
  try { const r = await Store.mj('bet', { p_a: a, p_b: b, p_n: n }); Object.assign(S.me, { money: r.money, bet_a: a, bet_b: b, bet_n: n }); drawHud(); $('#mp-bw').hidden = true; sys(`마권을 샀어요 · 1등 ${laneName(a)} · 2등 ${laneName(b)} · ${n} 영전`); }
  catch (e) { $('#mp-berr').textContent = e.message; }
};

/* ── 경주판 ── */
const horsePic = {};
const LC = ['#ff8a8a', '#ffb84d', '#ffd84d', '#7ed98a', '#5cc8e8', '#7f9cff', '#b78cff', '#9aa6bd'];   // 칸 색
async function drawRace(from, to, run) {
  const L = S.lanes || [];
  if (!L.length) { $('#mp-track').innerHTML = ''; $('#mp-rnote').textContent = '아직 말이 없어요'; $('#mp-rw').hidden = false; return; }
  const posAt = (l, k) => +(l.pos || [])[Math.min(k, (l.pos || []).length - 1)] || 0;
  const order = L.slice().sort((a, b) => posAt(b, to) - posAt(a, to));
  $('#mp-rtitle').textContent = to === 0 ? '경주판 · 출발 전' : to >= S.rounds ? '경주판 · 결승' : `경주판 · 라운드 ${to} 끝`;
  $('#mp-track').innerHTML = '<div class="mp-start"></div><div class="mp-goal"></div><span class="mp-goaltag">GOAL</span>' + L.map(l => `<div class="mp-lane" style="--lc:${LC[(l.lane - 1) % 8]}"><div class="mp-no">${l.lane}</div><div class="mp-hz" data-l="${l.lane}" style="--d:${posAt(l, from)}"><i class="mp-puff"></i><i class="mp-puff"></i><img src="${horsePic[l.lane] || sprite(l.lane * 31)}"><b class="mp-lab"><span>${esc(l.n)}</span><em></em></b></div></div>`).join('');
  L.forEach(async l => { if (l.img && !horsePic[l.lane]) { horsePic[l.lane] = await pic(l.img); } const im = $(`#mp-track .mp-hz[data-l="${l.lane}"] img`); if (im && horsePic[l.lane]) im.src = horsePic[l.lane]; });
  const zs = () => document.querySelectorAll('#mp-track .mp-hz');
  const go = () => zs().forEach(z => { const l = L.find(x => x.lane === +z.dataset.l); z.style.setProperty('--d', posAt(l, to)); if (run) z.classList.add('mp-run'); });
  const end = () => zs().forEach(z => { z.classList.remove('mp-run'); if (to > 0) { const k = order.findIndex(x => x.lane === +z.dataset.l) + 1, em = z.querySelector('em'); em.textContent = k; em.className = k <= 3 ? 'mp-r' + k : ''; } });
  if (run) { requestAnimationFrame(() => requestAnimationFrame(go)); setTimeout(end, 4100); } else { go(); end(); }
  $('#mp-rnote').innerHTML = to === 0 ? '라운드가 끝날 때마다 말들이 한 구간씩 달려요 · 중간 순위는 뒤집힐 수 있어요'
    : to < S.rounds ? `지금 선두는 <b>${esc(order[0].n)}</b> · 마지막 결과는 다를 수 있어요` : `<b>1등 ${esc(order[0].n)} · 2등 ${esc(order[1].n)}</b>`;
  $('#mp-rw').hidden = false;
}
$('#mp-q-race').onclick = () => drawRace(raceShown, raceShown, false);

/* ── 시작 (관리자) ── */
$('#mp-q-start').onclick = async () => {
  if (!confirm(`지금 ${S.players.length}명으로 시작할까요?`)) return;
  try { S = await Store.mj('start'); off = Date.parse(S.now) - Date.now(); sub.ping('start'); lastDone = 0; drawHud(); sys('게임이 시작됐어요 · 라운드 1 · 단서가 들어왔어요'); } catch (e) { sys(e.message); }
};

/* ── 라운드가 바뀔 때만 서버에 한 번 물어봐요 ── */
let busy = false;
async function roundTick() {
  drawHud();
  if (!S.started_at || busy) return;
  const r = rounds();
  if (r.d > lastDone) {
    busy = true;
    const from = raceShown;
    try { await load(); } catch (e) {}
    logs.all = []; logs.party = []; logs.w = []; drawLog();
    const d = Math.min(S.done, r.d);
    lastDone = d; raceShown = d;
    sys(d >= S.rounds ? '경주가 끝났어요 · 결승!' : `라운드 ${d} 끝 · 채팅이 지워졌어요 · 말들이 달려요`);
    drawRace(from, d, true);
    if (d >= S.rounds) setTimeout(finish, 4300);
    else setTimeout(() => sys(`라운드 ${d + 1} 시작 · 새 단서가 들어왔어요`), 4200);
    busy = false;
  }
}
async function finish() {
  try {
    const r = await Store.mj('claim');
    const res = r.hit === 2 ? '1·2등 둘 다 맞힘 · 3배' : r.hit === 1 ? '하나 맞힘 · 본전' : '꽝';
    $('#mp-rnote').innerHTML += `<br>내 마권 ${S.me.bet_n ? `${esc(laneName(S.me.bet_a))} · ${esc(laneName(S.me.bet_b))} → ${res}` : '없음'} · 게임 자금 결과 <b>${r.final}</b><br>테스트라서 결과와 상관없이 <b>1000 영전</b>${r.again ? '은 이미 받았어요' : '을 받았어요'}`;
    $('#mp-rw').hidden = false;
  } catch (e) { sys(e.message); }
}

/* ── 들어가기 ── */
function enterWorld() {
  $('#mp-enter').hidden = true;
  goPlace('거실', null);
  const r = rounds(); lastDone = r.d; raceShown = r.d;
  drawHud();
  if (S.started_at && r.d >= S.rounds) setTimeout(() => { drawRace(S.rounds, S.rounds, false); finish(); }, 600);
}
sub = await Store.mjSub(user.id, { ev: (p, v) => onEv(p, v), people: onPeople, mine: onMine, ping: async t => { try { await load(); drawHud(); if (t === 'start') sys('게임이 시작됐어요 · 라운드 1 · 단서가 들어왔어요'); } catch (e) {} } });
addEventListener('pagehide', () => sub && sub.stop());
setInterval(roundTick, 1000);
$('#mp-stage').style.backgroundImage = `url(https://i.imgur.com/${BG[here]}.png)`;
drawLog(); drawHud(); drawPlaces();

if (!S.on && !S.admin) { $('#mp-closed').hidden = false; return; }
if (S.me) { enterWorld(); return; }
if (S.started_at && rounds().d >= S.rounds) { $('#mp-closedtx').textContent = '이번 판은 끝났어요'; $('#mp-closed').hidden = false; return; }
if (S.players.length >= S.cap) { $('#mp-closedtx').textContent = `자리가 다 찼어요 (${S.cap}명) · 참가자만 들어갈 수 있어요`; $('#mp-closed').hidden = false; return; }

/* 입장 창 */
let chars = [];
try { chars = (await Store.myCharacters()).map(c => ({ id: c.id, name: (((c.data || {}).name || (c.draft || {}).name || '') + '').trim() || '이름 없음' })); } catch (e) {}
$('#mp-char').innerHTML = chars.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('') || '<option value="">캐릭터가 없어요</option>';
let url = '';
$('#mp-url').oninput = async e => {
  const u = e.target.value.trim(); $('#mp-err').textContent = ''; url = '';
  if (!/^https:\/\/\S+$/i.test(u)) { $('#mp-pv').innerHTML = '<span>https 로 시작하는 그림 링크를 넣어 주세요</span>'; return; }
  const src = await pic(u); if ($('#mp-url').value.trim() !== u) return;
  if (trimmed[u] === '' && src === u) { const t = new Image(); t.onload = () => { url = u; $('#mp-pv').innerHTML = ''; $('#mp-pv').appendChild(t); }; t.onerror = () => { $('#mp-pv').innerHTML = '<span>그림을 못 불러왔어요<br>그림을 오른쪽 클릭 → 이미지 주소 복사로 받은 링크를 넣어 주세요 (i.imgur.com/….png)</span>'; }; t.src = u; return; }
  url = u; $('#mp-pv').innerHTML = `<img src="${src}">`;
};
$('#mp-go').onclick = async () => {
  if (!$('#mp-char').value) { $('#mp-err').textContent = '캐릭터가 있어야 들어올 수 있어요'; return; }
  if (!url) { $('#mp-err').textContent = '그림을 먼저 넣어 주세요'; return; }
  const b = $('#mp-go'); b.disabled = true;
  try { S = await Store.mj('join', { p_char: $('#mp-char').value, p_img: url }); off = Date.parse(S.now) - Date.now(); sub.ping('join'); enterWorld(); }
  catch (e) { $('#mp-err').textContent = e.message; }
  b.disabled = false;
};
$('#mp-enter').hidden = false;
})();
</script>
</body>
</html>
