<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; media-src 'self' https: blob:; connect-src 'self' https: wss://*.supabase.co; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리 — 三娑罗</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Nanum+Pen+Script&family=Noto+Serif+KR:wght@400;600&family=Song+Myung&family=Zhi+Mang+Xing&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/banner.css">
</head>
<body data-page="admin" data-embers>

<header class="page-head wrap" style="padding-bottom:30px">
  <div class="big-han">管理</div>
  <div class="eyebrow">Administrator</div>
  <h1>관리자 모드</h1>
  <p>캐릭터 · 회원 · 상점 · 수업 · 사이트를 한곳에서 관리해요.</p>
</header>

<main class="wrap adm" id="adm">
  <div class="etabs adm-tabs">
    <button data-g="char" class="on">✦ 캐릭터</button>
    <button data-g="member">◎ 회원 <i id="join-n" class="cnt" hidden></i></button>
    <button data-g="coin">🪙 지급</button>
    <button data-g="shop">🏮 상점</button>
    <button data-g="play">📚 수업 · 대국</button>
    <button data-g="site">⚙ 사이트</button>
  </div>
  <div class="adm-sub" id="sub"></div>
  <div id="pane"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/keyring.js"></script>
<script src="assets/js/char-editor.js"></script>
<script src="assets/js/lesson-insta.js"></script>
<script>
App.ready.then(async user => {
  if (!user || !['admin', 'staff'].includes(user.grade)) {
    $('#adm').innerHTML = `<div class="empty"><div style="font:400 90px/1 var(--han);color:var(--red)">禁</div><p>관리자만 들어올 수 있어요.</p>
      ${user ? '' : '<a class="btn" href="login.html?next=admin.html">입장</a>'}</div>`;
    return;
  }
  const ADMIN = user.grade === 'admin';   // 부관리자(staff): 심사 대기 · 회원 정보 + 영전 · 사이트 설정 · 메인 배너만
  if (!ADMIN) { $$('.adm-tabs [data-g="shop"], .adm-tabs [data-g="play"]').forEach(b => b.remove()); $('#adm').previousElementSibling && document.querySelector('header h1') && (document.querySelector('header h1').textContent = '부관리자 모드'); const hp = document.querySelector('header h1 + p'); if (hp) hp.textContent = '심사 대기 캐릭터 · 회원 영전 · 사이트 설정을 관리해요.'; }
  // 탭마다 새 화면판(pane)을 써요: 앞 탭이 늦게 불러와져도 지금 보는 화면을 덮어쓰지 않게
  let curPane = $('#pane');
  const toLocal = iso => { if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return ''; const z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`; };
  const fromLocal = v => v ? new Date(v).toISOString() : '';
  const when = iso => { const d = new Date(iso); return isNaN(d) ? '—' : `${d.getFullYear()}.${pad2(d.getMonth() + 1)}.${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
  const statusOf = (s, k) => {
    const w = Store.windowState(s, k);
    if (w.open) return `<span class="pill on">● 열림${w.until ? ' · ' + when(w.until) + '까지' : ''}</span>`;
    if (w.next) return `<span class="pill wait">◐ 예약됨 · ${when(w.next)} 시작</span>`;
    return '<span class="pill off">○ 닫힘</span>';
  };
  const sw = (id, on) => `<label class="switch"><input type="checkbox" id="${id}" ${on ? 'checked' : ''}><span></span></label>`;

  /* ---------- 사이트 · BGM ---------- */
  async function site() {
    const pane = curPane;
    const s = await Store.settings(true);
    pane.innerHTML = `<div class="adm-grid">
      <section class="adm-card">
        <header><b>♪ 사이트 BGM</b>${sw('bgm-on', s.bgm_on)}</header>
        <p class="hint-text">모든 페이지 오른쪽 아래에 작은 플레이어가 떠요. 유튜브 링크나 mp3 주소를 넣으세요. (캐릭터 파일 화면은 그 캐릭터의 테마곡이 우선이에요)</p>
        <label class="field"><span>곡 제목</span><input id="bgm-title" value="${esc(s.bgm_title)}" placeholder="밤의 도읍"></label>
        <label class="field"><span>유튜브 링크 / mp3 주소</span><input id="bgm-url" value="${esc(s.bgm_url)}" placeholder="https://youtu.be/…"></label>
        <div class="modal-foot"><button class="btn" id="bgm-save">BGM 저장</button></div>
      </section>
      <section class="adm-card">
        <header><b>✦ 가입 신청 받기</b>${sw('signup', s.signup_open)}</header>
        <p class="hint-text">끄면 입장 화면에서 "지금은 가입 신청을 받지 않아요"라고 안내돼요. 신청한 회원은 "가입 신청" 탭에서 승인해야 입장할 수 있어요.</p>
        <div class="big-stat"><b id="signup-state">${s.signup_open ? '받는 중' : '닫힘'}</b></div>
        <header style="margin-top:22px"><b>◎ 비회원 둘러보기</b>${sw('pubview', s.public_view)}</header>
        <p class="hint-text">켜면 로그인하지 않은 사람도 사이트를 구경할 수 있어요. 끄면(기본) 로그아웃 상태에선 입장 화면만 보여요.</p>
      </section>
    </div>
    ${ADMIN ? `<section class="adm-card" style="margin-top:18px"><header><b>🏷 보드 스티커</b><span class="label">사건 보드 쪽지에 붙일 수 있는 스티커 · 쪽지마다 최대 3개</span></header>
      <p class="hint-text">한 줄에 이미지 링크 하나씩 (https:// · 배경이 투명한 PNG 가 예뻐요). 여기서 빼면 이미 붙어 있던 쪽지에서도 안 보여요.</p>
      <div class="nf-stk" id="stk-pv" style="margin-bottom:10px"></div>
      <label class="field"><textarea id="stk-list" rows="6" placeholder="https://i.imgur.com/….png">${esc((s.board_stickers || []).join('\n'))}</textarea></label>
      <div class="modal-foot"><button class="btn" id="stk-save">스티커 저장</button></div></section>` : ''}`;
    const stkList = () => [...new Set(($('#stk-list') ? $('#stk-list').value : '').split('\n').map(x => x.trim()).filter(Boolean))];
    const stkPv = () => { const pv = $('#stk-pv'); if (pv) pv.innerHTML = stkList().filter(u => /^https:\/\//.test(u)).map(u => `<label><img src="${esc(u)}" alt="" referrerpolicy="no-referrer"></label>`).join(''); };
    if ($('#stk-list')) {
      stkPv(); $('#stk-list').oninput = stkPv;
      $('#stk-save').onclick = async () => {
        const list = stkList(); if (list.some(u => !/^https:\/\//.test(u))) return toast('링크는 https:// 로 시작해야 해요.', 'err');
        if (list.length > 40) return toast('스티커는 40개까지예요.', 'err');
        try { await Store.saveSettings({ board_stickers: list }); toast(`보드 스티커 ${list.length}개를 저장했어요.`); }
        catch (e) { toast(e.message, 'err'); }
      };
    }
    $('#bgm-save').onclick = async () => {
      const url = $('#bgm-url').value.trim();
      if (url && !/^https?:\/\//.test(url)) return toast('주소는 https:// 로 시작해야 해요.', 'err');
      try { await Store.saveSettings({ bgm_on: $('#bgm-on').checked, bgm_title: $('#bgm-title').value.trim(), bgm_url: url }); toast('BGM 설정을 저장했어요. 새로고침하면 적용돼요.'); }
      catch (e) { toast(e.message, 'err'); }
    };
    $('#bgm-on').onchange = () => $('#bgm-save').click();
    $('#pubview').onchange = async e => {
      try { await Store.saveSettings({ public_view: e.target.checked }); toast(e.target.checked ? '비회원도 둘러볼 수 있어요' : '이제 회원만 들어올 수 있어요'); }
      catch (ex) { toast(ex.message, 'err'); e.target.checked = !e.target.checked; }
    };
    $('#signup').onchange = async e => {
      try { await Store.saveSettings({ signup_open: e.target.checked }); $('#signup-state').textContent = e.target.checked ? '받는 중' : '닫힘'; toast(e.target.checked ? '회원가입을 열었어요' : '회원가입을 닫았어요'); }
      catch (ex) { toast(ex.message, 'err'); e.target.checked = !e.target.checked; }
    };
  }

  /* ---------- 등록 · 수정 기간 ---------- */
  async function period() {
    const pane = curPane;
    const [s, grants, members] = await Promise.all([Store.settings(true), Store.grants(), Store.profiles()]);
    const card = (k, title, desc) => `
      <section class="adm-card" data-k="${k}">
        <header><b>${title}</b>${statusOf(s, k)}</header>
        <p class="hint-text">${desc}</p>
        <div class="seg">${[['closed', '닫힘'], ['open', '열림'], ['scheduled', '기간 예약']].map(([v, l]) => `<button data-mode="${v}" class="${s[k + '_mode'] === v ? 'on' : ''}">${l}</button>`).join('')}</div>
        <div class="sched" ${s[k + '_mode'] === 'scheduled' ? '' : 'hidden'}>
          <div class="row2"><label class="field"><span>시작</span><input type="datetime-local" data-f="start" value="${toLocal(s[k + '_start'])}"></label>
          <label class="field"><span>마감</span><input type="datetime-local" data-f="end" value="${toLocal(s[k + '_end'])}"></label></div>
        </div>
        <div class="quick"><button class="icon-btn" data-quick="1">지금부터 1일</button><button class="icon-btn" data-quick="3">지금부터 3일</button><button class="icon-btn" data-quick="7">지금부터 7일</button></div>
        <div class="modal-foot"><button class="btn" data-save>저장</button></div>
      </section>`;
    const memberOpts = members.filter(m => m.grade !== 'admin').map(m => `<option value="${esc(m.id)}">${esc(m.nickname)}</option>`).join('');
    const nick = id => (members.find(m => m.id === id) || {}).nickname || '(탈퇴한 회원)';
    pane.innerHTML = `<div class="adm-grid">
      ${card('create', '✦ 캐릭터 등록 기간', '일반 회원이 새 캐릭터를 등록할 수 있는 기간이에요. 관리자는 언제나 등록할 수 있어요.')}
      ${card('edit', '✎ 캐릭터 수정 기간', '일반 회원이 <b>본인이 쓴</b> 캐릭터를 고칠 수 있는 기간이에요. 평소엔 닫아 두세요.')}
    </div>
    <section class="adm-card" style="margin-top:18px">
      <header><b>🔑 예외 허용</b><span class="label">기간이 아니어도 특정 회원만 열어 주기</span></header>
      <div class="row3" style="align-items:end">
        <label class="field"><span>회원</span><select id="g-user">${memberOpts || '<option value="">(일반 회원이 없어요)</option>'}</select></label>
        <label class="field"><span>허용할 것</span><select id="g-kind"><option value="edit">수정</option><option value="create">등록</option></select></label>
        <label class="field"><span>언제까지</span><input type="datetime-local" id="g-until" value="${toLocal(new Date(Date.now() + 864e5).toISOString())}"></label>
      </div>
      <div class="modal-foot" style="margin-top:0"><button class="btn" id="g-add">허용 추가</button></div>
      <ul class="adm-list">${grants.length ? grants.map(g => {
        const live = Date.parse(g.until) > Date.now();
        return `<li class="${live ? '' : 'dim'}"><b>${esc(nick(g.user_id))}</b><span>${g.kind === 'edit' ? '수정' : '등록'} 허용</span><span>${when(g.until)}까지${live ? '' : ' (만료)'}</span><button class="icon-btn" data-rm="${esc(g.id)}">해제</button></li>`;
      }).join('') : '<li class="dim">예외로 열어 준 회원이 없어요.</li>'}</ul>
    </section>`;

    $$('.adm-card[data-k]').forEach(c => {
      const k = c.dataset.k; let mode = s[k + '_mode'];
      $$('[data-mode]', c).forEach(b => b.onclick = () => {
        mode = b.dataset.mode; $$('[data-mode]', c).forEach(x => x.classList.toggle('on', x === b));
        $('.sched', c).hidden = mode !== 'scheduled';
      });
      $$('[data-quick]', c).forEach(b => b.onclick = () => {
        mode = 'scheduled'; $$('[data-mode]', c).forEach(x => x.classList.toggle('on', x.dataset.mode === 'scheduled'));
        $('.sched', c).hidden = false;
        $('[data-f=start]', c).value = toLocal(new Date().toISOString());
        $('[data-f=end]', c).value = toLocal(new Date(Date.now() + b.dataset.quick * 864e5).toISOString());
      });
      $('[data-save]', c).onclick = async () => {
        const st = $('[data-f=start]', c).value, en = $('[data-f=end]', c).value;
        if (mode === 'scheduled' && (!st || !en || new Date(st) >= new Date(en))) return toast('시작과 마감을 올바르게 정해 주세요.', 'err');
        try {
          await Store.saveSettings({ [k + '_mode']: mode, [k + '_start']: fromLocal(st), [k + '_end']: fromLocal(en) });
          toast('저장했어요'); period();
        } catch (e) { toast(e.message, 'err'); }
      };
    });
    $('#g-add').onclick = async () => {
      const uid = $('#g-user').value, until = $('#g-until').value;
      if (!uid || !until) return toast('회원과 기한을 골라 주세요.', 'err');
      try { await Store.addGrant({ user_id: uid, kind: $('#g-kind').value, until: fromLocal(until) }); toast('허용했어요'); period(); }
      catch (e) { toast(e.message, 'err'); }
    };
    $$('[data-rm]').forEach(b => b.onclick = async () => { try { await Store.removeGrant(b.dataset.rm); period(); } catch (e) { toast(e.message, 'err'); } });
  }

  /* ---------- 회원 관리 ---------- */
  async function membersTab(openId) {
    const pane = curPane;
    const [members, chars, wallets, items] = await Promise.all([Store.allProfiles(), Store.adminCharacters(), Store.adminWallets().catch(() => ({})), Store.shopItems(true).catch(() => [])]);
    pane.innerHTML = `<div class="toolbar"><input class="input" id="mq" type="search" placeholder="닉네임 검색"><span class="count">${pad2(members.length)} MEMBERS</span></div>
      <div class="mlist" id="mlist"></div>`;
    const walOf = id => Object.assign({ coins: 0, items: [], equip: {}, snacks: 0, tickets: {}, boosts: {}, boost_n: 0 }, wallets[id] || {});
    const boostTxt = (w, cid) => Object.entries((w.boosts || {})[cid] || {}).map(([k, v]) => `${k} +${v}`).join(' · ');
    const draw = () => {
      const q = $('#mq').value.trim().toLowerCase();
      $('#mlist').innerHTML = members.filter(m => !q || m.nickname.toLowerCase().includes(q)).map(m => {
        const cs = chars.filter(c => c.owner_id === m.id), w = walOf(m.id);
        const tt = w.equip.title && items.find(i => i.id === w.equip.title);
        return `<details class="mrow" data-id="${esc(m.id)}" ${m.id === openId ? 'open' : ''}>
          <summary><span class="sealc">${esc([...(m.seal || m.nickname)][0])}</span><b>${esc(m.nickname)}</b>
            ${m.username ? `<span class="label">@${esc(m.username)}</span>` : ''}
            <span class="grade ${m.grade === 'admin' || m.grade === 'staff' ? 'admin' : ''}">${{ admin: '관리자', staff: '부관리자' }[m.grade] || '일반'}</span>
            ${(m.approval || 'approved') !== 'approved' ? `<span class="pv-st ${m.approval === 'pending' ? 's-submitted' : 's-returned'}">${m.approval === 'pending' ? '승인 대기' : '거절됨'}</span>` : ''}
            <span class="label">캐릭터 ${pad2(cs.length)} · 영전 ${w.coins} · 가입 ${fmtDate(m.created_at)}</span><i class="chev">⌄</i></summary>
          <div class="mbody">
            <div class="label" style="margin-bottom:8px">지갑</div>
            <div class="wal-box"><div><span>영전</span><b>${w.coins}</b></div><div><span>칭호</span><b>${tt ? esc(Store.titleText(tt, w.equip)) : '없음'}</b></div>
              <div><span>칭호 보유</span><b>${w.items.filter(id => (items.find(i => i.id === id) || {}).kind === 'title').length}개</b></div><div><span>츄르</span><b>${w.snacks}</b></div>
              <div><span>심박권</span><b>${(w.tickets || {}).k_beat || 0}장</b></div><div><span>룸메이트 지정권</span><b>${(w.tickets || {}).k_room || 0}장</b></div><div><span>스탯 증가권</span><b>${w.boost_n || 0} / 10</b></div></div>
            <div class="row3">
              <label class="field"><span>닉네임</span><input data-f="nickname" value="${esc(m.nickname)}" ${ADMIN ? '' : 'readonly'}></label>
              <label class="field"><span>칭호</span><input data-f="title" value="${esc(m.title)}" ${ADMIN ? '' : 'readonly'}></label>
              ${ADMIN ? '' : '<!--'}<label class="field"><span>등급</span><select data-f="grade"><option value="member" ${m.grade === 'member' || !m.grade ? 'selected' : ''}>일반 회원</option><option value="staff" ${m.grade === 'staff' ? 'selected' : ''}>부관리자</option><option value="admin" ${m.grade === 'admin' ? 'selected' : ''}>관리자</option></select></label>${ADMIN ? '' : '-->'}
            </div>
            <p class="hint-text">아이디: <b>${esc(m.username || '—')}</b> · 이메일(본인이 적은 것): ${esc(m.email || '—')}</p>
            ${ADMIN ? '<div class="modal-foot" style="justify-content:flex-start;margin:0 0 18px"><button class="btn sm" data-act="save">정보 저장</button></div>' : '<div style="height:14px"></div>'}
            <div class="label" style="margin-bottom:8px">이 회원이 낸 캐릭터</div>
            <ul class="adm-list">${cs.length ? cs.map(c => `<li><b>${esc(((c.draft || c.data) || {}).name || '?')}</b><span class="pv-st s-${c.status || 'published'}">${{ draft: '작성 중', submitted: '심사 대기', returned: '반려', published: '게시됨' }[c.status || 'published']}</span><span>${boostTxt(w, c.id) ? `스탯 증가 ${esc(boostTxt(w, c.id))}` : fmtDate(c.created_at)}</span>
              <a class="icon-btn" href="character.html?id=${encodeURIComponent(c.id)}${c.draft ? '&preview=1' : ''}">보기</a>${ADMIN ? `<button class="icon-btn" data-cedit="${esc(c.id)}">수정</button><button class="icon-btn danger" data-cdel="${esc(c.id)}">삭제</button>` : ''}</li>`).join('')
              : '<li class="dim">아직 낸 캐릭터가 없어요.</li>'}</ul>
            ${ADMIN ? '' : '<!--'}<div class="row2" style="margin-top:18px;align-items:end">
              <label class="field"><span>비밀번호 변경 <small>6자 이상</small></span><input type="password" data-f="pw" autocomplete="new-password"></label>
              <div class="field"><button class="btn ghost" data-act="pw">비밀번호 바꾸기</button></div>
            </div>
            <div class="danger-zone"><div><b>탈퇴 처리</b><p>이 회원과 회원이 낸 캐릭터·쪽지·텔레파시가 모두 지워져요. 되돌릴 수 없어요.</p></div>
              <button class="btn danger" data-act="del" ${m.id === user.id ? 'disabled title="자기 자신은 탈퇴 처리할 수 없어요"' : ''}>탈퇴시키기</button></div>${ADMIN ? '' : '-->'}
          </div></details>`;
      }).join('') || '<div class="empty">회원이 없어요.</div>';
    };
    draw(); $('#mq').oninput = draw;
    $('#mlist').onclick = async e => {
      const row = e.target.closest('.mrow'); if (!row) return;
      const id = row.dataset.id, m = members.find(x => x.id === id);
      const f = k => $(`[data-f="${k}"]`, row);
      try {
        const ce = e.target.closest('[data-cedit]');
        if (ce) return CharEditor.open(chars.find(c => c.id === ce.dataset.cedit));
        const cd = e.target.closest('[data-cdel]');
        if (cd) {
          const c = chars.find(x => x.id === cd.dataset.cdel);
          if (!await askConfirm(`"${c.data.name}" 캐릭터를 삭제할까요?`)) return;
          await Store.remove('characters', c.id); toast('삭제했어요'); return membersTab(id);
        }
        const act = e.target.closest('[data-act]'); if (!act) return;
        if (act.dataset.act === 'save') {
          await Store.adminUpdateProfile(id, { nickname: f('nickname').value.trim() || m.nickname, title: f('title').value.trim() });
          if (f('grade').value !== m.grade) await Store.setGrade(id, f('grade').value);
          toast('저장했어요'); return membersTab(id);
        }
        if (act.dataset.act === 'pw') {
          await Store.setPassword(id, f('pw').value); f('pw').value = ''; toast(`${m.nickname} 님의 비밀번호를 바꿨어요`);
        }
        if (act.dataset.act === 'del') {
          const typed = await askPrompt(`정말 탈퇴시키려면 닉네임 "${m.nickname}" 을(를) 입력하세요.`);
          if (typed !== m.nickname) return typed != null && toast('닉네임이 달라서 취소했어요.');
          await Store.deleteUser(id); toast('탈퇴 처리했어요'); membersTab();
        }
      } catch (ex) { toast(ex.message, 'err'); }
    };
  }

  /* ---------- 지급: 전체 선택을 누르면 이름이 뜨고, 이름을 누르면 빠져요 · 서버에는 한 번만 보내요 ---------- */
  async function coinTab() {
    const pane = curPane;
    const [all, chars] = await Promise.all([Store.allProfiles(), Store.charNames().catch(() => [])]);
    const members = all.filter(m => (m.approval || 'approved') === 'approved');
    const list = {
      coin: members.map(m => { const names = chars.filter(c => c.owner_id === m.id).map(c => c.data.name).filter(Boolean); return { id: m.id, name: names.join(' · ') || m.nickname, q: m.nickname + ' ' + names.join(' ') }; }),
      stat: chars.map(c => ({ id: c.id, name: c.data.name || '?', q: c.data.name || '' }))
    };
    const picked = { coin: new Set(), stat: new Set() };
    let mode = 'coin';
    pane.innerHTML = `<section class="adm-card cg">
      ${ADMIN ? '<div class="cg-mode"><button type="button" data-m="coin" class="on">영전</button><button type="button" data-m="stat">스탯 선물 상자</button></div>' : ''}
      <div class="cg-amt" id="cg-coin"><label class="field"><span>영전 <small>빼려면 앞에 -</small></span><input type="number" id="cg-amt" placeholder="50"></label>
        <div class="cg-q">${[10, 50, 100].map(n => `<button type="button" class="btn sm ghost" data-qc="${n}">+${n}</button>`).join('')}</div></div>
      <label class="field"><span>이유 <small>메인에서 사리가 알려 줘요 · 예) 이벤트 보상</small></span><input id="cg-note" maxlength="60" placeholder="비워도 돼요"></label>
      <div class="cg-who"><b>받을 사람</b><span id="cg-n"></span><button type="button" class="btn sm ghost" id="cg-all">전체 선택</button><button type="button" class="btn sm ghost" id="cg-none">비우기</button></div>
      <div class="cg-add"><input class="input" id="cg-q" type="search" placeholder="이름으로 한 명씩 추가" autocomplete="off"><div class="cg-sug" id="cg-sug" hidden></div></div>
      <div class="cg-chips" id="cg-chips"></div>
      <button class="btn cg-go" id="cg-go">지급</button></section>`;
    const draw = () => {
      const p = picked[mode], rows = list[mode].filter(r => p.has(r.id));
      $('#cg-chips').innerHTML = rows.map(r => `<button type="button" class="cg-chip" data-id="${esc(r.id)}" title="누르면 빠져요">${esc(r.name)}<i>×</i></button>`).join('');
      $('#cg-n').textContent = rows.length ? `${rows.length}${mode === 'coin' ? '명' : '개'}` : '';
      $('#cg-coin').hidden = mode !== 'coin';
      $('#cg-go').textContent = mode === 'coin' ? '영전 지급' : '상자 보내기';
    };
    const sug = () => {
      const q = $('#cg-q').value.trim().toLowerCase(), box = $('#cg-sug');
      const rows = q ? list[mode].filter(r => !picked[mode].has(r.id) && r.q.toLowerCase().includes(q)).slice(0, 6) : [];
      box.hidden = !rows.length;
      box.innerHTML = rows.map(r => `<button type="button" data-add="${esc(r.id)}">${esc(r.name)}</button>`).join('');
    };
    draw();
    $('#cg-q').oninput = sug;
    pane.onclick = async e => {
      const t = e.target;
      const mb = t.closest('[data-m]');
      if (mb) { mode = mb.dataset.m; $$('[data-m]', pane).forEach(x => x.classList.toggle('on', x === mb)); $('#cg-q').value = ''; sug(); return draw(); }
      const qc = t.closest('[data-qc]'); if (qc) { $('#cg-amt').value = qc.dataset.qc; return; }
      if (t.closest('#cg-all')) { list[mode].forEach(r => picked[mode].add(r.id)); return draw(); }
      if (t.closest('#cg-none')) { picked[mode].clear(); return draw(); }
      const add = t.closest('[data-add]'); if (add) { picked[mode].add(add.dataset.add); $('#cg-q').value = ''; sug(); return draw(); }
      const chip = t.closest('.cg-chip'); if (chip) { picked[mode].delete(chip.dataset.id); return draw(); }
      const go = t.closest('#cg-go'); if (!go) return;
      const ids = [...picked[mode]], n = parseInt($('#cg-amt').value, 10), note = $('#cg-note').value.trim();
      if (mode === 'coin' && !n) return toast('지급할 영전을 적어 주세요.', 'err');
      if (!ids.length) return toast('받을 사람을 골라 주세요.', 'err');
      if (!await askConfirm(mode === 'coin' ? `${ids.length}명에게 영전 ${n > 0 ? n + ' 지급' : -n + ' 회수'}할까요?` : `캐릭터 ${ids.length}개에게 스탯 선물 상자를 보낼까요?`)) return;
      go.disabled = true;
      try {
        if (mode === 'coin') await Store.giveBulk(ids, n, note); else await Store.giftBulk(ids, note);
        toast(mode === 'coin' ? `${ids.length}명에게 영전 ${n > 0 ? '+' : ''}${n}` : `선물 상자 ${ids.length}개를 보냈어요`);
        picked[mode].clear(); $('#cg-amt').value = ''; $('#cg-note').value = ''; draw();
      } catch (ex) { toast(ex.message, 'err'); }
      go.disabled = false;
    };
  }

  /* ---------- 상점: 물건 가격 · 판매 · 칭호 스탯 / 구매 · 선물 기록 (3일) ---------- */

      <table class="adm-table"><thead><tr><th>물건</th><th>종류</th><th>가격</th><th>수량 <small class="dim">0 = 무제한</small></th><th>판매</th><th>스탯 보너스</th><th>칭호 글씨체</th></tr></thead>

        <td>${sw('act-' + it.id, it.active !== false).replace('<input', '<input data-act')}</td>
        <td>${it.kind === 'title' ? `<span class="dim" data-st-txt>${esc(statTxt(it) || '없음')}</span> <button class="btn ghost sm" data-stat>정하기</button>` : it.kind === 'boost' ? `<span class="dim">무작위 +5 · 한 사람당 ${it.max_per || '∞'}번</span>` : '<span class="dim">—</span>'}</td>
        <td>${it.kind === 'title' ? `<select class="input" data-tfont><option value="">현재 글꼴</option><option value="chosun" ${it.font === 'chosun' ? 'selected' : ''}>조선일보체</option></select>` : '<span class="dim">—</span>'}</td></tr>`).join('')}</tbody></table></section>
      <section class="adm-card"><header><b>🎁 구매 · 선물 기록</b><span class="label">최근 ${Store.LOG_DAYS}일 · ${logs.length}건 (지난 기록은 저절로 지워져요)</span></header>
      <table class="adm-table"><thead><tr><th>시각</th><th>종류</th><th>산 사람</th><th>받은 사람</th><th>물건</th><th>영전</th><th>내용</th></tr></thead>
      <tbody>${logs.length ? logs.map(l => `<tr><td>${when(l.created_at)}</td><td><span class="act ${l.kind === 'buy' ? 'del' : ''}">${{ gift: '선물', buy: '구매', admin: '관리자 지급' }[l.kind] || esc(l.kind)}</span></td>
        <td>${esc(l.buyer_nick)}</td><td>${l.kind === 'buy' ? '<span class="dim">본인</span>' : esc(l.to_nick)}</td><td>${esc(l.item_name)}</td><td>${l.price}</td><td>${esc(l.detail || '')}</td></tr>`).join('')
        : '<tr><td colspan="7" class="dim">최근 3일 동안 기록이 없어요.</td></tr>'}</tbody></table></section>`;
    const save = async (id, patch, msg) => { try { const r = await Store.saveShopItem(Object.assign({ id }, patch)); Object.assign(items.find(i => i.id === id), r); toast(msg); } catch (e) { toast(e.message, 'err'); } };
    pane.onchange = e => {
      const tr = e.target.closest('tr[data-id]'); if (!tr) return; const id = tr.dataset.id;
      if (e.target.matches('[data-price]')) save(id, { price: Math.max(0, parseInt(e.target.value, 10) || 0) }, '가격을 바꿨어요');
      if (e.target.matches('[data-stock]')) { const n = Math.max(0, parseInt(e.target.value, 10) || 0); save(id, { stock: n }, n ? `수량을 ${n}명으로 정했어요` : '수량 제한을 없앴어요'); }
      if (e.target.matches('[data-tfont]')) save(id, { font: e.target.value }, '칭호 글씨체를 바꿨어요');
      if (e.target.matches('[data-act]')) save(id, { active: e.target.checked }, e.target.checked ? '다시 팔아요' : '판매를 멈췄어요');

      const m = openModal(`<div class="eyebrow">Title Stats</div><h3 style="font:400 22px var(--serif);margin:6px 0 4px">[ ${esc(it.name)} ] 스탯 보너스</h3>
        <p class="hint-text">이 칭호를 단 사람의 캐릭터 스탯에 더해져요. 비워 두면 0이에요.</p>
        <div class="stat-grid">${Store.STATS.map(k => `<label class="field"><span>${k}</span><input type="number" class="input" data-k="${k}" value="${esc(st[k] || '')}"></label>`).join('')}</div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px"><button class="btn ghost" data-x>닫기</button><button class="btn" data-ok>저장</button></div>`);
      m.querySelector('[data-x]').onclick = closeModal;
      m.querySelector('[data-ok]').onclick = async () => {
        const stats = {}; m.querySelectorAll('[data-k]').forEach(i => { const n = parseInt(i.value, 10); if (n) stats[i.dataset.k] = n; });
        await save(it.id, { stats }, '스탯 보너스를 저장했어요');

  /* ---------- 캐릭터 심사 ---------- */
  let rvFilter = 'submitted';
  const FIELD = { name: '이름', name_en: '영문', subtitle: '부제', org: '소속', team: '팀', codename: '코드네임', rank: '등급', classline: '분류', quote: '소개',
    element: '속성', color: '컬러', tags: '태그', keyring: '키링', persona_style: '성격 서식', images: '이미지', song: '테마곡', ability: '능력', danger: '위험도', skills: '스킬', stats: '능력치',
    persona: '성격', persona_tags: '성격 키워드', profile: '프로필', prompts: '프롬프트', custom: '설정', related: '관계', sections: '아카이브' };
  const changed = c => {
    if (!c.published_at || !c.draft) return [];
    const a = c.data || {}, b = c.draft || {};
    return [...new Set(Object.keys(a).concat(Object.keys(b)))].filter(k => JSON.stringify(a[k] ?? '') !== JSON.stringify(b[k] ?? '')).map(k => FIELD[k] || k);
  };
  async function review() {
    const pane = curPane;
    const cs = await Store.adminCharacters();
    const st = c => c.status || 'published';
    if (!ADMIN) rvFilter = 'submitted';
    const tabs = ADMIN ? [['submitted', '⏳ 심사 대기'], ['draft', '✎ 작성 중'], ['published', '✦ 게시됨'], ['all', '전체']] : [['submitted', '⏳ 심사 대기']];
    const list = cs.filter(c => rvFilter === 'all' || st(c) === rvFilter)
      .sort((a, b) => String(b.submitted_at || b.updated_at || b.created_at).localeCompare(String(a.submitted_at || a.updated_at || a.created_at)));
    const ST = { draft: '✎ 작성 중', submitted: '⏳ 심사 대기', returned: '↩ 반려됨', published: '✦ 게시됨' };
    const liveN = cs.filter(c => c.published_at).length;
    pane.innerHTML = `${ADMIN ? `<section class="adm-card" style="margin-bottom:14px"><header><b>🌙 레스트</b><button class="btn sm ghost" id="rv-rest" ${liveN ? '' : 'disabled'}>레스트 (${liveN}명 내리기)</button></header><p class="hint-text">게시된 프로필 전체가 멤버란에서 내려가요. 내용은 그대로 남고, 회원이 고쳐서 수정 기간에 다시 제출하면 심사 대기로 와요. 스탯은 계속 잠겨 있어요.</p></section>` : ''}<div class="review-tabs">${tabs.map(([k, l]) => `<button data-f="${k}" class="${k === rvFilter ? 'on' : ''}">${l}<b>${k === 'all' ? cs.length : cs.filter(c => st(c) === k).length}</b></button>`).join('')}</div>
      <div class="rv-list">${list.length ? list.map(c => {
        const d = (c.draft || c.data) || {}, ch = changed(c), pend = !!c.draft;
        return `<div class="rv-row" data-id="${esc(c.id)}">
          ${pend ? `<input type="checkbox" data-pick aria-label="${esc(d.name)} 선택">` : '<span></span>'}
          <div class="im" style="background-image:${cssUrl(charImage(d, c.id))}"></div>
          <div><h4>${esc(d.name || '이름 없음')}<span class="pv-st s-${st(c)}">${ST[st(c)]}</span>${pend ? `<span class="kind ${c.published_at ? '' : 'new'}">${c.published_at ? '수정본' : '첫 등록'}</span>` : ''}</h4>
            <p>@${esc(c.author)}${c.submitted_at && st(c) === 'submitted' ? ' · ' + when(c.submitted_at) + ' 제출' : ''}${c.published_at ? ' · 게시 ' + when(c.published_at) : ''}</p>
            ${ch.length ? `<p class="chg">바뀐 항목: ${esc(ch.join(', '))}</p>` : ''}
            ${st(c) !== 'published' && c.review_note ? '<p style="color:#ff8a80">↩ 반려됨 · 기간과 상관없이 다시 제출할 수 있어요</p>' : ''}</div>
          <div class="acts">
            ${pend ? `<a class="btn sm ghost" href="character.html?id=${encodeURIComponent(c.id)}&preview=1">👁 미리보기</a>` : `<a class="btn sm ghost" href="character.html?id=${encodeURIComponent(c.id)}">보기</a>`}
            ${ADMIN ? '<button class="btn sm ghost" data-rv="edit">수정</button>' : ''}
            ${ADMIN && c.published_at ? '<button class="btn sm ghost" data-rv="down">내리기</button>' : ''}
            ${pend ? '<button class="btn sm" data-rv="publish">게시 ›</button>' : ''}
          </div></div>`;
      }).join('') : `<div class="empty">${rvFilter === 'submitted' ? '심사를 기다리는 캐릭터가 없어요.' : '해당하는 캐릭터가 없어요.'}</div>`}</div>
      ${list.some(c => c.draft) ? `<div class="rv-bulk"><label class="chk"><input type="checkbox" id="rv-all"> 전체 선택</label><span class="label" id="rv-n">0명 선택</span>
        <button class="btn sm" id="rv-pub">일괄 게시 ›</button></div>` : ''}`;

    const picks = () => $$('[data-pick]:checked').map(x => x.closest('.rv-row').dataset.id);
    const upd = () => { const n = $('#rv-n'); if (n) n.textContent = picks().length + '명 선택'; };
    $$('[data-pick]').forEach(x => x.onchange = upd);
    if ($('#rv-all')) $('#rv-all').onchange = e => { $$('[data-pick]').forEach(x => x.checked = e.target.checked); upd(); };
    $$('.review-tabs button').forEach(b => b.onclick = () => { rvFilter = b.dataset.f; review(); });
    const bulk = async (fn, label) => {
      const ids = picks(); if (!ids.length) return toast('먼저 캐릭터를 골라 주세요.', 'err');
      if (!await askConfirm(label === '반려' ? `선택한 ${ids.length}명을 반려할까요? 작성 중으로 돌아가요.` : `선택한 ${ids.length}명을 게시할까요?`)) return;
      try { for (const id of ids) await fn(id); toast(`${ids.length}명 ${label}했어요`); review(); } catch (e) { toast(e.message, 'err'); }
    };
    if ($('#rv-rest')) $('#rv-rest').onclick = async () => {
      if (!await askConfirm(`게시된 ${liveN}명을 전부 멤버란에서 내릴까요?`)) return;
      try { const n = await Store.restAll(); toast(`레스트: ${n}명을 내렸어요`); review(); } catch (e) { toast(e.message, 'err'); }
    };
    if ($('#rv-pub')) $('#rv-pub').onclick = () => bulk(id => Store.publish(id), '게시');
    pane.querySelector('.rv-list').onclick = async e => {
      const b = e.target.closest('[data-rv]'); if (!b) return;
      const id = b.closest('.rv-row').dataset.id, c = cs.find(x => x.id === id);
      try {
        if (b.dataset.rv === 'edit') return CharEditor.open(c);

    const row = (p, rej) => `<li data-id="${esc(p.id)}"><b>${esc(p.nickname)}</b><span>@${esc(p.username || '—')}</span><span>${esc(p.email || '이메일 없음')}</span><span>${when(p.created_at)} 신청</span>

        ${pending.length > 1 ? '<div class="modal-foot"><button class="btn" id="j-all">모두 승인</button></div>' : ''}
      </section>
      ${rejected.length ? `<section class="adm-card" style="margin-top:16px"><header><b>거절한 신청</b><span class="label">입장할 수 없는 상태</span></header>

    if ($('#j-all')) $('#j-all').onclick = async () => {
      if (!await askConfirm(`${pending.length}명을 모두 승인할까요?`)) return;
      try { for (const p of pending) await Store.setApproval(p.id, 'approved'); toast('모두 승인했어요'); join(); joinBadge(); } catch (e) { toast(e.message, 'err'); }

    catch (e) { pane.innerHTML = `<section class="adm-card"><p class="dim">불러오지 못했어요 · ${esc(e.message || e)}<br>수업-기회.sql 을 먼저 실행했는지 확인해 주세요.</p></section>`; return; }
    const prog = r => r.done ? `${r.grade || '?'} · ${Number(r.score || 0).toLocaleString()}점` : `<b style="color:#ff8a80">진행 중 · ${r.answered === r.i ? r.i + 1 : r.i} / ${r.total} 풀고 멈춤</b>`;
    const fx = r => [r.delta ? `${r.delta > 0 ? '+' : ''}${r.delta} 스탯` : '', r.consol ? `영전 ${r.consol}` : ''].filter(Boolean).join(' · ');
    pane.innerHTML = `<section class="adm-card"><header><b>📋 오늘 수업 기록</b><span class="label">어제 · 오늘 ${rows.length}개 · 수업 하루는 오전 8시에 바뀌어요</span></header>
      <p class="hint-text">오류로 수업을 제대로 못 한 회원에게 그 과목 기회를 돌려줘요. 돌려주면 그 수업이 없던 일이 돼요 — 그 수업으로 바뀐 스탯을 되돌리고, 꽝 위로금을 거두고, 랭킹에서 빠져요. 두 과목을 들은 회원은 두 줄로 나와서 하나만 돌려줄 수 있어요.</p>
      <ul class="adm-list">${rows.map(r => `<li data-id="${esc(r.id)}">${r.today === false ? '<span style="color:#ffb36b">어제</span>' : ''}<b>${esc(r.nick)}</b><span>${esc(r.name)}</span><span>${SN[r.subj] || esc(r.subj)}</span><span>${prog(r)}</span>${fx(r) ? `<span>${esc(fx(r))}</span>` : ''}<span>${new Date(r.at).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span>
        <button class="icon-btn danger" data-reset style="margin-left:auto">기회 돌려주기</button></li>`).join('') || '<li class="dim">오늘 수업을 들은 회원이 없어요.</li>'}</ul></section>`;
    pane.querySelectorAll('[data-reset]').forEach(b => b.onclick = async () => {
      const li = b.closest('li'), r = rows.find(x => x.id === li.dataset.id); if (!r) return;
      if (!confirm(`${r.nick} (${r.name}) 의 오늘 ${SN[r.subj] || r.subj} 수업을 없던 일로 하고 기회를 돌려줄까요?\n${fx(r) ? `그 수업으로 생긴 ${fx(r)} 도 되돌려요.` : ''}`)) return;
      b.disabled = true;
      try { await Store.adminLessonReset(r.id); toast(`${r.nick} 에게 ${SN[r.subj] || r.subj} 기회를 돌려줬어요`); lessonToday(); }
      catch (e) { toast(e.message, 'err'); b.disabled = false; }
    });
  }

  /* 삼사라 증권: 열기 · 닫기 · 다음 시간 종목 체크 · 보상 */
  async function stockTab() {
    const pane = curPane;
    pane.innerHTML = '<section class="adm-card"><p class="dim">불러오는 중…</p></section>';
    let s, chars = [];
    try { [s, chars] = await Promise.all([Store.stockAdmin(), Store.charNames()]); }
    catch (e) { pane.innerHTML = `<section class="adm-card"><p class="dim">불러오지 못했어요 · ${esc(e.message || e)}<br>삼사라-증권.sql 을 먼저 실행했는지 확인해 주세요.</p></section>`; return; }
    const cname = id => ((chars.find(c => c.id === id) || {}).data || {}).name || '?';
    const tm = t => t ? new Date(t).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';
    const mid = new Date(); mid.setHours(24, 0, 0, 0);
    const local = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 16);
    const rank = `<ul class="adm-list">${(s.rank || []).map((r, i) => `<li><b>${i + 1}</b><span>${esc(r.nick)}</span><span>${esc(r.name)}</span><span>${Number(r.worth).toLocaleString()}</span><span style="color:${r.r >= 0 ? '#ff8a9d' : '#7fb8ff'}">${r.r > 0 ? '+' : ''}${r.r}%</span></li>`).join('') || '<li class="dim">아직 거래한 사람이 없어요.</li>'}</ul>`;
    const next = new Set(s.next || []);
    pane.innerHTML = s.on ? `
      <section class="adm-card"><header><b>삼사라 증권 · 열림</b><span class="label">참여 ${s.players}명 · 마감 ${tm(s.ends)}</span></header>
        <p class="hint-text">지금 종목 (다음 교체 ${tm(s.round_end)}): ${(s.live || []).map(id => esc(cname(id))).join(' · ')}</p>
        <div class="modal-foot" style="margin-top:0"><button class="btn danger" id="sk-close">지금 장 닫기</button></div>
        <p class="hint-text">닫으면 모두가 갖고 있던 주식이 지금 가격으로 한꺼번에 팔려요. 마감 시각이 지나도 다음 요청 때 저절로 닫혀요.</p></section>
      <section class="adm-card" style="margin-top:16px"><header><b>다음 시간에 나올 캐릭터</b><span class="label" id="sk-n">${next.size} / 10</span></header>
        <p class="hint-text">체크한 캐릭터가 다음 정각에 먼저 나와요. 10명이 안 되면 나머지는 랜덤으로 채워요. 정각에 쓰이고 나면 체크는 비워져요.</p>
        <input id="sk-q" placeholder="이름 찾기" style="width:100%;margin-bottom:8px">
        <div id="sk-list" style="display:flex;flex-wrap:wrap;gap:6px;max-height:260px;overflow:auto">${chars.map(c => `<label class="chip" data-nm="${esc(c.data.name)}" style="display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid rgba(255,255,255,.15);border-radius:99px;cursor:pointer"><input type="checkbox" value="${esc(c.id)}" ${next.has(c.id) ? 'checked' : ''}>${esc(c.data.name || '?')}</label>`).join('')}</div>
        <div class="modal-foot"><button class="btn" id="sk-pick">체크한 캐릭터 저장</button></div></section>
      <section class="adm-card" style="margin-top:16px"><header><b>지금 수익률 순위</b><span class="label">상위 10명</span></header>${rank}</section>`
    : `
      <section class="adm-card"><header><b>삼사라 증권 · 닫힘</b>${s.closed_at ? `<span class="label">${tm(s.closed_at)} 마감</span>` : ''}</header>
        <p class="hint-text">열면 이벤트 돈 · 주식이 모두 새로 시작해요. 매시 정각에 종목 10개가 바뀌고, 마감 시각이 되면 저절로 닫히면서 갖고 있던 주식이 그 가격으로 팔려요.</p>
        <div class="row2"><label class="field"><span>마감 시각</span><input type="datetime-local" id="sk-ends" value="${local(mid)}"></label>
          <label class="field"><span>처음 이벤트 돈</span><input type="number" id="sk-cash" value="100000" min="1000" step="1000"></label></div>
        <div class="modal-foot"><button class="btn" id="sk-open">장 열기</button></div></section>
      ${s.closed_at ? `<section class="adm-card" style="margin-top:16px"><header><b>최종 수익률 상위 10명</b><span class="label">${s.rewarded ? '보상 줬어요' : '아직 보상 안 줬어요'}</span></header>${rank}
        ${s.rewarded ? '' : '<div class="modal-foot"><button class="btn" id="sk-reward">10명 투자 캐릭터에게 재력 +1 주기</button></div>'}</section>` : ''}`;
    const run = async (b, fn, msg) => { b.disabled = true; try { await fn(); toast(msg); stockTab(); } catch (e) { toast(e.message, 'err'); b.disabled = false; } };
    if ($('#sk-open')) $('#sk-open').onclick = e => {
      const ends = new Date($('#sk-ends').value), cash = Math.floor(+$('#sk-cash').value || 100000);
      if (isNaN(ends)) return toast('마감 시각을 골라 주세요.', 'err');
      if (!confirm(`삼사라 증권을 열까요?\n마감 ${tm(ends)} · 처음 돈 ${cash.toLocaleString()}${s.closed_at ? '\n지난 기록은 모두 지워져요.' : ''}`)) return;
      run(e.target, () => Store.stockOpen(ends.toISOString(), cash), '장을 열었어요');
    };
    if ($('#sk-close')) $('#sk-close').onclick = e => { if (confirm('지금 장을 닫을까요? 모두의 주식이 지금 가격으로 팔려요.')) run(e.target, () => Store.stockClose(), '장을 닫았어요'); };
    if ($('#sk-reward')) $('#sk-reward').onclick = e => { if (confirm('상위 10명의 투자 캐릭터에게 재력 +1 를 줄까요? 한 번만 줄 수 있어요.')) run(e.target, () => Store.stockReward(), '재력 +1 를 줬어요'); };
    if ($('#sk-pick')) {
      const ids = () => $$('#sk-list input:checked').map(x => x.value);
      $('#sk-list').onchange = e => { if (ids().length > 10) { e.target.checked = false; toast('10명까지 고를 수 있어요.', 'err'); } $('#sk-n').textContent = ids().length + ' / 10'; };
      $('#sk-q').oninput = e => { const q = e.target.value.trim(); $$('#sk-list label').forEach(l => l.hidden = !!q && !l.dataset.nm.includes(q)); };
      $('#sk-pick').onclick = e => run(e.target, () => Store.stockPickNext(ids()), '다음 시간 캐릭터를 저장했어요');
    }
  }

  const HOUSES = ['본가', '경파', '염가', '염업'];
  async function lessonQ(subj) {
    const pane = curPane;
    let rows = [], chars = [];
    try { [rows, chars] = await Promise.all([Store.lessonItems(subj), Store.charNames()]); }
    catch (e) { pane.innerHTML = `<section class="adm-card"><p class="dim">불러오지 못했어요 · ${esc(e.message || e)}<br>후계자-수업.sql 을 먼저 실행했는지 확인해 주세요.</p></section>`; return; }
    const names = [...new Set(chars.map(c => c.data.name).filter(Boolean))], cname = id => (chars.find(c => c.id === id) || { data: {} }).data.name || '(지워진 인물)';
    let edit = null;   // 고치는 중인 줄
    const inp = (f, v, ph, max) => `<input data-f="${f}" value="${esc(v || '')}" placeholder="${esc(ph || '')}"${max ? ` maxlength="${max}"` : ''}>`;
    const HELP = {
      soc: '가문 어른이 보내는 문자예요. 회원은 자기 캐릭터 가문의 문자만 받아요 · 수업 한 번에 1통이 나와요 · 보기 셋은 화면에서 순서가 섞여요.',
      mor: '인물이 하는 부탁이에요. 공통으로 쓰면 어느 인물이 나와도 쓸 수 있어요 · 수업 한 번에 서로 다른 두 인물이 부탁을 하나씩 해요 · 그 인물 전용 부탁이 먼저 나오고 없으면 공통에서 골라요.',
      art: '인스타 스토리예요. 셀피 이미지 주소를 넣고 반응을 2 ~ 8개 써요 · 반응마다 결과만 정하면 돼요 · 한 번에 스토리 2개가 나와요 · 반응 순서는 매번 섞여요 · 고른 반응의 결과와 DM 은 회원에게 안 보여요 (끝나고 대박 · 무난 · 망함 합계만).'
    };
    const form = it => {
      it = it || {};
      if (subj === 'soc') { const o = it.opts || []; return `
        <div class="row3"><label class="field"><span>가문</span><select data-f="house">${HOUSES.map(h => `<option ${it.house === h ? 'selected' : ''}>${h}</option>`).join('')}</select></label>
          <label class="field"><span>보내는 사람</span>${inp('from', it.from, '큰어머니', 20)}</label></div>
        <label class="field"><span>문자 내용</span><textarea data-f="msg" maxlength="300" placeholder="오늘 제사 준비는 다 끝났느냐.">${esc(it.msg || '')}</textarea></label>
        <label class="field lq-ok"><span>✔ 정답 답장</span>${inp('o0', o[0], '네, 제기까지 다 닦아 두었습니다.', 120)}</label>
        <div class="row2"><label class="field lq-no"><span>✕ 오답 1</span>${inp('o1', o[1], 'ㅇㅇ 대충 함', 120)}</label><label class="field lq-no"><span>✕ 오답 2</span>${inp('o2', o[2], '그걸 왜 저한테 물어보세요?', 120)}</label></div>
        <label class="field"><span>늦게(3 ~ 5초) 답하면 오는 핀잔 · 비워도 돼요</span>${inp('scold', it.scold, '어른이 물으면 바로 답하는 게 도리다.', 120)}</label>`; }
      if (subj === 'mor') { const o = it.opts || [], r = it.react || []; return `
        <label class="field"><span>인물</span><select data-f="char_id"><option value="">✦ 공통 · 누구든</option>${chars.map(c => `<option value="${esc(c.id)}" ${it.char_id === c.id ? 'selected' : ''}>${esc(c.data.name)}</option>`).join('')}</select></label>
        <label class="field"><span>부탁 대사</span><textarea data-f="line" maxlength="300" placeholder="손이 시린데 차 한 잔만 줄래?">${esc(it.line || '')}</textarea></label>
        <div class="row2"><label class="field lq-ok"><span>✔ 정답 행동</span>${inp('o0', o[0], '미지근하게 식힌 차를 건넨다', 120)}</label><label class="field"><span>그때 반응 · 비워도 돼요</span>${inp('r0', r[0], '…따뜻하네. 고마워.', 120)}</label></div>
        <div class="row2"><label class="field lq-no"><span>✕ 오답 1</span>${inp('o1', o[1], '펄펄 끓는 물을 따라 준다', 120)}</label><label class="field"><span>그때 반응</span>${inp('r1', r[1], '앗 뜨거…!', 120)}</label></div>
        <div class="row2"><label class="field lq-no"><span>✕ 오답 2</span>${inp('o2', o[2], '"직접 하세요"라고 한다', 120)}</label><label class="field"><span>그때 반응</span>${inp('r2', r[2], '…그래.', 120)}</label></div>`; }
      const rx = (it.reactions || []).concat(Array.from({ length: Math.max(0, 5 - (it.reactions || []).length) }, () => ['', '', '무난', '']));
      return `
        <div class="row3"><label class="field"><span>캐릭터 이름</span><input data-f="char" list="lq-names" value="${esc(it.char || '')}" placeholder="은설" maxlength="40"><datalist id="lq-names">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist></label>
          <label class="field"><span>인스타 아이디</span>${inp('handle', it.handle, 'eunseol_', 40)}</label><label class="field"><span>올린 지</span>${inp('ago', it.ago, '3시간', 20)}</label></div>
        <div class="row2"><label class="field"><span>셀피 이미지 주소</span>${inp('img', it.img, 'https://i.imgur.com/….jpg', 500)}</label><label class="field"><span>사진 위 스티커 · 비워도 돼요</span>${inp('sticker', it.sticker, '첫눈 ❄', 60)}</label></div>
        <div class="lq-rx" id="lq-rx"><div class="lq-rh"><span>이모지</span><span>반응 문구</span><span>결과</span><span></span></div>
          ${rx.map(x => rxRow(x)).join('')}</div>
        <button type="button" class="icon-btn" id="lq-addrx">+ 반응 하나 더</button>`;
    };
    const rxRow = x => `<div class="lq-rr"><input data-rx="0" value="${esc(x[0] || '')}" placeholder="😍" maxlength="8"><input data-rx="1" value="${esc(x[1] || '')}" placeholder="오 진짜 예쁘다 어디야?" maxlength="80">
      <select data-rx="2">${['대박', '무난', '망함'].map(v => `<option ${x[2] === v ? 'selected' : ''}>${v}</option>`).join('')}</select><button type="button" class="icon-btn danger" data-rxdel>✕</button></div>`;
    const read = () => {
      const v = f => (($(`[data-f="${f}"]`, pane) || {}).value || '').trim(), it = { id: edit ? edit.id : undefined };
      if (subj === 'soc') Object.assign(it, { house: v('house'), from: v('from'), msg: v('msg'), opts: [v('o0'), v('o1'), v('o2')], scold: v('scold') });
      if (subj === 'mor') Object.assign(it, { char_id: v('char_id') || null, line: v('line'), opts: [v('o0'), v('o1'), v('o2')], react: [v('r0'), v('r1'), v('r2')] });
      if (subj === 'art') Object.assign(it, { char: v('char'), handle: v('handle'), ago: v('ago'), img: v('img'), sticker: v('sticker'),
        reactions: $$('.lq-rr', pane).map(r => [0, 1, 2].map(k => $(`[data-rx="${k}"]`, r).value.trim()).concat('')).filter(x => x[1]) });
      return it;
    };
    const check = it => {
      if (subj !== 'art' && it.opts.some(x => !x)) return '정답 하나 · 오답 둘을 모두 써 주세요.';
      if (subj === 'soc' && !it.msg) return '문자 내용을 써 주세요.';
      if (subj === 'mor' && !it.line) return '부탁 대사를 써 주세요.';
      if (subj === 'art' && !/^https?:\/\//.test(it.img)) return '셀피 이미지 주소는 https:// 로 시작해야 해요.';
      if (subj === 'art' && (it.reactions.length < 2 || it.reactions.length > 8)) return '반응은 2 ~ 8개 써 주세요.';
      return '';
    };
    const sum = it => subj === 'soc' ? `<b>${esc(it.from || '어른')}</b><span>${esc(it.msg)}</span><span class="lq-a">✔ ${esc((it.opts || [])[0] || '')}</span>`
      : subj === 'mor' ? `<b>${it.char_id ? esc(cname(it.char_id)) : '✦ 공통'}</b><span>${esc(it.line)}</span><span class="lq-a">✔ ${esc((it.opts || [])[0] || '')}</span>`
      : `<b>${esc(it.char || '?')}</b><span>${esc(it.sticker || it.handle || '')}</span><span class="lq-a">반응 ${(it.reactions || []).length}개 · 대박 ${(it.reactions || []).filter(x => x[2] === '대박').length}</span>`;
    const groups = subj === 'soc' ? HOUSES.map(h => [h, rows.filter(r => r.house === h)])
      : subj === 'mor' ? [['✦ 공통', rows.filter(r => !r.char_id)]].concat([...new Set(rows.filter(r => r.char_id).map(r => r.char_id))].map(id => [cname(id), rows.filter(r => r.char_id === id)]))
      : [['스토리', rows]];
    const draw = () => {
      pane.innerHTML = `<section class="adm-card lq-form"><header><b>${edit ? '✎ 고치는 중' : '✦ 새로 쓰기'}</b></header><p class="hint-text">${HELP[subj]}</p>
          ${form(edit)}
          <div class="modal-foot">${edit ? '<button class="btn ghost" id="lq-cancel">새로 쓰기로</button>' : ''}<button class="btn" id="lq-save">${edit ? '고친 내용 저장' : '추가하기'}</button></div></section>
        ${subj === 'art' && !rows.length && (window.INSTA_STORIES || []).length ? `<section class="adm-card" style="margin-top:16px"><header><b>예시 스토리</b><span class="label">lesson-insta.js 에 있던 예시 ${window.INSTA_STORIES.length}개를 여기로 가져올 수 있어요</span></header><div class="modal-foot" style="margin-top:0"><button class="btn ghost" id="lq-import">예시 가져오기</button></div></section>` : ''}
        ${groups.map(([g, list]) => `<section class="adm-card" style="margin-top:16px"><header><b>${esc(g)}</b><span class="label">${list.length}개${subj === 'soc' && list.length < 5 ? ' · 5개 이상 있으면 좋아요' : ''}</span></header>
          <ul class="adm-list lq-list">${list.map(it => `<li data-id="${esc(it.id)}">${sum(it)}<button class="icon-btn" data-ed>고치기</button><button class="icon-btn danger" data-del>지우기</button></li>`).join('') || '<li class="dim">아직 없어요.</li>'}</ul></section>`).join('')}`;
      $('#lq-save').onclick = async () => {
        const it = read(), bad = check(it); if (bad) return toast(bad, 'err');
        try { await Store.lessonItemSave(subj, it); toast(edit ? '고쳤어요' : '추가했어요'); rows = await Store.lessonItems(subj); refresh(); edit = null; draw(); }
        catch (e) { toast(e.message, 'err'); }
      };
      if ($('#lq-cancel')) $('#lq-cancel').onclick = () => { edit = null; draw(); };
      if ($('#lq-addrx')) $('#lq-addrx').onclick = () => { if ($$('.lq-rr', pane).length >= 8) return toast('반응은 8개까지예요.', 'err'); $('#lq-rx').insertAdjacentHTML('beforeend', rxRow(['', '', '무난', ''])); };
      pane.onclick = async e => {
        if (e.target.closest('[data-rxdel]')) { e.target.closest('.lq-rr').remove(); return; }
        const li = e.target.closest('li[data-id]'); if (!li) return;
        const it = rows.find(r => r.id === li.dataset.id); if (!it) return;
        if (e.target.closest('[data-ed]')) { edit = it; draw(); window.scrollTo({ top: pane.offsetTop - 80, behavior: 'smooth' }); }
        if (e.target.closest('[data-del]')) {
          if (!confirm('이 문제를 지울까요?')) return;
          try { await Store.lessonItemDel(subj, it.id); rows = rows.filter(r => r !== it); refresh(); if (edit === it) edit = null; draw(); toast('지웠어요'); } catch (ex) { toast(ex.message, 'err'); }
        }
      };
      if ($('#lq-import')) $('#lq-import').onclick = async () => {
        try { for (const s of window.INSTA_STORIES) await Store.lessonItemSave('art', { char: s.char, handle: s.handle, ago: s.ago, img: s.img, sticker: s.sticker, reactions: s.reactions }); rows = await Store.lessonItems('art'); refresh(); draw(); toast('예시를 가져왔어요'); }
        catch (ex) { toast(ex.message, 'err'); }
      };
    };
    const refresh = () => groups.splice(0, groups.length, ...(subj === 'soc' ? HOUSES.map(h => [h, rows.filter(r => r.house === h)])
      : subj === 'mor' ? [['✦ 공통', rows.filter(r => !r.char_id)]].concat([...new Set(rows.filter(r => r.char_id).map(r => r.char_id))].map(id => [cname(id), rows.filter(r => r.char_id === id)]))
      : [['스토리', rows]]));
    draw();
  }

  const TABS = { review, join, site, period, members: () => membersTab(), coin: coinTab, shop: shopTab, banner: bannerTab, rptA, rptB,
    play: playTab, lq_today: lessonToday, lq_soc: () => lessonQ('soc'), lq_mor: () => lessonQ('mor'), lq_art: () => lessonQ('art'), stock: stockTab };
  joinBadge();
  /* 큰 메뉴 4개 → 안에 작은 탭 */
  const GROUPS = {
    char: [['review', '심사'], ['period', '등록 · 수정 기간']],
    member: [['members', '회원 · 지갑'], ['join', '가입 신청'], ['rptB', '홈페이지 디자인'], ['rptA', '회원 기록']],
    coin: [['coin', '지급']],
    shop: [['shop', '물건 · 구매 · 선물 기록']],
    play: [['play', '열기 · 닫기 · 스탯'], ['lq_today', '오늘 수업 기록'], ['lq_soc', '사회 문자'], ['lq_mor', '도덕심 부탁'], ['lq_art', '미술 스토리'], ['stock', '삼사라 증권']],
    site: [['site', '설정 · BGM'], ['banner', '메인 배너']]
  };
  const openTab = t => {
    $$('#sub button').forEach(x => x.classList.toggle('on', x.dataset.s === t));
    const np = document.createElement('div'); np.id = 'pane'; curPane.replaceWith(np); curPane = np;
    TABS[t]();
  };
  if (!ADMIN) { GROUPS.char = [['review', '심사 대기']]; GROUPS.member = [['members', '회원 정보'], ['rptB', '홈페이지 디자인']]; }
  const openGroup = g => {
    $$('.adm-tabs button').forEach(x => x.classList.toggle('on', x.dataset.g === g));
    const subs = GROUPS[g];
    $('#sub').innerHTML = subs.length > 1 ? subs.map(([k, l]) => `<button data-s="${k}">${l}${k === 'join' ? ' <i id="join-n2" class="cnt" hidden></i>' : ''}</button>`).join('') : '';
    $('#sub').hidden = subs.length < 2;
    $$('#sub button').forEach(b => b.onclick = () => openTab(b.dataset.s));
    openTab(subs[0][0]); joinBadge();
  };
  $$('.adm-tabs button').forEach(b => b.onclick = () => openGroup(b.dataset.g));
  openGroup('char');
});
</script>
</body>
</html>
