  background: radial-gradient(1.2px 1.2px at 8% 25%, #fff, transparent), radial-gradient(1px 1px at 22% 78%, #fff, transparent), radial-gradient(1.4px 1.4px at 37% 18%, #ffe9a8, transparent), radial-gradient(1px 1px at 51% 70%, #fff, transparent), radial-gradient(1.3px 1.3px at 66% 30%, #ffd6e4, transparent), radial-gradient(1px 1px at 79% 82%, #fff, transparent), radial-gradient(1.4px 1.4px at 92% 22%, #cdeaff, transparent); }

.sign-in .g { color: #ff9dbd; text-shadow: 0 0 5px rgba(255,90,150,.45); } .sign-in .b { color: #8dcfff; text-shadow: 0 0 5px rgba(80,170,255,.45); }

  .skh h1 { font-size: 26px; } .eb { font-size: 9.5px; letter-spacing: .16em; }
  .nws-hd { flex-wrap: wrap; } .nws-hd small { flex-basis: 100%; margin: 2px 0 0; } }

/* 지갑 */

.wal-in { font-variant-numeric: tabular-nums; pointer-events: auto; background: rgba(255,255,255,.96) !important; backdrop-filter: blur(10px); box-shadow: 0 6px 24px -10px rgba(70,100,130,.3); max-width: 740px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 16px; color: var(--tx); }

<script>
App.ready.then(async user => {
  if (!user) return;
  const BASE = 1000, SLOTS = 30;
  const fmt = n => Math.round(n).toLocaleString('ko-KR');
  const pct = (a, b) => (a / b - 1) * 100;
  const cls = v => v > .05 ? 'up' : v < -.05 ? 'dn' : 'fl';
  const sign = v => (v > 0 ? '+' : '') + Number(v).toFixed(1) + '%';
  const arrow = v => v > .05 ? '▲' : v < -.05 ? '▼' : '';
  const head = (u, c = '') => u ? headHTML(u, c) : `<img class="${c}" alt="">`;
  const ago = t => { const m = Math.floor((Date.now() - Date.parse(t)) / 60000); return m < 1 ? '방금' : m < 60 ? m + '분 전' : Math.floor(m / 60) + '시간 전'; };

  // 장중 차트: 시작가 1,000 점선 기준 · 최근 30번 (거래가 적으면 앞은 1,000 그대로)
  const series = h => { h = (h || []).slice(-SLOTS); return Array(SLOTS + 1 - h.length).fill(BASE).concat(h); };
  const scale = (pts, ht, top, bot) => {
    let lo = Math.min(BASE, ...pts), hi = Math.max(BASE, ...pts);
    const min = BASE * .04; if (hi - lo < min) { const m = (hi + lo) / 2; lo = m - min / 2; hi = m + min / 2; }
    const pad = (hi - lo) * .1; lo -= pad; hi += pad;
    return v => top + (1 - (v - lo) / (hi - lo)) * (ht - top - bot);
  };
  const paths = (pts, w, y, bottom) => {
    const n = pts.length - 1, X = i => i / n * w;
    const line = pts.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
    return { line, area: `${line}L${w},${bottom}L0,${bottom}Z`, lx: w, ly: y(pts[n]) };
  };
  const mini = (h, up) => {
    const w = 84, ht = 34, pts = series(h), y = scale(pts, ht, 3, 3), p = paths(pts, w, y, ht), c = up ? 'up' : 'dn';
    return `<svg class="mini" viewBox="0 0 ${w} ${ht}" preserveAspectRatio="none"><line class="ch-base" x1="0" x2="${w}" y1="${y(BASE).toFixed(1)}" y2="${y(BASE).toFixed(1)}"/>
      <path d="${p.area}" fill="url(#g${up ? 'u' : 'd'})"/><path class="ch-line" d="${p.line}" stroke="var(--${c})"/></svg>`;
  };
  const big = (h, up) => {
    const w = 440, ht = 160, pts = series(h), y = scale(pts, ht, 12, 18), p = paths(pts, w - 12, y, ht - 18), c = up ? 'up' : 'dn', yb = y(BASE);
    const grid = [0, 1, 2, 3].map(i => { const yy = 12 + i * (ht - 30) / 3; return `<line class="ch-grid" x1="0" x2="${w}" y1="${yy}" y2="${yy}"/>`; }).join('');
    return `<svg class="tr-big" viewBox="0 0 ${w} ${ht}">${grid}
      <line class="ch-base" x1="0" x2="${w}" y1="${yb.toFixed(1)}" y2="${yb.toFixed(1)}"/>
      <path d="${p.area}" fill="url(#g${up ? 'u' : 'd'})"/><path class="ch-line" d="${p.line}" stroke="var(--${c})" style="stroke-width:2.2"/>
      <circle cx="${p.lx}" cy="${p.ly.toFixed(1)}" r="8" fill="var(--${c})" opacity=".18"/><circle cx="${p.lx}" cy="${p.ly.toFixed(1)}" r="4" fill="#fff" stroke="var(--${c})" stroke-width="2.2"/>
      <text class="ch-lab" x="2" y="${ht - 4}">최근 30번 · 점선은 시작가 ${fmt(BASE)}</text></svg>`;
  };

  const sx = $('#sx'), wal = $('#wal'), trb = $('#trb');
  let st = null, openId = null, qty = 1, lastLed = '', hits = {}, sub = null, cdT = null, refetching = false, moreNews = false, seenNews = '';

  // 대량 매수: 그 종목 아이돌 전광판이 화면 가운데에 6초 동안 (누가 샀는지는 안 나와요)
  const bf = $('#bf'); let lastBig = null, bfT = null;
  const ICON = {
    pause: '<svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/></svg>',
    next: '<svg viewBox="0 0 24 24"><path d="M5 4l11 8-11 8z"/><rect x="17" y="4" width="3" height="16" rx="1"/></svg>',
    vol: '<svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M15 8a5 5 0 010 8M17.5 5.5a8.5 8.5 0 010 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    cc: '<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><rect x="5" y="13" width="6" height="2" fill="currentColor"/><rect x="13" y="13" width="6" height="2" fill="currentColor"/></svg>',
    set: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>',
    full: '<svg viewBox="0 0 24 24"><path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>',
    find: '<svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M15 15l6 6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>' };
  const showBig = b => {
    if (!b || bf.classList.contains('on')) return;
    const s = live().find(x => x.id === b.id) || {}, p = s.p || 0, r = p ? pct(p, BASE) : 0, rnd = (a, z) => a + Math.random() * (z - a);
    const SPK = ['#ffb3cf', '#c9b8ff', '#a8d8ff', '#ffd98a', '#ffc2e0'];
    // 반짝이: 카드를 4 × 3 칸으로 나눠 칸마다 하나씩 (한쪽에 몰리지 않게) + 몇 개 더
    const cells = []; for (let r2 = 0; r2 < 3; r2++) for (let c2 = 0; c2 < 4; c2++) cells.push([c2 * 25 + rnd(3, 22), r2 * 33 + rnd(4, 28)]);
    const fx = 'fx' in b ? b.fx : [...String(b.at || '')].reduce((a, ch) => a + ch.charCodeAt(0), 0) % 2 === 1;   // 두 디자인 중 하나 (화려한 쪽 fx)
    for (let k = 0; k < 6; k++) cells.push([rnd(4, 96), rnd(5, 92)]);
    const hearts = Array.from({ length: fx ? 12 : 0 }, () => `<i class="bf-heart" style="left:${rnd(4, 96)}%;font-size:${rnd(1.6, 3.2)}cqw;animation-duration:${rnd(3.4, 5.4)}s;animation-delay:-${rnd(0, 5)}s;color:${['#ff9dbd', '#ffc4d8', '#fff', '#ff7aa6'][Math.floor(Math.random() * 4)]}">♥</i>`).join('');

    const stars = cells.map(([x, y]) => { const s = rnd(1.4, 3.4), c = SPK[Math.floor(Math.random() * SPK.length)];
      return `<svg class="bf-star" viewBox="0 0 24 24" style="left:${x}%;top:${y}%;width:${s}cqw;height:${s}cqw;color:${c};animation-duration:${rnd(1.8, 3.2)}s;animation-delay:-${rnd(0, 3)}s"><path d="M12 0C13 7 17 11 24 12C17 13 13 17 12 24C11 17 7 13 0 12C7 11 11 7 12 0Z" fill="currentColor"/></svg>`; }).join('');
    const ribs = Array.from({ length: 9 }, () => `<i class="bf-rib" style="left:${rnd(3, 72)}%;background:${['#e8c36a', '#d9b25a', '#f2d78f'][Math.floor(Math.random() * 3)]};animation-duration:${rnd(3, 4.6)}s;animation-delay:${rnd(0, 1.4)}s"></i>`).join('');
    const tk = `<span class="s">✦</span><span>대량 매수</span><span class="s">✦</span><span>${esc(b.n)} <span class="p">${p ? fmt(p) : ''} ${p ? sign(r) : ''}</span></span><span class="s">✦</span><span>서문의 아이돌이자 큰 별</span><span class="s">✦</span><span>빼빼로데이를 축하해 사랑해!</span>`;
    bf.innerHTML = fx ? `<div class="bf-card"><div class="bs">
        <div class="bs-face">${head(b.h)}</div>
        <div class="bs-top"><span class="bs-live"><i></i>LIVE</span><span>삼사라 증권 三娑罗證券</span><span class="sp"></span><span>SEOMUN STAGE</span></div>
        <div class="bs-l"><div class="bs-cap">SEOMUN IDOL</div><p class="bs-nm">${esc(b.n)}</p><p class="bs-sb">서문의 아이돌이자 큰 별</p><div class="bs-ln"></div><p class="bs-ms">빼빼로데이를 축하해<br>사랑해!</p></div>
        <div class="bs-r"><small>NOW</small><b>${p ? fmt(p) : '-'}</b>${p ? `<span class="bs-chg ${r < 0 ? 'dn' : ''}">${sign(r)}</span>` : ''}<span class="bs-bb">BIG BUY</span><span class="bs-day">11.11 HAPPY PEPERO DAY</span></div>
        <div class="bs-tk"><div class="bs-tk-in">${tk}${tk}${tk}${tk}</div></div>
      </div>${hearts}</div>` : `<div class="bf-card">
      <div class="bv">
        <div class="bv-face">${head(b.h)}</div><div class="bv-fade"></div>
        <span class="bv-ic"><i>◎</i>♛</span>
        <b class="bv-big">11.11<small>th</small></b><span class="bv-ann">HAPPY PEPERO DAY</span>
        <b class="bv-nm">${esc(b.n)}</b><span class="bv-sub">서문의 아이돌이자 큰 별<span class="bv-tag">BIG BUY</span></span><span class="bv-ms">빼빼로데이를 축하해 사랑해!</span>
        <span class="bv-plus">+++</span>
        <div class="bv-srch">${ICON.find}삼사라 증권 &nbsp;${esc(b.n)}</div>
        <div class="bv-bar"><i></i></div>
        <div class="bv-ctl">${ICON.pause}${ICON.next}${ICON.vol}<span>11:11 / 11:11</span><span class="sp"></span>${ICON.cc}${ICON.set}${ICON.full}</div>
      </div>
      <div class="bv-ft"><span>삼사라 증권</span><b>三娑罗證券</b></div>
      <div class="bp">
        <div class="bp-cr">♛</div>
        <p class="bp-hp">Happy Pepero Day</p>
        <p class="bp-nm">${esc(b.n)}</p>
        <p class="bp-sb">서문의 아이돌이자 큰 별</p>
        <p class="bp-dm">◆◆◆</p>
        <p class="bp-ms">빼빼로데이를 축하해<br>사랑해!</p>
        <p class="bp-px">현재가 <b>${p ? fmt(p) : '-'}</b>${p ? ` <span class="${cls(r)}">${sign(r)}</span>` : ''}</p>
        <div class="bp-bx"><b>삼사라 증권 대량 매수</b>방금 이 종목에 큰 매수가 들어왔어요</div>
        <p class="bp-fp">· 누가 샀는지는 공개되지 않아요<br>· 화면을 누르면 닫혀요</p>
      </div>${stars}</div>`;
    bf.classList.remove('out'); bf.classList.add('on');
    clearTimeout(bfT); bfT = setTimeout(hideBig, 6500);
  };
  const hideBig = () => { if (!bf.classList.contains('on')) return; bf.classList.add('out'); setTimeout(() => { bf.classList.remove('on', 'out'); bf.innerHTML = ''; }, 480); };
  bf.addEventListener('click', () => { clearTimeout(bfT); hideBig(); });
  const checkBig = () => { const b = board().big; if (b && b.at !== lastBig) { const first = lastBig === null; lastBig = b.at; if (!first) showBig(b); } else if (lastBig === null) lastBig = (b && b.at) || ''; };

  let skew = 0, lastFetch = 0;   // skew: 서버 시계 - 내 시계 (내 시계가 틀려도 정각에 한 번만 받게)
  const now = () => Date.now() + skew;
  const load = async () => { lastFetch = Date.now(); const before = {}; ((st && st.board && st.board.live) || []).forEach(s => { before[s.id] = s.p; }); try { st = await Store.stockView(); if (st && st.now) skew = Date.parse(st.now) - Date.now(); ((st.board && st.board.live) || []).forEach(s => { if (before[s.id] && before[s.id] !== s.p) hits[s.id] = s.p > before[s.id] ? 'up' : 'dn'; }); } catch (e) { sx.innerHTML = `<p class="shut gl">${esc(e.message || e)}</p>`; return; } draw(); checkBig(); };
  const board = () => (st && st.board) || {};
  const live = () => board().live || [];
  const news = () => board().news || [];
  const stockOf = id => live().find(s => s.id === id) || ((st.me && st.me.hold) || []).map(h => ({ id: h.id, n: h.n, h: h.h, c: h.c, p: h.p, hist: [], off: true })).find(s => s.id === id);
  const priceOf = id => { const s = live().find(x => x.id === id); return s ? s.p : (((st.me && st.me.hold) || []).find(h => h.id === id) || {}).p || 0; };
  const soon = n => news().length && n.at === news()[0].at;   // 방금 들어온 소식 (반짝이기만)

  const draw = () => {
    const b = board();
    if (!b.on) { wal.hidden = true; return drawShut(b); }
    if (!st.me) { wal.hidden = true; return drawPick(); }
    sx.innerHTML = `
      <header class="skh gl"><span class="eb">Samsara Securities ✦ 三娑罗證券</span><h1>삼사라 증권</h1><p>마음에 드는 캐릭터에게 투자해 보세요</p>
        <div class="clk"><div><i></i><span>시세 반영</span><b id="cdu">--:--</b></div><div><i></i><span>다음 소식</span><b id="cdn">--:--</b></div><div><i></i><span>종목 교체</span><b id="cdr">--:--</b></div></div></header>
      <section class="nws gl"><div class="nws-hd"><b class="ttl pk">NEWS</b><span class="spk">✦✦✦</span><span class="lv">LIVE</span><small>10분마다 새 소식이 들어와요</small></div>
        <div class="sign"><i class="sign-st"></i><i class="sign-st"></i><div class="sign-in" id="sign"></div><span class="sign-fx">★ NEWS FLASH</span></div></section>
      <div class="led" id="led"></div>
      <section class="brd gl"><div class="brd-hd"><b class="ttl">STOCKS</b><span class="spk">✦✦✦</span><b>이번 시간 종목</b><small>현재가 · 시작가 대비</small></div><div id="lst"></div></section>
      <div id="mine"></div>`;
    drawLive(); cd();
  };
  const drawNews = () => {
    const N = news();
    const line = N.map(n => `<span class="s">✦</span><span class="${n.g ? 'g' : 'b'}">${n.g ? '▲ 호재' : '▼ 악재'} ${esc(n.n)} ${esc(n.t)}</span>`).join('') || '<span>곧 첫 소식이 들어와요</span>';
    $('#sign').innerHTML = line + line;
    { const el = $('#sign'); el.style.animationDuration = Math.max(8, el.scrollWidth / 2 / 110) + 's'; }   // 글이 길어도 같은 빠르기 (1초에 110px)
    const key = N[0] ? N[0].at : '', fresh = seenNews && key !== seenNews; seenNews = key;
    if (fresh) { const s = $('.sign'); s.classList.remove('flash'); void s.offsetWidth; s.classList.add('flash'); }   // 새 소식이 오면 전광판이 반짝
  };
  const drawLive = () => {
    if (!$('#lst')) return draw();
    const b = board();
    drawNews();
    const L = live(), hot = [...L].sort((a, z) => z.p - a.p)[0], bw = (x, en, lab) => `<div class="gl"><span class="ttl">${en}</span><small>${lab}</small><div class="lw">${x ? `${head(x.h)}<div><b>${esc(x.n)}</b><span class="${cls(x.r)}">${sign(x.r)}</span></div>` : '<div><b class="fl">-</b></div>'}</div></div>`;
    const hr = hot ? pct(hot.p, BASE) : 0;
    $('#led').innerHTML = `<div class="gl"><span class="ttl pk">TOP</span><small>지금 1등 종목</small><div class="lw">${hot ? `${head(hot.h)}<div><b>${esc(hot.n)}</b><span class="${cls(hr)}">${fmt(hot.p)}</span></div>` : ''}</div></div>${bw(b.best, 'BEST', '최고 수익률')}${bw(b.worst, 'WORST', '최저 수익률')}`;
    const key = [hot && hot.id, b.best && b.best.n, b.worst && b.worst.n].join('|');
    if (lastLed && key !== lastLed) $$('#led > div').forEach(d => d.classList.add('flash'));
    lastLed = key;
    const row = (s, i, off) => { const ch = pct(s.p, BASE), th = s.top, mine = ((st.me.hold || []).find(h => h.id === s.id) || {}).q;
      const my = mine ? ` · <strong class="mine">내 주식 ${mine}주</strong>` : '';
      return `<div class="row ${off ? 'off' : ''} ${hits[s.id] ? 'hit-' + hits[s.id] : ''}" data-id="${esc(s.id)}">
        <span class="rk ${!off && i < 3 ? 'r' + (i + 1) : ''}">${off ? '·' : i + 1}</span>${head(s.h, 'av')}
        <div class="nm"><b>${esc(s.n)}</b><span>${off ? `종목에서 빠졌어요${my} · 팔 수만 있어요` : th ? `최대 주주 <i>${esc(th.n)}</i> ${th.q}주${my}` : `아직 주주 없음${my}`}</span></div>
        ${off ? '<span></span>' : mini(s.hist, ch >= 0)}
        <div class="px"><b class="${cls(ch)}">${fmt(s.p)}</b><span class="${cls(ch)}">${sign(ch)}</span></div></div>`; };
    $('#lst').innerHTML = [...L].sort((a, z) => z.p - a.p).map((s, i) => row(s, i)).join('');
    const offs = (st.me.hold || []).filter(h => !L.some(s => s.id === h.id));
    $('#mine').innerHTML = offs.length ? `<section class="brd gl"><div class="brd-hd"><b class="ttl">MY</b><span class="spk">✦</span><b>지난 시간 종목</b><small>내가 가진 주식 · 팔기만 돼요</small></div>${offs.map(h => row({ id: h.id, n: h.n, h: h.h, c: h.c, p: h.p }, 0, true)).join('')}</section>` : '';
    hits = {}; drawWallet(); drawTrade();
  };
  const drawWallet = () => {
    const me = st.me, ev = (me.hold || []).reduce((a, h) => a + h.q * priceOf(h.id), 0), r = pct(me.cash + ev, board().start || 100000);
    wal.hidden = false;
    wal.innerHTML = `<div class="wal-in gl"><div class="me">${head(me.head)}</div><div><small>남은 돈</small><b>${fmt(me.cash)}</b></div><div><small>주식 평가</small><b>${fmt(ev)}</b></div><div class="sp"></div>
      <div style="text-align:right"><small>${esc(me.name)} 수익률</small><b class="${cls(r)}">${sign(r)}</b></div></div>`;
  };
  const drawTrade = () => {
    if (!openId || !st.me) return;
    const s = stockOf(openId); if (!s) { closeTrade(); return; }
    const isLive = live().some(x => x.id === s.id), ch = pct(s.p, BASE), mine = ((st.me.hold || []).find(h => h.id === s.id) || {}).q || 0;
    const maxBuy = isLive && s.p > 0 ? Math.min(50, Math.floor(st.me.cash / s.p)) : 0, pts = series(s.hist);
    const nw = news().find(n => n.id === s.id);
    qty = Math.max(1, Math.min(qty, 50));
    $('#tr').innerHTML = `<div class="tr-grab"></div>
      <div class="tr-hd">${head(s.h)}<div><b>${esc(s.n)}</b><span>${!isLive ? '이번 시간 종목이 아니에요 · 팔 수만 있어요' : s.top ? `최대 주주 ${esc(s.top.n)} ${s.top.q}주` : '아직 주주 없음'}</span></div></div>
      <div class="tr-px"><b>${fmt(s.p)}</b><span class="${cls(ch)}">${arrow(ch)} ${fmt(Math.abs(s.p - BASE))} (${sign(ch)})<small>시작가 대비</small></span></div>
      ${isLive ? big(s.hist, ch >= 0) : '<div style="height:12px"></div>'}
      <div class="tr-info">${isLive ? `<div>최고<b class="up">${fmt(Math.max(...pts))}</b></div><div>최저<b class="dn">${fmt(Math.min(...pts))}</b></div>` : ''}<div>내 주식<b>${mine}주</b></div><div>살 수 있음<b>${maxBuy}주</b></div></div>
      <div class="qty"><button data-q="-1" aria-label="하나 빼기">−</button><div class="n">${qty}</div><button data-q="1" aria-label="하나 더">+</button><button class="q" data-q="10">+10</button></div>
      <div class="acts"><button class="b" ${maxBuy < qty ? 'disabled' : ''}>${qty}주 사기</button><button class="s" ${mine < qty ? 'disabled' : ''}>${qty}주 팔기</button></div>`;
  };
  const closeTrade = () => { openId = null; trb.classList.remove('on'); };
  const drawPick = async () => {
    let mine = [];
    try { mine = (await Store.myCharacters()).filter(c => c.published_at); } catch (e) {}
    sx.innerHTML = `<div class="pick gl"><span class="eb">Samsara Securities ✦ 三娑罗證券</span><h1>삼사라 증권</h1>
      <p>투자할 내 캐릭터를 골라 주세요<br><small style="color:var(--sub)">이벤트 동안 바꿀 수 없어요 · 이벤트 돈 ${fmt(board().start || 100000)}원으로 시작해요 · 끝나면 수익률 상위 10명 캐릭터에게 재력 +2</small></p>
      <ul>${mine.map(c => `<li><button data-join="${esc(c.id)}">${head(c.data.head || '')}${esc(c.data.name || '?')}</button></li>`).join('') || '<li class="fl">게시된 내 캐릭터가 있어야 참여할 수 있어요.</li>'}</ul></div>`;
  };
  const drawShut = b => {
    const rk = b.rank || [];
    sx.innerHTML = `<div class="shut gl"><span class="eb">Samsara Securities ✦ 三娑罗證券</span><h1>삼사라 증권</h1>
      ${rk.length ? `<p>장이 마감됐어요 · 최종 수익률 순위</p><ul class="fin">${rk.map((x, i) => `<li><em>${i + 1}</em>${head(x.h)}<b>${esc(x.n)}</b><span class="mono ${cls(x.r)}">${sign(x.r)}</span></li>`).join('')}</ul>` : '<p>지금은 장이 닫혀 있어요.</p>'}</div>`;
  };

  // 소식 · 종목 교체 · 마감 시각: 사람마다 1 ~ 15초 흩어서 기다렸다가 아직 아무도 안 바꿨으면 그때 한 번만 받아요
  const nextAt = () => { const b = board(); return Math.min(Date.parse(b.upd_at) || Infinity, Date.parse(b.news_at) || Infinity, Date.parse(b.round_end) || Infinity, Date.parse(b.ends) || Infinity); };
  const mmss = t => { const left = Math.max(0, Math.floor((t - now()) / 1000)); return String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0'); };
  const cd = () => {
    clearInterval(cdT);
    const tick = () => {
      const b = board(); if (!b.on || !$('#cdn')) return;
      $('#cdn').textContent = mmss(Date.parse(b.news_at)); if ($('#cdu')) $('#cdu').textContent = mmss(Date.parse(b.upd_at)); $('#cdr').textContent = mmss(Date.parse(b.round_end));
      // 화면이 숨겨져 있으면 안 받아요 (돌아오면 그때 한 번) · 방금 받았으면 20초는 쉬어요
      if (now() >= nextAt() && !refetching && !document.hidden && Date.now() - lastFetch > 20000) { refetching = true; setTimeout(async () => { if (now() >= nextAt() && !document.hidden) await load(); refetching = false; }, 1000 + Math.random() * 14000); }
    };
    tick(); cdT = setInterval(tick, 1000);
  };

  sx.addEventListener('click', async e => {
    const j = e.target.closest('[data-join]');
    if (j) { j.disabled = true; try { st = await Store.stockJoin(j.dataset.join); draw(); } catch (ex) { toast(ex.message, 'err'); j.disabled = false; } return; }
    const r = e.target.closest('.row'); if (!r || !st.me) return;
    openId = r.dataset.id; qty = 1; drawTrade(); trb.classList.add('on');
  });
  let busy = false;
  trb.addEventListener('click', async e => {
    if (e.target === trb) return closeTrade();
    const b = e.target.closest('button'); if (!b || busy) return;
    if (b.dataset.q) { qty += +b.dataset.q; drawTrade(); return; }
    const q = b.classList.contains('b') ? qty : b.classList.contains('s') ? -qty : 0; if (!q) return;
    busy = true; b.disabled = true;
    try { st = await Store.stockTrade(openId, q); checkBig(); drawLive(); toast(q > 0 ? `${qty}주 샀어요` : `${qty}주 팔았어요`); }
    catch (ex) { toast(ex.message, 'err'); if (/마감/.test(ex.message)) { closeTrade(); load(); } else drawTrade(); }
    busy = false;
  });

  await load();
  // 미리보기: stock.html?preview=big (깔끔) · ?preview=big2 (화려) → 지금 1등 종목으로 아이돌 전광판을 띄워 둬요 (누를 때까지)
  if (/[?&]preview=big/.test(location.search) && live().length) { const top = [...live()].sort((a, z) => z.p - a.p)[0]; showBig({ id: top.id, n: top.n, h: top.h, fx: /preview=big2/.test(location.search) }); clearTimeout(bfT); }
  // 전광판 한 줄만 실시간으로 와요 (누가 샀는지는 안 보내요 · 값이 바뀐 종목만 반짝)
  const onBoard = nb => {
    if (!st) return;
    const prev = board(), was = prev.on;
    (nb.live || []).forEach(s => { const o = (prev.live || []).find(x => x.id === s.id); if (o && o.p !== s.p) hits[s.id] = s.p > o.p ? 'up' : 'dn'; });
    st.board = nb; checkBig();
    if (!nb.on || was !== nb.on || !st.me) { if (!nb.on && was) load(); else draw(); return; }
    // 종목이 바뀌었거나 소식이 반영됐으면 내 주식 값도 새로 받아요
    if ((prev.live || []).map(s => s.id).join() !== (nb.live || []).map(s => s.id).join()) { load(); return; }
    const newsMoved = ((nb.news || [])[0] || {}).at !== ((prev.news || [])[0] || {}).at;
    if (newsMoved && (st.me.hold || []).some(h => !(nb.live || []).some(s => s.id === h.id))) { load(); return; }   // 지난 종목에 소식이 반영됐을 수도 있어요
    drawLive();
  };
  // 실시간 연결은 안 해요 (트래픽) · 10분마다 소식이 들어올 때 한 번씩 새로 받아요 · 내가 거래하면 그때도 새로
  // 숨겨 둔 탭은 안 받다가 돌아왔을 때 10분 넘게 지났으면 한 번만
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastFetch > 600000) load(); });
  addEventListener('pageshow', e => { if (e.persisted) location.reload(); });   // 뒤로 가기로 돌아오면 새로 (실시간 연결이 끊겨 있어서)
});
</script>
</body>
</html>
