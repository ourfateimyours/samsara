<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; media-src 'self' https: blob:; connect-src 'self' https: wss://*.supabase.co; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>입장 — 三娑罗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Nanum+Pen+Script&family=Noto+Serif+KR:wght@400;600&family=Song+Myung&family=Zhi+Mang+Xing&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  /* 입장 화면: 로고 없이 가운데 유리 창 하나 · 입장만 (가입 신청은 더 안 받아요) · 클래스는 gl- 로 시작 */
  .glass .gate-video { filter: brightness(.6) saturate(.95); transform: scale(1.04); animation: gDrift 30s ease-in-out infinite alternate; }
  @keyframes gDrift { to { transform: scale(1.1) translate(-1%, -1%); } }
  .glass::after { background: radial-gradient(ellipse 60% 70% at 50% 50%, rgba(5, 6, 15, .2), rgba(5, 6, 15, .78)); }
  .gate-petals { position: absolute; inset: 0; z-index: 0; display: none; pointer-events: none; }
  .gate-meteors { z-index: 0; }
  .glass .gate-inner { position: relative; z-index: 1; width: min(440px, 100%); display: flex; flex-direction: column; align-items: center; }
  .glass.day .gate-petals { display: block; }
  .glass.day .gate-video { background-image: url(assets/img/lobby-day.webp); filter: brightness(.95) saturate(1.05); }
  .glass.day::after { background: radial-gradient(ellipse 60% 70% at 50% 50%, rgba(10, 20, 45, .08), rgba(10, 20, 45, .55)); }

  /* 위: 한 줄 문구 + 가는 선과 마름모 */
  .gl-top { text-align: center; margin-bottom: 22px; animation: gIn .8s cubic-bezier(.2, .8, .2, 1) both; }
  .gl-top .gl-motto { padding-left: .9em; font: 600 13px 'Noto Serif KR', serif; letter-spacing: .9em; color: rgba(235, 240, 255, .82); text-shadow: 0 0 12px rgba(190, 205, 255, .55), 0 1px 6px rgba(0, 0, 0, .7); }
  .gl-top p { margin: 10px 0 0; font-size: 12.5px; letter-spacing: .04em; color: rgba(255, 255, 255, .66); text-shadow: 0 1px 8px rgba(0, 0, 0, .7); }
  .gl-rule { display: flex; align-items: center; gap: 10px; width: 220px; margin: 14px auto 0; }
  .gl-rule::before, .gl-rule::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .55)); }
  .gl-rule::after { transform: scaleX(-1); }
  .gl-rule i { width: 6px; height: 6px; rotate: 45deg; background: #fff; box-shadow: 0 0 10px #fff, 0 0 18px rgba(190, 205, 255, .8); }

  /* 유리 창 */
  .gl-panel { position: relative; width: 100%; box-sizing: border-box; padding: 34px 34px 26px; border-radius: 20px;
    background: linear-gradient(165deg, rgba(255, 255, 255, .13), rgba(170, 185, 255, .05) 42%, rgba(8, 10, 24, .42));
    -webkit-backdrop-filter: blur(22px) saturate(150%); backdrop-filter: blur(22px) saturate(150%);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16), inset 0 1px 0 rgba(255, 255, 255, .28), 0 40px 90px -30px rgba(0, 0, 0, .75);
    animation: gIn .8s .08s cubic-bezier(.2, .8, .2, 1) both; }
  .gl-panel::before { content: ""; position: absolute; left: 16%; right: 16%; top: 0; height: 1px; background: linear-gradient(90deg, transparent, #fff, transparent); box-shadow: 0 0 12px rgba(200, 212, 255, .9); }
  .gl-cn { position: absolute; width: 12px; height: 12px; border: 0 solid rgba(255, 255, 255, .55); pointer-events: none; }
  .gl-cn.a { left: 10px; top: 10px; border-width: 1px 0 0 1px; } .gl-cn.b { right: 10px; top: 10px; border-width: 1px 1px 0 0; }
  .gl-cn.c { left: 10px; bottom: 10px; border-width: 0 0 1px 1px; } .gl-cn.d { right: 10px; bottom: 10px; border-width: 0 1px 1px 0; }
  .glass.day .gl-panel { background: linear-gradient(165deg, rgba(20, 26, 48, .5), rgba(20, 26, 48, .3)); }

  .gl-sec { animation: secIn .45s ease both; }
  @keyframes secIn { from { opacity: 0; transform: translateY(6px); } }

  /* 칸: 상자 없이 밑줄만 · 누르면 밑줄이 빛나요 */
  .glass .field { margin-bottom: 18px; }
  .glass .field > span { display: block; margin-bottom: 2px; font-size: 11px; letter-spacing: .06em; color: rgba(255, 255, 255, .6); }
  .glass .field > span small { margin-left: 6px; color: rgba(255, 255, 255, .38); }
  .glass .field input { width: 100%; box-sizing: border-box; padding: 9px 2px 9px !important; background: none !important; border: 0 !important; border-bottom: 1px solid rgba(255, 255, 255, .24) !important; border-radius: 0 !important; color: #fff; font-size: 15px; letter-spacing: .03em; transition: border-color .3s, box-shadow .3s; box-shadow: none; }
  .glass .field input:focus { outline: none; border-bottom-color: #fff !important; box-shadow: 0 1px 0 0 #fff, 0 10px 16px -12px rgba(200, 212, 255, .9); background: none !important; }
  .glass .field input::placeholder { color: rgba(255, 255, 255, .3); }
  .glass .field input:-webkit-autofill { -webkit-text-fill-color: #fff; transition: background-color 9999s; }

  /* 버튼: 하얀 빛 알약 */
  /* 입장 버튼: 글자만 · 밑에 가는 빛 밑줄 (누를 곳 위에 올리면 밑줄이 길어지고 빛나요) */
  .gl-go { position: relative; display: block; margin: 14px auto 0; padding: 8px 22px 12px; border: 0; background: none; cursor: pointer; color: #fff;
    font: 600 16px 'Noto Serif KR', serif; letter-spacing: .5em; text-indent: .5em; text-shadow: 0 0 12px rgba(200, 212, 255, .55); transition: text-shadow .3s; }
  .gl-go::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: 0; height: 1px; background: linear-gradient(90deg, transparent, #fff, transparent); box-shadow: 0 0 8px rgba(200, 212, 255, .9); transition: left .35s ease, right .35s ease; }
  .gl-go:hover { text-shadow: 0 0 16px rgba(220, 228, 255, .95); }
  .gl-go:hover::after { left: 0; right: 0; }
  .gl-go:disabled { opacity: .5; cursor: default; }

  .glass .err-text { min-height: 0; margin: 0 0 6px; color: #ffb4b4; font-size: 12px; }
  .glass .err-text:empty { display: none; }
  .gl-note { margin: 18px 0 0; text-align: center; font-size: 11.5px; letter-spacing: .03em; color: rgba(255, 255, 255, .5); }
  .gl-mode { margin-top: 14px; text-align: center; font-size: 11px; color: rgba(255, 255, 255, .5); text-shadow: 0 1px 6px rgba(0, 0, 0, .7); }

  @keyframes gIn { from { opacity: 0; transform: translateY(14px); } }
  @media (max-width: 520px) { .gl-panel { padding: 24px 22px 22px; } }
  @media (prefers-reduced-motion: reduce) { .glass .gate-video, .gl-panel, .gl-top, .gl-sec { animation: none; } }
</style>
</head>
<body data-page="login" data-noheader data-nofooter class="gate-page">

<main class="gate-wrap glass">
  <div class="gate-video gate-photo" aria-hidden="true"></div>
  <div class="gate-petals" id="dayfx" aria-hidden="true"></div>
  <div class="gate-meteors" id="meteors" aria-hidden="true"></div>
  <div class="gate-inner">
    <header class="gl-top">
      <div class="gl-motto">삼사라</div>
      <div class="gl-rule" aria-hidden="true"><i></i></div>
      <p>승인된 기록자만 들어올 수 있는 기록소예요</p>
    </header>

    <div class="gl-panel">
      <i class="gl-cn a"></i><i class="gl-cn b"></i><i class="gl-cn c"></i><i class="gl-cn d"></i>

      <!-- 입장 -->
      <section class="gl-sec" id="login-card">
        <form id="lf" novalidate>
          <label class="field"><span>아이디</span><input name="id" maxlength="8" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
          <label class="field"><span>비밀번호</span><input name="pw" type="password" maxlength="8" autocomplete="current-password"></label>
          <p class="err-text" id="lerr" role="alert"></p>
          <button class="gl-go">입장</button>
        </form>
        <p class="gl-note">비밀번호를 잊었다면 관리자에게 문의해 주세요</p>
      </section>
    </div>
    <p class="gl-mode" id="mode-note"></p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/common.js"></script>
<script>
if (isDayTime()) { $('.gate-wrap').classList.add('day'); sakura($('#dayfx'), 13); }   // 낮이면 낮 배경 + 벚꽃 (?day=1 로 미리보기)
else { $('.gate-wrap').classList.add('night'); meteors($('#meteors')); }   // 밤이면 밤 배경 + 별똥별 (?day=0 으로 미리보기)
App.ready.then(async user => {
  const next = (() => {
    const n = qs('next') || '';
    return /^[a-z]+\.html(\?[\w=&%.-]*)?$/i.test(n) && !/^login/i.test(n) ? n : 'index.html';
  })();
  if (user) { location.replace(next); return; }
  if (Store.mode === 'demo') $('#mode-note').textContent = '지금은 데모 모드예요 계정과 글이 이 브라우저에만 저장됩니다';

  /* ---------- 입장 ---------- */
  const lf = $('#lf');
  lf.id.focus();
  if (qs('expired') === '1') $('#lerr').textContent = '5분 동안 활동이 없어 로그아웃됐어요. 다시 입장해 주세요.';
  lf.onsubmit = async e => {
    e.preventDefault(); $('#lerr').textContent = '';
    const btn = lf.querySelector('button'); btn.disabled = true;
    try {
      await Store.signIn(lf.id.value, lf.pw.value);
      location.replace(next);
    } catch (ex) { $('#lerr').textContent = ex.message; btn.disabled = false; }
  };

});
</script>
</body>
</html>
