<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; media-src 'self' https: blob:; connect-src 'self' https: wss://*.supabase.co; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>입장 — 三娑罗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Nanum+Pen+Script&family=Noto+Serif+KR:wght@400;600&family=Song+Myung&family=Yuji+Boku&family=Zhi+Mang+Xing&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  /* 입장 화면: 배경 그림 위에 투명한 유리 창 · 가입 신청을 받을 때만 창이 하나 더 생겨요 */
  .glass .gate-video { filter: brightness(.6) saturate(.95); transform: scale(1.04); animation: gDrift 30s ease-in-out infinite alternate; }
  @keyframes gDrift { to { transform: scale(1.1) translate(-1%, -1%); } }
  .glass::after { background: radial-gradient(ellipse 70% 70% at 50% 45%, rgba(5, 6, 15, .15), rgba(5, 6, 15, .75)); }
  .glass .gate-inner { width: min(780px, 100%); }
  .glass .gate-head { margin-bottom: 30px; }
  .glass .gate-head h1 { text-shadow: 0 0 30px rgba(255, 255, 255, .35), 0 4px 30px rgba(0, 0, 0, .6); }
  .glass .gate-head p { color: rgba(255, 255, 255, .72); text-shadow: 0 1px 8px rgba(0, 0, 0, .7); }
  .glass .gate-cards { display: flex; justify-content: center; align-items: flex-start; gap: 18px; }
  .glass .auth-card { width: 340px; max-width: 100%; padding: 30px 28px 24px; border: 1px solid rgba(255, 255, 255, .22); border-radius: 22px;
    background: linear-gradient(160deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, .04)); backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%);
    box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .25); }
  .glass .auth-card::before { display: none; }
  .glass #signup-card { width: 400px; }
  .glass #signup-card[hidden] { display: none; }
  .glass .auth-card .head { text-align: center; margin-bottom: 20px; }
  .glass .auth-card .eyebrow { color: rgba(255, 255, 255, .6); }
  .glass .auth-card h2 { color: #fff; }
  .glass .field > span { color: rgba(255, 255, 255, .7); }
  .glass .field input { background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .18); border-radius: 12px !important; color: #fff; padding: 12px 14px; transition: background .25s, border-color .25s, box-shadow .25s; }
  .glass .field input:focus { background: rgba(255, 255, 255, .14); border-color: rgba(255, 255, 255, .5); box-shadow: 0 0 0 3px rgba(255, 255, 255, .1); outline: none; }
  .glass .field input::placeholder { color: rgba(255, 255, 255, .45); }
  .glass #login-card .field > span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }   /* 입장 칸은 placeholder 만 (읽기 프로그램용 이름은 남겨요) */
  .glass .btn { border-radius: 12px !important; }
  .glass #login-card .btn { background: rgba(255, 255, 255, .9); color: #0b0c14; border-color: transparent; font-weight: 700; letter-spacing: .08em; }
  .glass #login-card .btn:hover { background: #fff; }
  .glass #signup-card .btn { background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .35); color: #fff; }
  .glass .chk { color: rgba(255, 255, 255, .7); }
  .glass .note-text { color: rgba(255, 255, 255, .55); }
  .glass .err-text { color: #ffb4b4; }
  .glass .auth-card { animation: gIn .7s cubic-bezier(.2, .8, .2, 1) both; }
  .glass #signup-card { animation-delay: .1s; }
  @keyframes gIn { from { opacity: 0; transform: translateY(16px) scale(.98); } }
  @media (max-width: 760px) { .glass .gate-cards { flex-direction: column; align-items: center; } .glass .auth-card, .glass #signup-card { width: 100%; max-width: 400px; } }
  /* 낮 (06~18시): 메인과 같은 낮 그림 + 벚꽃잎 · 창은 살짝 어둡게 해서 흰 글씨가 잘 보이게 */
  .gate-petals { position: absolute; inset: 0; z-index: 0; display: none; pointer-events: none; }   /* 배경 그림자 위 · 창 뒤 */
  .glass .gate-inner { position: relative; z-index: 1; }
  .glass.day .gate-petals { display: block; }
  .glass.day .gate-video { background-image: url(https://i.imgur.com/v8ZbESH.png); filter: brightness(.95) saturate(1.05); }
  .glass.day::after { background: radial-gradient(ellipse 70% 70% at 50% 45%, rgba(10, 20, 45, .05), rgba(10, 20, 45, .5)); }
  .glass.day .auth-card { background: linear-gradient(160deg, rgba(20, 26, 48, .42), rgba(20, 26, 48, .26)); }
  .glass.day .gate-head h1 { text-shadow: 0 2px 24px rgba(10, 20, 45, .55), 0 0 2px rgba(10, 20, 45, .4); }
  .glass.day .eyebrow, .glass.day .gate-head p, .glass.day .note-text { text-shadow: 0 1px 8px rgba(10, 20, 45, .8); }
  @media (prefers-reduced-motion: reduce) { .glass .gate-video, .glass .auth-card { animation: none; } }
</style>
</head>
<body data-page="login" data-noheader data-nofooter class="gate-page">

<main class="gate-wrap glass">
  <div class="gate-video gate-photo" aria-hidden="true"></div><!-- 배경: 메인과 같은 그림 (밤 assets/img/lobby-bg.webp · 06~18시엔 낮 그림) -->
  <div class="gate-petals" id="dayfx" aria-hidden="true"></div><!-- 낮에만 벚꽃잎 -->
  <div class="gate-inner">
    <header class="gate-head">
      <div class="eyebrow" id="motto"></div>
      <h1 id="gname"></h1>
      <p>승인된 기록자만 들어올 수 있는 기록소예요.</p>
    </header>

    <div class="gate-cards">
      <!-- 입장 -->
      <section class="auth-card" id="login-card">
        <div class="head"><div class="eyebrow">Enter</div><h2>입장</h2></div>
        <form id="lf" novalidate>
          <label class="field"><span>아이디</span><input name="id" maxlength="8" placeholder="아이디" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
          <label class="field"><span>비밀번호</span><input name="pw" type="password" maxlength="8" placeholder="비밀번호" autocomplete="current-password"></label>
          <label class="chk" style="margin:-4px 0 14px"><input type="checkbox" id="remember"> 아이디 저장</label>
          <p class="err-text" id="lerr" role="alert"></p>
          <button class="btn btn-block">입장 →</button>
        </form>
        <p class="note-text">비밀번호를 잊었다면 관리자에게 문의해 주세요.</p>
      </section>

      <!-- 가입 신청 -->
      <section class="auth-card" id="signup-card" hidden><!-- 가입 신청을 받을 때만 보여요 -->
        <div class="head"><div class="eyebrow">Join</div><h2>가입 신청</h2></div>
        <form id="sf" novalidate>
          <label class="field"><span>아이디 <small>영문 소문자·숫자·_ 4~8자</small></span>
            <input name="id" maxlength="8" autocomplete="username" autocapitalize="none" spellcheck="false"><small class="idchk" id="idchk"></small></label>
          <div class="row2">
            <label class="field"><span>비밀번호 <small>6~8자</small></span><input name="pw" type="password" maxlength="8" autocomplete="new-password"></label>
            <label class="field"><span>비밀번호 확인</span><input name="pw2" type="password" maxlength="8" autocomplete="new-password"></label>
          </div>
          <label class="field"><span>닉네임 <small>명부에 보이는 이름</small></span><input name="nickname" maxlength="20" autocomplete="nickname"></label>
          <label class="field"><span>이메일 <small>아무거나 적어도 돼요</small></span><input name="contact" maxlength="120" autocomplete="off"></label>
          <p class="err-text" id="serr" role="alert"></p>
          <button class="btn ghost btn-block" id="sbtn">가입 신청하기</button>
        </form>
        <div class="done" id="done" hidden>
          <div class="done-ic">✦</div>
          <h3>가입 신청 완료!</h3>
          <p>관리자가 승인하면 입장할 수 있어요.<br>승인 전에는 로그인이 되지 않아요.</p>
        </div>
      </section>
    </div>
    <p class="note-text" id="mode-note"></p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/common.js"></script>
<script>
if (isDayTime()) { $('.gate-wrap').classList.add('day'); sakura($('#dayfx'), 26); }   // 낮이면 낮 배경 + 벚꽃 (?day=1 로 미리보기)
App.ready.then(async user => {
  const next = (() => {
    const n = qs('next') || '';
    return /^[a-z]+\.html(\?[\w=&%.-]*)?$/i.test(n) && !/^login/i.test(n) ? n : 'index.html';
  })();
  if (user) { location.replace(next); return; }
  $('#motto').textContent = SITE_CONFIG.siteMotto || '';
  $('#gname').innerHTML = [...(SITE_CONFIG.siteName || '')].map((c, i) => `<span style="--i:${i}">${esc(c)}</span>`).join('');
  if (Store.mode === 'demo') $('#mode-note').textContent = '지금은 데모 모드예요. 계정과 글이 이 브라우저에만 저장됩니다.';

  /* ---------- 입장 ---------- */
  const lf = $('#lf'), KEY = 'naru:remember-id';
  try { const saved = localStorage.getItem(KEY); if (saved) { lf.id.value = saved; $('#remember').checked = true; lf.pw.focus(); } else lf.id.focus(); } catch (e) {}
  lf.onsubmit = async e => {
    e.preventDefault(); $('#lerr').textContent = '';
    const btn = lf.querySelector('button'); btn.disabled = true;
    try {
      await Store.signIn(lf.id.value, lf.pw.value);
      try { $('#remember').checked ? localStorage.setItem(KEY, lf.id.value.trim().toLowerCase()) : localStorage.removeItem(KEY); } catch (e) {}
      location.replace(next);
    } catch (ex) { $('#lerr').textContent = ex.message; btn.disabled = false; }
  };

  /* ---------- 가입 신청 ---------- */
  const sf = $('#sf'), chk = $('#idchk');
  let s = {}; try { s = await Store.settings(); } catch (e) {}
  if (s.signup_open === false) return;   // 가입 신청을 안 받을 땐 입장 창 하나만
  $('#signup-card').hidden = false;
  let t;
  const checkId = async () => {
    const v = sf.id.value.trim().toLowerCase(); sf.id.value = v;
    if (!v) { chk.textContent = ''; chk.className = 'idchk'; return; }
    try {
      Store.checkId(v);
      const ok = await Store.usernameAvailable(v);
      chk.textContent = ok ? '✓ 사용할 수 있는 아이디예요' : '✕ 이미 있는 아이디예요';
      chk.className = 'idchk ' + (ok ? 'ok' : 'no');
    } catch (ex) { chk.textContent = '✕ ' + ex.message; chk.className = 'idchk no'; }
  };
  if (sf.id) {
    sf.id.oninput = () => { clearTimeout(t); t = setTimeout(checkId, 350); };
    sf.onsubmit = async e => {
      e.preventDefault(); $('#serr').textContent = '';
      if (sf.pw.value !== sf.pw2.value) return $('#serr').textContent = '비밀번호가 서로 달라요.';
      const btn = $('#sbtn'); btn.disabled = true;
      try {
        const r = await Store.signUp(sf.id.value, sf.pw.value, sf.nickname.value, sf.contact.value);
        if (r.user) { toast('첫 관리자 계정이에요. 바로 입장해요!'); return location.replace(next); }
        sf.hidden = true; $('#done').hidden = false;
      } catch (ex) { $('#serr').textContent = ex.message; btn.disabled = false; }
    };
  }
  if (qs('mode') === 'signup' && sf.id) sf.id.focus();
});
</script>
</body>
</html>
