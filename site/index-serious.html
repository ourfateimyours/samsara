/* 버튼 아이콘 (assets/js/emblems.js) · 뒤의 팔괘 · 반짝이 */
$$('[data-emb]').forEach(el => {
  if (window.EMBLEM) el.insertAdjacentHTML('beforeend', EMBLEM[el.dataset.emb] || '');
  // 아이콘 뒤 효과: 은은한 빛무리 · 바닥 반사 · 마우스를 올리면 튀어나오는 반짝이 4개
  el.insertAdjacentHTML('afterbegin', '<i class="fx-glow" aria-hidden="true"></i><i class="fx-floor" aria-hidden="true"></i>');
  el.insertAdjacentHTML('beforeend', '<i class="fx-sp" aria-hidden="true"><b></b><b></b><b></b><b></b></i>');
});
/* 휴대폰: 왼쪽 버튼(출석 · 음악 · 관리)도 아래 메뉴 한 줄에 같이 놓아요 */
(function oneRow() {
  const mq = matchMedia('(max-width: 760px)'), side = $('.lb-side'), dock = $('.lb-dock');
  const sideBtns = [...side.children];
  const apply = () => { if (mq.matches) sideBtns.forEach(b => dock.appendChild(b)); else sideBtns.forEach(b => side.appendChild(b)); };
  apply(); mq.addEventListener ? mq.addEventListener('change', apply) : mq.addListener(apply);
})();
/* 별똥별 — 사진 속 방향(오른쪽 위 → 왼쪽 아래, 약 32°)으로 가끔 떨어져요 */
/* 낮 · 밤 배경: 06시~18시는 낮 그림(DAY_IMG), 나머지는 밤 그림(assets/img/lobby-bg.webp)
   낮에는 별똥별 · 반짝이를 쉬어요. 낮 그림 파일이 없으면 밤 그림 그대로 */
const DAY_FROM = 6, DAY_TO = 18, DAY_IMG = 'https://i.imgur.com/v8ZbESH.png';   // 낮 그림 주소 (바꾸면 낮 배경이 바뀌어요)
const DAY_FORCE = false;   // 미리보기용: true로 바꾸면 시간과 상관없이 항상 낮 화면
/* 낮에는 별똥별 대신 벚꽃잎: 화면 위에서 바람에 흩날리며 떨어져요 */
(function dayFx() {
  const box = $('#dayfx'); if (!box) return;
  const R = (a, b) => a + Math.random() * (b - a);
  box.innerHTML = Array.from({ length: 36 }, () => { const t = R(10, 18);
    return `<i style="left:${R(-5, 100).toFixed(1)}%;--y:${R(5, 90).toFixed(0)}%;--s:${R(13, 24).toFixed(1)}px;--dx:${R(40, 160).toFixed(0)}px;--t:${t.toFixed(1)}s;--f:${R(1.2, 2.6).toFixed(1)}s;animation-delay:-${R(0, t).toFixed(1)}s"><b></b></i>`; }).join('');
})();
const isDay = () => { if (DAY_FORCE) return true; const h = new Date().getHours(); return h >= DAY_FROM && h < DAY_TO; };
(function dayNight() {
  // 켜 둔 채로 낮 ↔ 밤이 바뀌면: 지금 화면이 서서히 흐려지면서 새 화면이 겹쳐 떠올라요 (크로스페이드 · 처음 들어올 때는 바로)
  let cur = null;
  const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const flip = day => { $('#lobby').classList.toggle('is-day', day); document.body.classList.toggle('lobby-day', day); cur = day; };   // 낮에는 화면 색도 밝은 테마로
  // 넘어가는 동안: 카메라 노출이 바뀌듯 지금 화면은 어두워지거나(밤) 밝게 바래고(낮), 새 화면이 부드럽게 내려앉아요
  const sweep = day => {
    if (cur === null || REDUCE) return flip(day);
    if (document.startViewTransition) { document.documentElement.dataset.dn = day ? 'day' : 'night'; return document.startViewTransition(() => flip(day)); }
    const lb = $('#lobby');   // 그 기능이 없는 브라우저: 살짝 흐려졌다가 바뀌고 다시 또렷하게
    lb.classList.add('dn-fade');
    setTimeout(() => { flip(day); lb.classList.remove('dn-fade'); }, 900);
  };
  const set = () => {
    if (!isDay()) { if (cur !== false) sweep(false); return; }
    if (cur === true) return;
    const im = new Image();
    im.onload = () => sweep(true);
    im.src = DAY_IMG;
  };
  set(); setInterval(set, 60e3);   // 1분마다 다시 확인 (켜 둔 채로 시간이 바뀌어도)
  window.lobbyDayNight = sweep;    // 미리보기용: 콘솔에서 lobbyDayNight(true / false)
})();
/* 서울시 재난관리 현황 (꾸밈용 · 진짜 데이터는 없어요)
   처음엔 날짜로 정해진 숫자, 누를 때마다 새로 무작위 · 숫자는 세어 올라가요 */
(function disasterBoard() {
  const box = $('#sd'); if (!box) return;
  const IC = {   // 흰 선 아이콘 (viewBox 24)
    eye: '<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3.2"/><path d="M12 8.8v-1.6M15.4 9.6l1-1"/>',
    blade: '<path d="M4 20 15.5 8.5M15.5 8.5l3-5 2 2-5 3M7 13l4 4M3 21l2-1"/>',
    shield: '<path d="M12 3 19.5 6v5.6c0 4.6-3.2 8-7.5 9.4-4.3-1.4-7.5-4.8-7.5-9.4V6L12 3Z"/><path d="M8.7 12.2 11 14.5l4.4-4.6"/>',
    search: '<circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5.5 5.5M8 8.8a3 3 0 0 1 2.4-1.3"/>',
    pin: '<path d="M12 21s-6.5-6.3-6.5-11.2a6.5 6.5 0 0 1 13 0C18.5 14.7 12 21 12 21Z"/><circle cx="12" cy="9.8" r="2.3"/>',
    warn: '<path d="M12 3.5 21.5 20h-19L12 3.5Z"/><path d="M12 10v4.5M12 17.2v.3"/>'
  };
  const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;
  const LV = [['관심', 'BLUE', 1], ['주의', 'YELLOW', 2], ['경계', 'ORANGE', 3], ['심각', 'RED', 4]];
  const GU = ['종로구', '중구', '용산구', '성동구', '광진구', '동대문구', '중랑구', '성북구', '강북구', '도봉구', '노원구', '은평구', '서대문구', '마포구', '양천구', '강서구', '구로구', '금천구', '영등포구', '동작구', '관악구', '서초구', '강남구', '송파구', '강동구'];
  const rng = seed => () => { seed = (seed + 0x6D2B79F5) >>> 0; let t = seed; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const daySeed = [...(Store.kstDay ? Store.kstDay() : new Date().toISOString().slice(0, 10))].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 11);
  const draw = (seed, anim) => {
    const r = rng(seed), I = (a, b) => a + Math.floor(r() * (b - a + 1));
    const lv = LV[Math.min(3, Math.floor(Math.pow(r(), 1.6) * 4))], stab = I(41, 98);
    const zones = [...GU].sort(() => r() - .5).slice(0, I(2, 3));
    const rows = [
      ['eye', '망량 발견', I(3, 48), '건', 'SIGHTED'],
      ['blade', '퇴치 완료', 0, '건', 'PURGED'],
      ['search', '실종 신고', I(0, 12), '명', 'MISSING'],
      ['shield', '결계 안정도', stab, '%', 'BARRIER']
    ];
    rows[1][2] = Math.max(0, rows[0][2] - I(0, 9));
    // 위: 경계 단계 카드 + 결계 안정도 동그란 게이지 (게임 로비의 '진행도' 원처럼)
    const C = 2 * Math.PI * 21, off = C * (1 - stab / 100);
    $('#sd-alert').innerHTML = `<div class="sd-lvbox lv${lv[2]}"><span class="sd-tag">ALERT</span>
        <span class="sd-lv">${svg('warn')}<b>${lv[0]}</b></span><small>LEVEL ${lv[2]} · ${lv[1]}</small>
        <span class="sd-steps">${LV.map(x => `<i class="${x[2] <= lv[2] ? 'on' : ''} lv${x[2]}"></i>`).join('')}</span></div>
      <div class="sd-ring" title="결계 안정도"><svg viewBox="0 0 50 50" aria-hidden="true"><circle cx="25" cy="25" r="21" class="bg"/><circle cx="25" cy="25" r="21" class="fg" style="stroke-dasharray:${C.toFixed(1)};stroke-dashoffset:${(anim ? C : off).toFixed(1)}" data-off="${off.toFixed(1)}"/></svg>
        <b><em data-n="${stab}">${anim ? 0 : stab}</em><u>%</u></b><small>BARRIER</small></div>`;
    // 아래: 망량 발견 · 퇴치 · 실종 (결계는 위 게이지로)

      .filter(r => r.ch && r.coins > 0).sort((a, b) => b.coins - a.coins);
    if (!top.length) return;
    // 1 · 2 · 3등 안에 같은 영전을 가진 사람이 3명 이상이면 순위를 매길 수 없으니 카드를 띄우지 않아요 (금액이 달라지면 다시 나와요)
    const same = {}; top.forEach(r => { same[r.coins] = (same[r.coins] || 0) + 1; });
    if (top.slice(0, 3).some(r => same[r.coins] >= 3)) return;
    top.splice(3);
    $('#holo').hidden = false;
    // 1 · 2 · 3 등 두상을 미리 받아 둬요 (넘길 때 로딩 없이)
    if (window.HoloCard && HoloCard.preload) HoloCard.preload(top.map(r => { const d = normChar(r.ch.data || {}); return d.head || charImage(r.ch.data || {}, r.ch.id); }));
    // 카드 문장: 별 + 초승달 + 연꽃잎 (왼쪽 반을 그리고 오른쪽은 뒤집어 붙여요)
    const half = `<path d="M34 30 C25 40 25 53 36 61 C31 51 31 40 34 30Z"/><path d="M27 41 C19 45 15 51 13 57 C20 53 24 48 27 41Z"/>
      <path d="M48 71 C38 61 22 58 9 61 C23 62 37 66 48 73Z"/><path d="M46 75 C36 75 26 78 19 83 C29 80 37 78 46 77Z"/><path d="M39 53 C36 58 36 63 40 67 C39 62 39 58 39 53Z"/>`;
    const LOGO = `<svg class="hc-logo" viewBox="0 0 100 106" aria-hidden="true" fill="currentColor">
      <path d="M50 1 L51.6 19 L63 21.5 L51.6 24 L50 45 L48.4 24 L37 21.5 L48.4 19Z"/>
      <path d="M36 43 A14 14 0 0 0 64 43 A12.5 11 0 0 1 36 43Z"/>${half}<g transform="translate(100 0) scale(-1 1)">${half}</g>
      <path d="M48 72 L50 82 L52 72Z"/><circle cx="50" cy="62" r="1.3"/><circle cx="50" cy="66" r="1.1"/>
      <path d="M50 85 L51 90 L56 91 L51 92 L50 98 L49 92 L44 91 L49 90Z"/><circle cx="50" cy="103" r="1.2"/></svg>`;
    const cardHTML = i => {
      const { b, coins, ch } = top[i], d = normChar(ch.data || {});
      const t = b.equip && b.equip.title && item(b.equip.title);
      const head = d.head, img = head || charImage(ch.data || {}, ch.id);   // 두상이 없으면 전신 그림의 윗부분을 두상처럼
      return `<a class="hc ${head ? '' : 'nohead'}" href="character.html?id=${encodeURIComponent(ch.id)}" style="--c:${esc(d.color)}" aria-label="${i + 1}위 ${esc(d.name)} · 영전 ${coins}">
        <span class="hc-bg"></span><span class="hc-sub" style="background-image:${cssUrl(img)}"></span>
        <span class="hc-laser"></span><span class="hc-star"></span><span class="hc-star b"></span><span class="hc-glare"></span>
        <span class="hc-txt"><span class="hc-rk">No.<b>${i + 1}</b></span><span class="hc-emb">${LOGO}</span>
          <span class="hc-bt">${t ? `<small>${esc(Store.titleText(t, b.equip))}</small>` : ''}<b>${esc(d.name || '?')}</b>
            <em><i></i>${coins.toLocaleString()}<span>靈錢</span></em></span></span></a>`;
    };
    let cur = 0, busy = false;
    $('#hl-pages').innerHTML = top.map((_, i) => `<button type="button" data-pg="${i}">${i + 1}</button>`).join('');
    const show = (i, flip) => {
      cur = (i + top.length) % top.length;
      const put = () => {
        $('#hl-stage').innerHTML = cardHTML(cur);
        $('#hl-no').textContent = `${pad2(cur + 1)} / ${pad2(top.length)}`;
        $$('#hl-pages button').forEach(x => x.classList.toggle('on', +x.dataset.pg === cur));
        const hc = $('#hl-stage .hc'), d = normChar(top[cur].ch.data || {});
        // WebGL 홀로그램 셰이더 (assets/js/holocard.js) · 안 되면 CSS 카드로
        if (!(window.HoloCard && HoloCard.attach(hc, { img: d.head || charImage(top[cur].ch.data || {}, top[cur].ch.id), color: d.color, nohead: !d.head }))) bindTilt(hc);
      };
      if (!flip || REDUCED) return put();
      if (busy) return; busy = true;
      const st = $('#hl-stage'); st.classList.add('out');
      setTimeout(() => { put(); st.classList.remove('out'); st.classList.add('in'); setTimeout(() => { st.classList.remove('in'); busy = false; }, 380); }, 260);
    };
    // 마우스를 따라 기울고(--px · --py: -1 ~ 1), 층마다 깊이가 달라요
    const bindTilt = c => {
      if (!c) return;
      c.addEventListener('pointermove', e => {
        const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 2 - 1, y = (e.clientY - r.top) / r.height * 2 - 1;
        c.classList.add('on'); c.style.setProperty('--px', x.toFixed(3)); c.style.setProperty('--py', y.toFixed(3));
      });
      c.addEventListener('pointerleave', () => { c.classList.remove('on'); c.style.removeProperty('--px'); c.style.removeProperty('--py'); });
    };
    $('#hl-pages').onclick = e => { const b = e.target.closest('[data-pg]'); if (b && +b.dataset.pg !== cur) show(+b.dataset.pg, true); };
    if (top.length < 2) $('#hl-pages').hidden = true;
    show(0);
  })();
  /* 배너 1: 등록 · 수정 기간 */
  const cw = Store.windowState(s, 'create'), ew = Store.windowState(s, 'edit');
  const until = iso => { const ms = Date.parse(iso) - Date.now(); return isNaN(ms) ? '' : `D-${Math.max(0, Math.ceil(ms / 864e5))}`; };
  const md = iso => { const d = new Date(iso); return isNaN(d) ? '' : `${d.getMonth() + 1}.${pad2(d.getDate())}까지`; };
  let b1;
  if (cw.open) b1 = { tag: 'OPEN', when: cw.until ? md(cw.until) : '상시', t: '인물 등록 기간', p: cw.until ? `${until(cw.until)} · 새 인물을 봉인해 주세요` : '언제든 새 인물을 봉인할 수 있어요', href: 'characters.html?new=1' };
  else if (ew.open) b1 = null;   // 수정 기간 안내는 메인에 띄우지 않아요
  else b1 = { tag: 'NOTICE', when: cw.next ? md(cw.next).replace('까지', '부터') : '', t: '등록 기간이 아니에요', p: cw.next ? '다음 등록 기간을 기다려 주세요' : '작성본 저장은 언제든 할 수 있어요', href: 'characters.html?new=1' };
  const news = myNews(user.id);
  if (news.length) $('#book').classList.add('new');

  /* 오른쪽 위 배너: 관리자가 만든 배너(맨 앞) + 등록 기간 + 출석 */
  const custom = (Array.isArray(s.lobby_banners) ? s.lobby_banners : []).filter(b => b && (b.title || b.text));
  const slideHTML = [
    ...custom.map(b => lobbyBanner(b)),
    b1 ? `<a class="slide" href="${b1.href}"><span class="tag">${b1.tag}</span><span class="when">${esc(b1.when)}</span><b>${esc(b1.t)}</b><p>${esc(b1.p)}</p></a>` : '',
    checked
      ? `<a class="slide" href="attendance.html"><span class="tag">ATTEND</span><span class="when">출석 완료</span><b>오늘의 도장을 찍었어요</b><p>내일 또 와서 연속 출석을 이어 가세요</p></a>`
      : `<a class="slide" href="attendance.html"><span class="tag">ATTEND</span><span class="when">+${Store.ATTEND.week[0]}~${Store.ATTEND.week[6]} 靈錢</span><b>오늘의 출석 도장</b><p>연속으로 찍을수록 영전이 늘어요 · 7일째 +${Store.ATTEND.week[6]}</p></a>`
  ];
  $('#track').innerHTML = slideHTML.join('');

  /* 배너 넘기기 (5초마다) */
  const slides = $$('#track .slide'); let cur = 0, auto;
  $('#dots').innerHTML = slides.map((_, i) => `<button type="button" aria-label="${i + 1}번 배너"></button>`).join('');
  const go = i => {
    cur = (i + slides.length) % slides.length; $('#track').style.transform = `translateX(${-cur * 100}%)`;
    $$('#dots button').forEach((d, j) => d.classList.toggle('on', j === cur));
    $('#hud-no').textContent = `${pad2(cur + 1)} / ${pad2(slides.length)}`;   // HUD 머리: 번호 · 그 배너의 태그
    const tg = slides[cur] && slides[cur].querySelector('.tag'); $('#hud-tag').textContent = tg ? tg.textContent : 'NOTICE';
  };
  const restart = () => { clearInterval(auto); if (!REDUCED && slides.length > 1) auto = setInterval(() => go(cur + 1), 5000); };
  $$('#dots button').forEach((d, i) => d.onclick = () => { go(i); restart(); });
  $('#hud-prev').onclick = () => { go(cur - 1); restart(); };
  $('#hud-next').onclick = () => { go(cur + 1); restart(); };
  go(0); if (!REDUCED && slides.length > 1) auto = setInterval(() => go(cur + 1), 5000);

  /* 버튼 */
  document.addEventListener('click', e => {
    if (e.target.closest('[data-tele]')) { e.preventDefault(); if (window.Telepathy) Telepathy.open('write'); else toast('잠시 후 다시 눌러 주세요.'); }
    if (e.target.closest('[data-music]')) {
      const disc = $('.bgm-disc'); // 관리자 페이지에서 BGM 을 켰으면 그 플레이어를
      if (disc) disc.click(); else toast('관리자 페이지에서 BGM 을 설정하면 들을 수 있어요.');
    }
    if (e.target.closest('#fs')) { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); }
  });
});</script>
<script src="assets/js/serious.js"></script>
</body>
