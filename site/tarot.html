<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; media-src 'self' https: blob:; connect-src 'self' https: wss://*.supabase.co; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사리의 타로 — 三娑罗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Serif+KR:wght@300;400;600&family=Song+Myung&family=Zhi+Mang+Xing&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
body.ta-page { --tx: rgba(232,238,250,.82); --sub: rgba(214,224,245,.52); --ln: rgba(255,255,255,.09); --gold: #e9cf8a;
  background: radial-gradient(ellipse 70% 45% at 75% -8%, rgba(150,120,230,.26), transparent 70%), radial-gradient(ellipse 50% 40% at -5% 105%, rgba(230,160,200,.14), transparent 70%), linear-gradient(#0d0c1d 0%, #151321 55%, #19171d 100%);
  background-attachment: fixed; }
html:has(body.ta-page) { background: #0d0c1d; }
body.ta-page::before { content: ""; display: block; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .85;
  background: radial-gradient(1px 1px at 20px 30px, #fff, transparent), radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,.8), transparent), radial-gradient(1.4px 1.4px at 200px 160px, #fff, transparent),
    radial-gradient(1px 1px at 60px 200px, rgba(255,255,255,.6), transparent), radial-gradient(1px 1px at 250px 40px, rgba(255,255,255,.7), transparent), radial-gradient(1.2px 1.2px at 170px 250px, rgba(220,205,255,.9), transparent);
  background-size: 280px 280px; -webkit-mask: linear-gradient(#000, rgba(0,0,0,.5) 50%, transparent 85%); mask: linear-gradient(#000, rgba(0,0,0,.5) 50%, transparent 85%); animation: taTw 5s ease-in-out infinite; }
body.ta-page::after { display: none; }
@keyframes taTw { 50% { opacity: .5; } }
.ta { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 86px 20px 100px; font-family: var(--sans); color: var(--tx); letter-spacing: -.015em; text-align: center; }
.ta .eb { display: block; font: 600 10.5px var(--sans); letter-spacing: .32em; color: rgba(233,207,138,.7); }
.ta h1 { margin: 8px 0 4px; font: 300 38px 'Noto Serif KR', serif; color: #fff; letter-spacing: .04em; text-shadow: 0 0 24px rgba(200,170,255,.35); }
.ta .lead { margin: 0; font-size: 14px; color: var(--sub); }
.tops { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 24px 0 26px; }
.top { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; text-align: left; background: rgba(255,255,255,.04); border: 1px solid var(--ln); }
.top .av { width: 44px; height: 44px; border-radius: 50%; background: #2a2742 center / cover; flex: none; border: 1px solid rgba(233,207,138,.45); }
.top small { display: block; font: 600 11px var(--sans); letter-spacing: .08em; color: var(--gold); }
.top b { display: block; font: 700 15px var(--sans); color: #fff; margin-top: 2px; } .top span { font-size: 12px; color: var(--sub); }
.top .sc { margin-left: auto; font: 700 22px 'JetBrains Mono', monospace; color: #fff; } .top.none b { color: var(--sub); font-weight: 500; }

/* 사리 */
.sari-row { display: flex; align-items: center; gap: 14px; max-width: 620px; margin: 0 auto 18px; text-align: left; }
.sari { width: 96px; height: 96px; object-fit: contain; image-rendering: pixelated; flex: none; filter: drop-shadow(0 6px 14px rgba(150,110,255,.45)); animation: sariBob 3s ease-in-out infinite; }
@keyframes sariBob { 50% { transform: translateY(-5px); } }
.bub { position: relative; flex: 1; min-width: 0; padding: 12px 15px; border-radius: 16px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); font-size: 14.5px; line-height: 1.6; color: #fff; }
.bub::before { content: ""; position: absolute; left: -7px; top: 50%; width: 12px; height: 12px; margin-top: -6px; transform: rotate(45deg); background: #1c1a2c; border-left: 1px solid rgba(255,255,255,.12); border-bottom: 1px solid rgba(255,255,255,.12); }
.bub b { display: block; font: 600 11.5px var(--sans); letter-spacing: .08em; color: var(--gold); margin-bottom: 4px; }

/* 설정 */
.setup { max-width: 620px; margin: 0 auto; display: grid; gap: 14px; text-align: left; }
.setup label { font: 600 12px var(--sans); color: var(--sub); letter-spacing: .04em; }
.setup input { width: 100%; box-sizing: border-box; font: 15px var(--sans); color: #fff; background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.14); border-radius: 12px; padding: 12px 13px; outline: none; box-shadow: none; margin-top: 6px; }
.setup input:focus { border-color: rgba(233,207,138,.6); }
.setup small { display: block; margin-top: 6px; font-size: 11.5px; color: var(--sub); }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 6px; }
.opt { padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.04); border: 1px solid var(--ln); cursor: pointer; text-align: left; color: var(--tx); font-family: var(--sans); }
.opt b { display: block; font: 700 15px var(--sans); color: #fff; } .opt span { font-size: 12px; color: var(--sub); }
.opt.on { border-color: rgba(233,207,138,.75); box-shadow: inset 0 0 0 1px rgba(233,207,138,.5), 0 0 18px -8px rgba(233,207,138,.7); background: rgba(233,207,138,.07); }
.go { justify-self: center; margin-top: 6px; font: 600 15px var(--sans); color: #1a1726; background: #fff; border: 0; border-radius: 999px; padding: 13px 28px; cursor: pointer; }
.go:disabled { opacity: .4; cursor: default; }
.ghost { font: 600 13px var(--sans); color: var(--tx); background: none; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 9px 18px; cursor: pointer; }

/* 카드 뒷면 */
.bk { width: 64px; height: 104px; border-radius: 8px; flex: none;
  background: radial-gradient(circle at 50% 50%, rgba(233,207,138,.32) 0 9px, transparent 10px), repeating-linear-gradient(45deg, rgba(233,207,138,.08) 0 5px, transparent 5px 10px), linear-gradient(160deg, #3a2d63, #1d1836);
  border: 1.5px solid rgba(233,207,138,.6); box-shadow: inset 0 0 0 4px #1d1836, inset 0 0 0 5px rgba(233,207,138,.35), 0 8px 16px -8px rgba(0,0,0,.8); }
/* 섞기 */
.deck { position: relative; width: 64px; height: 104px; margin: 40px auto; }
.deck .bk { position: absolute; inset: 0; animation: shuf 1.1s ease-in-out infinite; }
.deck .bk:nth-child(2) { animation-delay: .15s; } .deck .bk:nth-child(3) { animation-delay: .3s; } .deck .bk:nth-child(4) { animation-delay: .45s; }
@keyframes shuf { 0%, 100% { transform: translate(0, 0) rotate(0); } 30% { transform: translate(-46px, -6px) rotate(-10deg); } 60% { transform: translate(46px, 4px) rotate(10deg); } }
/* 덱 나누기 */
.piles { display: flex; justify-content: center; gap: 34px; margin: 34px 0 10px; }
.pile { position: relative; width: 64px; height: 116px; cursor: pointer; transition: transform .25s; }
.pile .bk { position: absolute; left: 0; } .pile .bk:nth-child(1) { top: 12px; } .pile .bk:nth-child(2) { top: 6px; } .pile .bk:nth-child(3) { top: 0; }
.pile:hover { transform: translateY(-8px); } .pile:hover .bk:nth-child(3) { box-shadow: inset 0 0 0 4px #1d1836, inset 0 0 0 5px rgba(233,207,138,.6), 0 0 22px rgba(233,207,138,.55); }
/* 펼치기 */
.fan { display: flex; flex-wrap: wrap; justify-content: center; gap: 0; margin: 20px auto 0; max-width: 640px; padding: 0 16px; }
.fan .bk { width: 32px; height: 52px; margin: 0 -7px 8px; border-radius: 5px; box-shadow: inset 0 0 0 2px #1d1836, inset 0 0 0 3px rgba(233,207,138,.35), 0 6px 12px -6px rgba(0,0,0,.8); cursor: pointer; transition: transform .18s, box-shadow .18s; position: relative; }
.fan .bk:hover { transform: translateY(-10px); z-index: 2; }
.fan .bk.pk { transform: translateY(-12px); z-index: 3; box-shadow: inset 0 0 0 2px #1d1836, inset 0 0 0 3px rgba(233,207,138,.9), 0 0 14px rgba(233,207,138,.8); }
.fan .bk.pk::after { content: attr(data-n); position: absolute; top: -10px; left: 50%; translate: -50% 0; width: 20px; height: 20px; border-radius: 50%; background: #ffe08a; color: #1a1726; font: 800 11px/20px var(--sans); text-align: center; }
.fan.busy { pointer-events: none; opacity: .6; }
.cnt { margin-top: 8px; font-size: 13px; color: var(--gold); }

/* 펼친 결과 */
.tbd { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 26px 0 8px; }
.tslot { display: grid; justify-items: center; gap: 8px; }
.tslot small { font: 600 11.5px var(--sans); color: var(--gold); letter-spacing: .06em; }
.cd { width: 84px; height: 136px; perspective: 900px; cursor: pointer; }
.cd .in { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.3,.7,.2,1); transform: rotateY(180deg); }
.cd.op .in { transform: rotateY(0); }
.cd .fc, .cd .bk { position: absolute; inset: 0; width: auto; height: auto; backface-visibility: hidden; border-radius: 10px; }
.cd .bk { transform: rotateY(180deg); }
.cd .fc { display: grid; grid-template-rows: auto 1fr auto; padding: 8px 5px; text-align: center; background: linear-gradient(170deg, #fbf6ea, #efe3c8); border: 1.5px solid #c9a95c; box-shadow: inset 0 0 0 4px #fbf6ea, inset 0 0 0 5px rgba(170,130,60,.5), 0 16px 30px -16px rgba(0,0,0,.9); color: #3b2f52; }
.cd .fc.rev > * { transform: rotate(180deg); }
.cd .no { font: 600 9.5px 'Noto Serif KR', serif; letter-spacing: .16em; color: #9b7a3a; }
.cd .sy { display: grid; place-items: center; font-size: 32px; line-height: 1; color: #5a3f8c; }
.cd .nm { font: 600 11px 'Noto Serif KR', serif; color: #3b2f52; word-break: keep-all; }
.cd.mj .fc { background: linear-gradient(170deg, #fdf3dc, #ead6a8); } .cd.mj .sy { color: #7a4fc7; }

/* 리딩 */
.read { max-width: 680px; margin: 26px auto 0; text-align: left; }
.score { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 16px; background: rgba(255,255,255,.05); border: 1px solid var(--ln); }
.score b { font: 700 34px 'JetBrains Mono', monospace; color: #fff; } .score span { font: 600 14px var(--sans); color: var(--gold); }
.score .meter { flex: 1; height: 8px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
.score .meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #b48cff, #ffb3d1, #ffe08a); transition: width 1.2s cubic-bezier(.2,.8,.2,1) .2s; }
.read h3 { margin: 24px 0 8px; font: 700 16px var(--sans); color: #fff; }
.read p { margin: 0; font-size: 15px; line-height: 1.9; color: var(--tx); word-break: keep-all; }
.read .q { padding: 10px 14px; border-radius: 12px; background: rgba(255,255,255,.04); font-size: 14px; color: var(--sub); margin-top: 14px; }
.again { display: flex; gap: 8px; justify-content: center; margin-top: 28px; }
.mine { margin: 36px auto 0; max-width: 680px; text-align: left; }
.mine h4 { font: 600 12px var(--sans); letter-spacing: .14em; color: var(--sub); margin: 0 0 8px; }
.mine ul { margin: 0; padding: 0; } .mine li { display: flex; gap: 10px; padding: 8px 2px; border-top: 1px solid var(--ln); font-size: 13px; list-style: none; }
.mine li b { color: #fff; font-weight: 600; } .mine li span { margin-left: auto; font-family: 'JetBrains Mono', monospace; color: #fff; }
@media (max-width: 640px) {
  .tops { grid-template-columns: 1fr; } .ta h1 { font-size: 30px; } .sari { width: 72px; height: 72px; }
  .cd { width: 64px; height: 104px; } .cd .sy { font-size: 24px; } .cd .nm { font-size: 9.5px; } .fan .bk { width: 24px; height: 40px; margin: 0 -5px 6px; }
}
</style>
</head>
<body data-page="tarot" class="ta-page" data-nofooter>
<main class="ta" id="ta"><span class="eb">TAROT</span><h1>사리의 타로</h1><p class="lead">불러오는 중…</p></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/tarot-data.js"></script>
<script>
App.ready.then(async user => {
  if (!user) { location.replace('login.html?next=tarot.html'); return; }
  const T = window.Tarot, ta = $('#ta');
  const SARI = 'assets/img/mascot/sari-tarot.webp', SARI_FB = 'assets/img/mascot/sm/cat1.webp';   // 사리 그림 (없으면 원래 사리)
  const avStyle = h => { h = h ? ((window.headMp4 && headMp4(h) || {}).poster || h) : ''; return h ? `background-image:url('${esc(h)}')` : ''; };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  // q: 사리에게 한 질문 · 이 화면에만 있고 서버로 보내지 않아요
  let today = { love: null, money: null, mine: [] }, kind = 'love', spread = 3, q = '', step = 'setup', picks = [], res = null, opened = new Set(), busy = false;

  const head = () => `<span class="eb">TAROT</span><h1>사리의 타로</h1><p class="lead">사리에게 물어보고 카드를 펼쳐 봐요</p>
    <div class="tops">${['love', 'money'].map(k => { const t = today[k]; return t ? `<div class="top"><span class="av" style="${avStyle(t.head)}"></span><div><small>오늘 ${T.KN[k]} 1위</small><b>${esc(t.who)}${t.me ? ' · 나' : ''}</b><span>${T.CARDS[t.card].nm}${t.rev ? ' 역방향' : ''} · ${T.SPREADS[t.spread || 1].name}</span></div><span class="sc">${t.score}</span></div>`
      : `<div class="top none"><span class="av"></span><div><small>오늘 ${T.KN[k]} 1위</small><b>아직 아무도 안 봤어요</b></div></div>`; }).join('')}</div>`;
  const sari = (title, text) => `<div class="sari-row"><img class="sari" src="${SARI}" onerror="this.onerror=null;this.src='${SARI_FB}'" alt="사리"><div class="bub"><b>${title}</b>${text}</div></div>`;
  const mine = () => today.mine.length ? `<div class="mine"><h4>오늘 내가 본 타로</h4><ul>${today.mine.map(m => `<li><b>${T.KN[m.kind]}</b>${T.SPREADS[m.spread || 1].name} · ${(m.cards || []).map(c => T.CARDS[c.c].nm + (c.r ? '(역)' : '')).join(' · ')}<span>${m.score}</span></li>`).join('')}</ul></div>` : '';
  const face = (c, r) => { const k = T.CARDS[c]; return `<div class="fc ${r ? 'rev' : ''}"><span class="no">${k.no}</span><span class="sy">${k.g}</span><span class="nm">${k.nm}</span></div>`; };

  function draw() {
    const S = T.SPREADS[spread], P = S.pos[kind];
    let body = '';
    if (step === 'setup') body = sari('사리에게 물어보기', '궁금한 걸 떠올리거나 적어 주세요<br>주제랑 장수를 고르면 사리가 카드를 섞어 드릴게요') + `<div class="setup">
        <div><label>질문 · 안 적어도 돼요</label><input id="q" maxlength="80" placeholder="예) 요즘 신경 쓰이는 그 사람과 잘 될까요" value="${esc(q)}" autocomplete="off"><small>질문은 서버로 보내지 않아서 어디에도 남지 않아요 · 이 화면을 닫으면 사라져요</small></div>
        <div><label>주제</label><div class="opts">${['love', 'money'].map(k => `<button type="button" class="opt ${k === kind ? 'on' : ''}" data-kind="${k}"><b>${T.KN[k]}</b><span>${k === 'love' ? '마음 · 관계 · 인연' : '돈의 흐름 · 수입 · 지출'}</span></button>`).join('')}</div></div>
        <div><label>펼칠 장수</label><div class="opts">${[1, 3, 5].map(n => { const s = T.SPREADS[n]; return `<button type="button" class="opt ${n === spread ? 'on' : ''}" data-sp="${n}"><b>${s.name} · ${s.price} 영전</b><span>${s.pos[kind].join(' · ')}</span></button>`; }).join('')}</div></div>
        <button type="button" class="go" data-go>사리에게 섞어 달라고 하기</button></div>`;
    else if (step === 'shuffle') body = sari('사리', '78장을 섞는 중이다냥<br>질문을 한 번 더 떠올려 주세요') + '<div class="deck"><div class="bk"></div><div class="bk"></div><div class="bk"></div><div class="bk"></div></div>';
    else if (step === 'cut') body = sari('사리', '덱을 세 묶음으로 나눴어요<br>마음이 가는 묶음을 골라 주세요') + `<div class="piles">${[0, 1, 2].map(i => `<div class="pile" data-pile="${i}"><div class="bk"></div><div class="bk"></div><div class="bk"></div></div>`).join('')}</div>`;
    else if (step === 'pick') body = sari('사리', `카드를 펼쳤어요<br>끌리는 카드를 ${spread}장 골라 주세요<br>고른 순서대로 ${P.join(' · ')} 자리에 놓여요`) +
      `<div class="fan ${busy ? 'busy' : ''}">${Array.from({ length: 78 }, (_, i) => { const n = picks.indexOf(i); return `<div class="bk ${n >= 0 ? 'pk' : ''}" data-pk="${i}" ${n >= 0 ? `data-n="${n + 1}"` : ''}></div>`; }).join('')}</div>
       <p class="cnt">${picks.length} / ${spread}장 · ${T.SPREADS[spread].price} 영전</p>`;
    else if (step === 'read') {
      const all = opened.size >= res.cards.length;
      body = sari('사리', all ? '다 뒤집었어요<br>사리가 읽어 드릴게요' : '카드를 하나씩 눌러서 뒤집어 보세요') +
        `<div class="tbd">${res.cards.map((x, i) => `<div class="tslot"><small>${P[i]}</small><div class="cd ${opened.has(i) ? 'op' : ''} ${T.CARDS[x.c].major ? 'mj' : ''}" data-op="${i}"><div class="in">${face(x.c, x.r)}<div class="bk"></div></div></div></div>`).join('')}</div>
         ${all ? '' : '<button type="button" class="ghost" data-all>모두 뒤집기</button>'}`;
      if (all) {
        const R = T.reading(kind, spread, res.cards, res.score, res.flags, q), g = T.grade(res.score);
        body += `<div class="read">
          <div class="score"><b>${res.score}</b><span>${T.KN[kind]} · ${T.GRADE_NM[g]}</span><div class="meter"><i id="mt"></i></div></div>
          ${q ? `<div class="q">Q. ${esc(q)}</div>` : ''}
          <h3>결론</h3><p>${R.conclusion.map(esc).join('<br>')}</p>
          ${R.cards.map(c => `<h3>${esc(c.title)}</h3><p>${c.lines.map(esc).join('<br>')}</p>`).join('')}
          <h3>이렇게 읽은 이유</h3><p>${R.reason.map(esc).join('<br>')}</p>
          <div class="again"><button type="button" class="ghost" data-new>다른 질문하기</button><button type="button" class="go" data-same>같은 설정으로 한 번 더</button></div></div>`;
      }
    }
    ta.innerHTML = head() + body + mine();
    if (step === 'read' && opened.size >= res.cards.length) requestAnimationFrame(() => { const m = $('#mt'); if (m) m.style.width = res.score + '%'; });
  }

  async function ritual() {
    step = 'shuffle'; draw(); await wait(1800);
    step = 'cut'; draw();
  }
  async function submit() {
    busy = true; draw();
    try { res = await Store.tarotRead(kind, spread); today = res.today || today; opened = new Set(); step = 'read'; toast(`${T.SPREADS[spread].price} 영전을 냈어요 · 남은 영전 ${Number(res.coins).toLocaleString()}`); }
    catch (e) { toast(e.message, 'err'); picks = []; }
    busy = false; draw();
  }

  ta.addEventListener('click', async e => {
    const t = e.target;
    if (step === 'setup') {
      const k = t.closest('[data-kind]'); if (k) { q = $('#q').value; kind = k.dataset.kind; return draw(); }
      const s = t.closest('[data-sp]'); if (s) { q = $('#q').value; spread = +s.dataset.sp; return draw(); }
      if (t.closest('[data-go]')) { q = ($('#q').value || '').trim().slice(0, 80); picks = []; return ritual(); }
    }
    if (step === 'cut' && t.closest('[data-pile]')) { step = 'pick'; picks = []; return draw(); }
    if (step === 'pick' && !busy) { const b = t.closest('[data-pk]'); if (!b) return; const i = +b.dataset.pk, n = picks.indexOf(i);
      if (n >= 0) picks.splice(n, 1); else if (picks.length < spread) picks.push(i);
      if (picks.length === spread) { draw(); await wait(500); return submit(); }
      return draw(); }
    if (step === 'read') {
      const c = t.closest('[data-op]'); if (c) { opened.add(+c.dataset.op); return draw(); }
      if (t.closest('[data-all]')) { res.cards.forEach((_, i) => opened.add(i)); return draw(); }
      if (t.closest('[data-new]')) { q = ''; step = 'setup'; return draw(); }
      if (t.closest('[data-same]')) { picks = []; return ritual(); }
    }
  });

  try { today = await Store.tarotToday(); } catch (e) { ta.innerHTML = `<span class="eb">TAROT</span><h1>사리의 타로</h1><p class="lead">${esc(e.message)}</p>`; return; }
  draw();
});
</script>
</body>
